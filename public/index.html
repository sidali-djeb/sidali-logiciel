function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function backupPayload(){ return {app:'suivi-production-dj', version:18, exportedAt:new Date().toISOString(), data:DATA}; }
function exportJSON(){ downloadFile('sauvegarde_djebs_'+todayISO()+'.json', JSON.stringify(backupPayload()), 'application/json'); }
function csvCell(v){ if(typeof v==='number' && !Number.isInteger(v)) v = String(v).replace('.',','); return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function csvFile(name, header, rows){
  const lines = [header].concat(rows).map(r=>r.map(csvCell).join(';'));
  downloadFile(name, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
}
const CSV_CMD_HEAD = ['Référence','Client','Article','Tissu','Couleur','Quantité','Date commande','Livraison prévue','Urgent','Responsable','Total (DA)','Découpe','Confection','Emballage','Quantité reçue','Payé (DA)','Reste (DA)','Conso globale (kg)'];
function parseCSV(text){
  text = String(text||'').replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.split(';').length>=first.split(',').length && first.indexOf(';')>=0) ? ';' : (first.indexOf('\t')>=0 ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur += ch;
    } else if(ch==='"') q = true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur += ch;
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function normKey(h){ return String(h||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function csvDate(v){
  v = String(v||'').trim(); if(!v) return '';
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(v); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
function csvToCommandes(rows){
  if(rows.length<2) return {list:[], skipped:0, error:'Le fichier ne contient pas de lignes de commandes.'};
  const keys = rows[0].map(normKey);
  const idx = names => { for(const n of names){ const i = keys.indexOf(n); if(i>=0) return i; } return -1; };
  const col = {
    reference: idx(['reference','ref']), client: idx(['client']), article: idx(['article','produit']), tissu: idx(['tissu']), couleur: idx(['couleur']),
    quantite: idx(['quantite','qte','quantite pieces']), dateCommande: idx(['date commande','date de commande']), liv: idx(['livraison prevue','date de livraison prevue','livraison']),
    urgent: idx(['urgent']), resp: idx(['responsable','commercial']), total: idx(['total da','total','montant total da','montant total'])
  };
  if(col.client<0 && col.article<0 && col.reference<0) return {list:[], skipped:0, error:'Colonnes non reconnues. Utilise le fichier « Exporter les commandes (CSV) » comme modèle.'};
  const have = new Set((DATA.commandes||[]).map(c=>String(c.reference||'').trim().toLowerCase()));
  const list = []; let skipped = 0;
  rows.slice(1).forEach((r,i)=>{
    const g = k => col[k]>=0 ? String(r[col[k]]||'').trim() : '';
    if(!g('client') && !g('article') && !g('quantite')){ skipped++; return; }
    const ref = g('reference');
    if(ref && (have.has(ref.toLowerCase()))){ skipped++; return; }
    if(ref) have.add(ref.toLowerCase());
    const c = blankCommande();
    c.id = 'cmd_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5);
    c.reference = ref || '';   // numérotée plus tard si vide
    c.client = g('client'); c.article = g('article'); c.tissu = g('tissu'); c.couleur = g('couleur');
    const q = parseFloat(g('quantite').replace(/\s/g,'').replace(',','.')); c.quantite = isNaN(q) ? '' : q;
    c.dateCommande = csvDate(g('dateCommande')) || todayISO(); c.dateLivraisonPrevue = csvDate(g('liv'));
    c.urgent = /^(oui|yes|1|true|x)$/i.test(g('urgent'));
    const rn = g('resp').toLowerCase();
    const com = rn ? (DATA.people||[]).find(p=>p.role==='commercial' && (p.name||'').toLowerCase()===rn) : null;
    c.commercialId = com ? com.id : '';
    const t = parseFloat(g('total').replace(/\s/g,'').replace(',','.')); c.paiement = {total: isNaN(t)?'':t, versements:[]};
    list.push(c);
  });
  return {list:list, skipped:skipped, error:''};
}
function readFileText(file){
  return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(String(fr.result||'')); fr.onerror = ()=>rej(new Error('lecture')); fr.readAsText(file, 'utf-8'); });
}
function mergeData(inc){
  const rep = {added:{}, ignored:{}};
  function mergeArr(key, uniqFn){
    DATA[key] = DATA[key] || []; const have = new Set(DATA[key].map(uniqFn)); let a=0, ig=0;
    (Array.isArray(inc[key])?inc[key]:[]).forEach(x=>{ const u = uniqFn(x); if(x && !have.has(u)){ DATA[key].push(x); have.add(u); a++; } else ig++; });
    rep.added[key]=a; rep.ignored[key]=ig;
  }
  mergeArr('catalogue', x=>x.id);
  mergeArr('people', x=>x.id);
  mergeArr('messages', x=>x.id);
  mergeArr('evaluations', x=>x.id);
  // commandes : par id ET par référence
  DATA.commandes = DATA.commandes || [];
  const ids = new Set(DATA.commandes.map(c=>c.id)), refs = new Set(DATA.commandes.map(c=>String(c.reference||'').trim().toLowerCase()));
  let a=0, ig=0;
  (Array.isArray(inc.commandes)?inc.commandes:[]).forEach(c=>{
    const r = String(c.reference||'').trim().toLowerCase();
    if(c && !ids.has(c.id) && !(r && refs.has(r))){ DATA.commandes.push(c); ids.add(c.id); if(r) refs.add(r); a++; } else ig++;
  });
  rep.added.commandes=a; rep.ignored.commandes=ig;
  // listes : on ajoute ce qui manque
  if(inc.lists){
    DATA.lists = DATA.lists || {tailles:[], tissus:{}};
    (inc.lists.tailles||[]).forEach(t=>{ if(DATA.lists.tailles.indexOf(t)<0) DATA.lists.tailles.push(t); });
    Object.keys(inc.lists.tissus||{}).forEach(t=>{
      DATA.lists.tissus[t] = DATA.lists.tissus[t] || [];
      (inc.lists.tissus[t]||[]).forEach(c=>{ if(DATA.lists.tissus[t].indexOf(c)<0) DATA.lists.tissus[t].push(c); });
    });
  }
  return rep;
}

// lit un CSV et renvoie {keys, rows, col(names...) , get(row,names...)}
async function readCSVFile(file){
  const rows = parseCSV(await readFileText(file));
  if(rows.length < 2) throw new Error('vide');
  const keys = rows[0].map(normKey);
  const idx = names => { for(const n of names){ const i = keys.indexOf(n); if(i>=0) return i; } return -1; };
  return {keys:keys, rows:rows.slice(1), idx:idx, get:(r,names)=>{ const i = idx(names); return i>=0 ? String(r[i]||'').trim() : ''; }};
}

function importVersementsFile(f){
  readCSVFile(f).then(d=>{
    if(d.idx(['reference','ref'])<0 || d.idx(['montant da','montant'])<0) throw new Error('col');
    const todo = []; let skipped = 0;
    d.rows.forEach(r=>{
      const ref = d.get(r,['reference','ref']).toLowerCase();
      const m = num(d.get(r,['montant da','montant']));
      const cs = (DATA.commandes||[]).filter(c=>String(c.reference||'').trim().toLowerCase()===ref);
      const c = cs.length ? cs[cs.length-1] : null;
      if(!c || !m || m<=0){ skipped++; return; }
      const date = csvDate(d.get(r,['date'])) || todayISO(), note = d.get(r,['note']);
      const dup = (c.paiement && c.paiement.versements || []).some(v=>v.date===date && Number(v.montant)===m && (v.note||'')===note) || todo.some(t=>t.c===c && t.v.date===date && t.v.montant===m && t.v.note===note);
      if(dup){ skipped++; return; }
      todo.push({c:c, v:{id:'v_'+Date.now()+'_'+todo.length+'_'+Math.random().toString(36).slice(2,5), date:date, montant:m, note:note}});
    });

function importListesFile(f){
  readCSVFile(f).then(d=>{
    if(d.idx(['type'])<0 || d.idx(['valeur'])<0) throw new Error('col');
    const L = DATA.lists = DATA.lists || {tailles:[], tissus:{}}; L.tailles = L.tailles||[]; L.tissus = L.tissus||{};
    const add = {tailles:[], tissus:[], couleurs:[]};
    const tIn = {}; // tissus déjà prévus dans ce fichier
    d.rows.forEach(r=>{
      const type = normKey(d.get(r,['type'])), val = d.get(r,['valeur']), tis = d.get(r,['tissu']);
      if(!val) return;
      if(type==='taille' && L.tailles.indexOf(val)<0 && add.tailles.indexOf(val)<0) add.tailles.push(val);
      else if(type==='tissu' && !L.tissus[val] && add.tissus.indexOf(val)<0) add.tissus.push(val);
      else if(type==='couleur' && tis){
        const val2 = val.toUpperCase();
        if(!(L.tissus[tis]||[]).includes(val2) && !add.couleurs.some(x=>x[0]===tis && x[1]===val2)) add.couleurs.push([tis,val2]);
      }
    });
    const n = add.tailles.length+add.tissus.length+add.couleurs.length;
    if(!n){ alert('Rien de nouveau à importer : tout existe déjà.'); return; }
    openImport(f.name, n+' élément(s) à ajouter.', [add.tailles.length+' taille(s) : '+add.tailles.join(', '), add.tissus.length+' tissu(s) : '+add.tissus.join(', '), add.couleurs.length+' couleur(s) : '+add.couleurs.map(x=>x[1]+' ('+x[0]+')').slice(0,8).join(', ')], 'Importer', ()=>{
      add.tailles.forEach(t=>L.tailles.push(t));
      add.tissus.forEach(t=>{ L.tissus[t] = L.tissus[t] || []; });
      add.couleurs.forEach(x=>{ L.tissus[x[0]] = L.tissus[x[0]] || []; L.tissus[x[0]].push(x[1]); });
      return n+' élément(s) importé(s)';
    });
  }).catch(()=>importFail());
}

function importAccesFile(f){
  readCSVFile(f).then(d=>{
    if(d.idx(['nom','name'])<0 || d.idx(['role'])<0) throw new Error('col');
    const haveE = new Set((DATA.people||[]).map(p=>String(p.email||'').trim().toLowerCase()).filter(Boolean));
    const haveN = new Set((DATA.people||[]).map(p=>String(p.name||'').trim().toLowerCase()));
    const list = []; const skip = [];
    d.rows.forEach((r,i)=>{
      const name = d.get(r,['nom','name']), email = d.get(r,['email']), code = d.get(r,['code']).replace(/\s/g,'');
      const roleKey = normKey(d.get(r,['role']));
      const role = ROLE_FROM_TEXT[roleKey];
      if(!name){ return; }
      if(!role){ skip.push(name+' (rôle inconnu)'); return; }
      if(!/^\d{4}$/.test(code)){ skip.push(name+' (code à 4 chiffres manquant)'); return; }
      if((email && haveE.has(email.toLowerCase())) || haveN.has(name.toLowerCase())){ skip.push(name+' (existe déjà)'); return; }
      if(email) haveE.add(email.toLowerCase()); haveN.add(name.toLowerCase());
      list.push({id:'p_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5), name:name, email:email, role:role, code:code, active:!/^(non|no|0|false)$/i.test(d.get(r,['actif']))});
    });
    if(!list.length){ alert('Aucune personne à importer.'+(skip.length?'\n'+skip.slice(0,6).join('\n'):'')); return; }
    openImport(f.name, list.length+' personne(s) à ajouter'+(skip.length?' · '+skip.length+' ignorée(s)':'')+'.', list.map(p=>p.name+' · '+(ROLE_LABEL[p.role]||p.role)).concat(skip.slice(0,4).map(s=>'⚠ ignoré : '+s)), 'Importer ces accès', ()=>{
      list.forEach(p=>DATA.people.push(p));
      return list.length+' accès importé(s)';
    });
  }).catch(()=>importFail());
}

      DATA = Object.assign({}, keep, d);

    };
    actions.appendChild(cancel); actions.appendChild(merge); actions.appendChild(repl);

  m.appendChild(actions);

  return {id:'p_'+Date.now(), name:'', email:'', role:'decoupe', code:'', active:true, departement:'confection'};

// ----- Départements -----
function deptList(){
  if(!Array.isArray(DATA.departements)) DATA.departements = [];
  if(!DATA.departements.some(d=>d.id==='confection')) DATA.departements.unshift({id:'confection', nom:'Confection'});
  if(!DATA.departements.some(d=>d.id==='tricotage')) DATA.departements.splice(1,0,{id:'tricotage', nom:'Tricotage'});
  if(!DATA.departements.some(d=>d.id==='personnalisation')) DATA.departements.splice(2,0,{id:'personnalisation', nom:'Personnalisation'});
  if(!DATA.departements.some(d=>d.id==='crea')) DATA.departements.splice(3,0,{id:'crea', nom:'Créa'});
  return DATA.departements;
}
function deptOf(p){ const id = (p && p.departement) || 'confection'; return deptList().some(d=>d.id===id) ? id : 'confection'; }
function deptName(id){ const d = deptList().find(x=>x.id===id); return d ? d.nom : 'Confection'; }

      const x = el('<button class="btn small" style="padding:0 7px;min-height:0;line-height:18px;" title="Supprimer">✕</button>');
      x.onclick = ()=>{
        if(n>0){ alert('Impossible : '+n+' personne(s) sont dans le département '+d.nom+'. Change d\'abord leur département.'); return; }

    field('Rôle / département', data.role, v=>{ data.role=v; data.tiles=undefined; data.triTiles=undefined; data.psTiles=undefined; data.crTiles=undefined; if(v==='tricotage'||v==='personnalisation'||v==='crea'){ data.departement=v; const ds=m.querySelector('select[data-dep]'); if(ds) ds.value=v; } refreshPerm(); }, 'role-select'),

  activeLabel.appendChild(activeInp);
  activeLabel.appendChild(document.createTextNode('Accès actif (décoche pour bloquer sans supprimer)'));
  activeWrap.appendChild(activeLabel);
  m.appendChild(activeWrap);

  function countActiveAdmins(excludeId){
    return (DATA.people||[]).filter(p=>p.role==='admin' && p.active!==false && p.id!==excludeId).length;
  }

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>');

  save.onclick = ()=>{
    if(!data.name || !data.name.trim()){ alert('Le nom est obligatoire.'); return; }

    if(!data.code || !String(data.code).trim()){ alert('Le code est obligatoire.'); return; }
    if(data.role==='tricotage' && Array.isArray(data.triTiles) && !data.triTiles.length){ alert('Coche au moins une case Tricotage.'); return; }
    if(data.role==='personnalisation' && Array.isArray(data.psTiles) && !data.psTiles.length){ alert('Coche au moins une case Personnalisation.'); return; }
    if(ROLE_TILES[data.role] && (!allowedTiles(data).length || (Array.isArray(data.tiles) && !data.tiles.length))){ alert('Coche au moins une case visible.'); return; }
    const wouldBeAdmin = data.role==='admin' && data.active!==false;
    if(!wouldBeAdmin && countActiveAdmins(data.id)===0 && (DATA.people||[]).some(p=>p.id===data.id && p.role==='admin')){
      alert("Impossible : il doit rester au moins un accès Admin actif.");
      return;
    }
    if(mode==='create'){
      DATA.people = DATA.people || [];
      DATA.people.push(data);
      view.personModal=null;
      saveState('Accès ajouté pour '+data.name);
    } else {
      const idx = (DATA.people||[]).findIndex(x=>x.id===data.id);
      if(idx>=0) DATA.people[idx]=data;
      view.personModal=null;
      saveState('Accès modifié pour '+data.name);
    }
  };
  const del = mode==='edit' ? el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>') : null;
  if(del){
    del.onclick = ()=>{
      if(data.role==='admin' && countActiveAdmins(data.id)===0){
        alert("Impossible de supprimer : il doit rester au moins un accès Admin actif.");
        return;
      }
      if(confirm("Supprimer l'accès de "+data.name+' ?')){
        DATA.people = (DATA.people||[]).filter(x=>x.id!==data.id);
        view.personModal=null;
        saveState('Accès supprimé pour '+data.name);
      }
    };
  }
  if(del) actions.appendChild(del);
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.personModal=null; render(); } };
  return overlay;
}

function catDate(iso){
  if(!iso) return '—';
  const d = new Date(iso); if(isNaN(d.getTime())) return '—';
  const p = n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function catOrdersUsing(id){ return (DATA.commandes||[]).filter(c=>c.catalogueId===id).length; }
// Référence produit automatique : #00001, #00002… (suite de la plus grande référence existante)
function catRefNum(r){ const m = String(r||'').trim().match(/^#0*(\d+)$/); return m ? Number(m[1]) : 0; }
function nextCatRef(extra){
  let max = 0; (DATA.catalogue||[]).forEach(p=>{ max = Math.max(max, catRefNum(p.refPatron)); });
  (extra||[]).forEach(r=>{ max = Math.max(max, catRefNum(r)); });
  (((DATA.crea||{}).produits)||[]).forEach(x=>{ max = Math.max(max, catRefNum(x.refProduit)); });
  return '#'+String(max+1).padStart(5,'0');
}
function catNormRef(r){ return String(r||'').replace(/\s+/g,'').toLowerCase(); }
function catRefDoublons(){
  const map = {}; (DATA.catalogue||[]).forEach(p=>{ const k = catNormRef(p.refPatron); if(!k) return; (map[k] = map[k] || []).push(p); });
  return Object.values(map).filter(l=>l.length>1);
}
function catFixDoublons(){
  const d = catRefDoublons(); let n = 0;
  d.forEach(list=>{ list.slice().sort((a,b)=>String(a.creeLe||'').localeCompare(String(b.creeLe||''))).slice(1).forEach(p=>{ p.refPatron = nextCatRef(); p.modifieLe = new Date().toISOString(); n++; }); });
  return n;
}
function catDuplicate(ids){
  const now = new Date().toISOString(); let n = 0;
  ids.forEach((id,i)=>{
    const p = (DATA.catalogue||[]).find(x=>x.id===id); if(!p) return;
    const c = JSON.parse(JSON.stringify(p));
    c.id = 'prod_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5);
    c.article = (p.article||'Produit')+' (copie)';
    c.refPatron = nextCatRef();
    c.creeLe = c.modifieLe = now;
    DATA.catalogue.push(c); n++;
  });
  return n;
}
function catDelete(ids){
  const used = ids.reduce((a,id)=>a+catOrdersUsing(id),0);
  const names = ids.map(id=>{ const p=(DATA.catalogue||[]).find(x=>x.id===id); return p?p.article:''; }).filter(Boolean);
  const msg = (ids.length===1 ? 'Supprimer "'+names[0]+'" du catalogue ?' : 'Supprimer ces '+ids.length+' produits du catalogue ?\n\n'+names.slice(0,8).join('\n')+(names.length>8?'\n…':''))
    + (used ? '\n\nAttention : '+used+' commande(s) utilisent déjà ce(s) produit(s). Elles restent intactes, mais ne seront plus liées au catalogue.' : '')
    + '\n\nCette action est définitive.';
  if(!confirm(msg)) return false;
  DATA.catalogue = (DATA.catalogue||[]).filter(x=>ids.indexOf(x.id)<0);
  view.catSel = {};
  return true;
}

    // ordre des références : #00001, #00002… puis les autres séries (#cl…), puis sans référence

      const act = document.createElement('td'); act.style.whiteSpace='normal'; act.style.minWidth='140px';
      const actSel = document.createElement('select'); actSel.className='cat-act-sel';
      [['','Options…'],['voir','Afficher la fiche'],['lancer','Lancer commande'],['edit','Modifier'],['dup','Dupliquer'],['del','Supprimer']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; actSel.appendChild(o); });
      actSel.onchange = ()=>{
        const v = actSel.value; actSel.value='';
        if(v==='voir'){ view.catView = p.id; render(); }
        else if(v==='lancer') launchFromProduct(p);
        else if(v==='edit'){ view.catalogueModal = {mode:'edit', data:JSON.parse(JSON.stringify(p))}; render(); }
        else if(v==='dup'){ catDuplicate([p.id]); saveState('Produit dupliqué : '+p.article); }
        else if(v==='del'){ if(catDelete([p.id])) saveState('Produit supprimé du catalogue : '+p.article); }
      };
      act.appendChild(actSel);
      tr.appendChild(act);
      tbody.appendChild(tr);
    });
    allCk.checked = list.length>0 && list.every(x=>view.catSel[x.id]);
    fillBulk();
  }
  allCk.onchange = ()=>{ visible().forEach(p=>{ if(allCk.checked) view.catSel[p.id]=true; else delete view.catSel[p.id]; }); fill(); };
  q.oninput = ()=>{ view.catSearch = q.value; fill(); };
  sortSel.onchange = ()=>{ view.catSort = sortSel.value; fill(); };
  fill();
  return box;
}

// ---------- CODE QR + PAIEMENTS ----------
const SITE_URL = 'https://www.djebspilot.com';
function siteBase(){ return /^https?:/.test(location.protocol) ? location.origin : SITE_URL; }
function orderUrl(c){ return siteBase()+'/?cmd='+encodeURIComponent(c.id); }
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function qrSvg(text, px){
  const q = new QRLib(-1, 0); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4; let d = '';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) d += 'M'+(k+m)+' '+(r+m)+'h1v1h-1z';
  const t = n+2*m;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
// Ouvre la commande scannée (QR) juste après la connexion
function applyScan(){
  if(view.crScanId && view.personId){ const cid = view.crScanId; view.crScanId = null; try{ history.replaceState(null, '', location.pathname); }catch(e){} openCreaFromScan(cid); }
  if(view.psScanId && view.personId){ const pid = view.psScanId; view.psScanId = null; try{ history.replaceState(null, '', location.pathname); }catch(e){} openPersoFromScan(pid); }
  if(view.lotScanId && view.personId){ const lid = view.lotScanId; view.lotScanId = null; try{ history.replaceState(null, '', location.pathname); }catch(e){} openLotFromScan(lid); }
  const id = view.scanId;
  if(!id || !view.personId) return;
  view.scanId = null;
  const c = (DATA.commandes||[]).find(x=>x.id===id);
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  if(!c){ setTimeout(()=>showToast('⚠ Commande introuvable'), 400); return; }
  view.focusId = c.id;
  view.searchRef = c.reference;
  view.scrollToFiche = true;
  if(view.role==='admin') view.adminOpen = {recherche:true};
  if(view.role==='superviseur'){ view.orderView = c.id; }
}

function canManagePay(){ return view.role==='admin' || view.role==='commercial'; }
function fmtDA(n){ return (Number(n)||0).toLocaleString('fr-FR', {maximumFractionDigits:2})+' DA'; }
function payInfo(c){
  const p = c.paiement || {};
  const total = Number(p.total) || 0;
  const vers = Array.isArray(p.versements) ? p.versements : [];
  const paye = vers.reduce((a,v)=>a+(Number(v.montant)||0), 0);
  const reste = Math.max(total-paye, 0);
  let statut;
  if(total<=0) statut = 'À définir';
  else if(paye<=0) statut = 'Non payé';
  else if(paye>=total) statut = 'Payé';
  else statut = 'Partiel';
  const dernier = vers.map(v=>v.date||'').filter(Boolean).sort().pop() || '';
  return {total, paye, reste, statut, dernier, vers};
}
const PAY_CLASS = {'Payé':'prete','Partiel':'cours','Non payé':'probleme','À définir':'attente'};
function payPill(st){ return '<span class="pill '+(PAY_CLASS[st]||'attente')+'">'+st+'</span>'; }
function nbNonSoldes(){
  return (DATA.commandes||[]).filter(c=>{ const st = payInfo(c).statut; return st==='Non payé' || st==='Partiel'; }).length;
}

function renderPaymentsPanel(){
  const wrap = document.createElement('div');
  const all = (DATA.commandes||[]).map(c=>({c, pi:payInfo(c)}));
  const sum = (f)=>all.reduce((a,x)=>a+f(x.pi), 0);
  const kpi = el('<div class="kpi-row"></div>');
  kpi.appendChild(el('<div class="kpi"><div class="num" style="font-size:18px;">'+fmtDA(sum(p=>p.total))+'</div><div class="label">Total des commandes</div></div>'));
  kpi.appendChild(el('<div class="kpi" style="background:var(--green);"><div class="num" style="font-size:18px;">'+fmtDA(sum(p=>p.paye))+'</div><div class="label">Déjà encaissé</div></div>'));
  const reste = sum(p=>p.reste);
  kpi.appendChild(el('<div class="kpi'+(reste>0?' alert':'')+'"><div class="num" style="font-size:18px;">'+fmtDA(reste)+'</div><div class="label">Reste à encaisser</div></div>'));
  kpi.appendChild(el('<div class="kpi'+(nbNonSoldes()>0?' alert':'')+'"><div class="num">'+nbNonSoldes()+'</div><div class="label">Commandes non soldées</div></div>'));
  wrap.appendChild(kpi);

  const bar = el('<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;"></div>');
  const filters = [['tous','Toutes'],['Non payé','Non payé'],['Partiel','Partiel'],['Payé','Payé'],['À définir','À définir']];
  const box = document.createElement('div');
  function draw(){
    box.innerHTML = '';
    const q = (view.paySearch||'').trim().toLowerCase();
    const order = {'Non payé':0,'Partiel':1,'À définir':2,'Payé':3};
    const rows = all.filter(x=>(view.payFilter==='tous' || x.pi.statut===view.payFilter) &&
      (!q || (x.c.reference||'').toLowerCase().includes(q) || (x.c.client||'').toLowerCase().includes(q)))
      .slice().reverse().sort((a,b)=>order[a.pi.statut]-order[b.pi.statut]);
    if(rows.length===0){ box.appendChild(el('<div class="empty-msg">Aucune commande dans cette liste.</div>')); return; }
    const tw = document.createElement('div'); tw.className = 'table-wrap';
    const t = document.createElement('table'); t.className = 'main';
    const thead = document.createElement('thead'); const hr = document.createElement('tr');
    ['Référence','Client','Total','Payé','Reste','Statut','Dernier versement',''].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hr.appendChild(th); });
    thead.appendChild(hr); t.appendChild(thead);
    const tb = document.createElement('tbody');
    rows.forEach(({c,pi})=>{
      const tr = document.createElement('tr');
      const td = (html)=>{ const cell=document.createElement('td'); cell.innerHTML=html; tr.appendChild(cell); };
      td('<b>'+esc(c.reference)+'</b>');
      td(esc(c.client));
      td(pi.total>0 ? fmtDA(pi.total) : '—');
      td(fmtDA(pi.paye));
      td(pi.total>0 ? '<b>'+fmtDA(pi.reste)+'</b>' : '—');
      td(payPill(pi.statut));
      td(pi.dernier ? fmtDate(pi.dernier) : '—');
      const act = document.createElement('td');
      const b = document.createElement('button'); b.className='btn small'; b.textContent='Gérer';
      b.onclick = ()=>{ view.payModal = {id:c.id, data:JSON.parse(JSON.stringify(c.paiement||{total:'',versements:[]}))}; render(); };
      if(!RO_MODE) act.appendChild(b);
      tr.appendChild(act);
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); box.appendChild(tw);
  }
  filters.forEach(([key,label])=>{
    const b = el('<button class="btn small'+(view.payFilter===key?' primary':'')+'">'+label+'</button>');
    b.onclick = ()=>{ view.payFilter = key; render(); };
    bar.appendChild(b);
  });
  const sInp = document.createElement('input');
  sInp.placeholder = 'Chercher un client ou une référence';
  sInp.value = view.paySearch || '';
  sInp.style.cssText = 'flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;';
  sInp.oninput = ()=>{ view.paySearch = sInp.value; draw(); };
  bar.appendChild(sInp);
  wrap.appendChild(bar);
  wrap.appendChild(box);
  draw();
  return wrap;
}

function renderPayModal(){
  const c = (DATA.commandes||[]).find(x=>x.id===view.payModal.id);
  if(!c){ view.payModal = null; return document.createElement('div'); }
  const data = view.payModal.data;
  data.versements = data.versements || [];
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal"></div>');
  m.appendChild(el('<h2>Paiement — '+esc(c.reference)+' · '+esc(c.client)+'</h2>'));

  const summary = el('<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;"></div>');
  function updateSummary(){
    const pi = payInfo({paiement:data});
    summary.innerHTML = 'Payé : <b>'+fmtDA(pi.paye)+'</b> · Reste : <b>'+(pi.total>0?fmtDA(pi.reste):'—')+'</b> · '+payPill(pi.statut);

  totWrap.appendChild(totInp);
  m.appendChild(totWrap);
  m.appendChild(summary);

  m.appendChild(el('<div class="grp-head" style="background:#1E7A34">Versements reçus</div>'));
  if(data.versements.length===0){
    m.appendChild(el('<div class="empty-msg" style="padding:8px 0;">Aucun versement pour le moment.</div>'));
  } else {
    data.versements.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(v=>{
      const row = el('<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:6px 2px;font-size:13px;"></div>');

      row.appendChild(rm);
      m.appendChild(row);
    });
  }

  m.appendChild(el('<div class="grp-head" style="background:#3E5C76">Ajouter un versement</div>'));
  const draft = view.payModal.draft = view.payModal.draft || {date:todayISO(), montant:'', note:''};
  const fr = el('<div class="frow"></div>');
  const dW = el('<div><label>Date</label></div>'); const dI = document.createElement('input'); dI.type='date'; dI.value=draft.date; dI.oninput=()=>draft.date=dI.value; dW.appendChild(dI);
  const mW = el('<div><label>Montant reçu (DA)</label></div>'); const mI = document.createElement('input'); mI.type='number'; mI.min='0'; mI.value=draft.montant; mI.oninput=()=>draft.montant=mI.value; mW.appendChild(mI);
  fr.appendChild(dW); fr.appendChild(mW); m.appendChild(fr);
  const nW = el('<div style="margin-bottom:8px;"><label>Note (espèces, virement, chèque…)</label></div>'); const nI = document.createElement('input'); nI.value=draft.note; nI.oninput=()=>draft.note=nI.value; nW.appendChild(nI); m.appendChild(nW);
  const addBtn = el('<button class="btn">+ Ajouter ce versement</button>');
  addBtn.onclick = ()=>{
    const amount = Number(draft.montant);
    if(!amount || amount<=0){ alert('Entre un montant supérieur à 0.'); return; }
    data.versements.push({id:'v_'+Date.now(), date:draft.date||todayISO(), montant:amount, note:(draft.note||'').trim()});
    view.payModal.draft = null;
    render();
  };
  m.appendChild(addBtn);

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>');
  cancel.onclick = ()=>{ view.payModal=null; render(); };
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    c.paiement = data;
    view.payModal = null;
    saveState('Paiement mis à jour : '+c.reference);
  };
  actions.appendChild(cancel); actions.appendChild(save);
  m.appendChild(actions);
  updateSummary();
  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.payModal=null; render(); } };
  return overlay;
}

function printOrdreCoupe(c){

// ---------- PARCOURS D'UNE COMMANDE (Découpe → Confection → Emballage → Stock) ----------
const JOURNEY_ICONS = {
  decoupe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.2 8 20.5 18M8.2 16 20.5 6"/></svg>',
  confection: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3 3 6.5l2.3 3.7L8 8.8V21h8V8.8l2.7 1.4L21 6.5 15.5 3c-.5 1.4-1.7 2.1-3.5 2.1S9 4.4 8.5 3Z"/></svg>',
  emballage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/><path d="M7.5 5.2 16 9.7"/></svg>',
  stock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6v10H3V10Z"/><path d="M7.5 20v-6.5h9V20M7.5 16.7h9"/></svg>'
};
function journeyState(statut){
  if(statut==='Prête') return {state:'done', text:'Terminée'};
  if(statut==='En cours') return {state:'cours', text:'En cours'};
  if(statut==='Problème') return {state:'prob', text:'Problème'};
  if(statut==='Tissu non disponible') return {state:'prob', text:'Tissu manquant'};
  if(statut==='Annulée') return {state:'wait', text:'Annulée'};
  return {state:'wait', text:'En attente'};
}
function journeySteps(c){
  const steps = [
    Object.assign({key:'decoupe', label:'Découpe'}, journeyState(c.decoupe.statut)),
    Object.assign({key:'confection', label:'Confection'}, journeyState(c.confection.statut)),
    Object.assign({key:'emballage', label:'Emballage'}, journeyState(c.emballage.statut))
  ];
  const e = ecartStock(c);
  let st;
  if(e!==null && e===0) st = {state:'done', text:'Reçue'};
  else if(e!==null) st = {state:'prob', text:'Écart '+(e>0?'+':'')+e};
  else if(c.emballage.statut==='Prête') st = {state:'cours', text:'À réceptionner'};
  else st = {state:'wait', text:'En attente'};
  steps.push(Object.assign({key:'stock', label:'Stock'}, st));
  return steps;
}
function renderJourney(c, stepsOverride){
  const wrap = el('<div class="journey"></div>');
  const steps = stepsOverride || journeySteps(c);
  steps.forEach((st,i)=>{
    const prevDone = i>0 && steps[i-1].state==='done';
    const d = el('<div class="jstep '+st.state+(prevDone?' linedone':'')+'"></div>');
    const circle = el('<div class="jc">'+JOURNEY_ICONS[st.key]+'</div>');
    if(st.state==='done') circle.appendChild(el('<div class="jb">✓</div>'));
    if(st.state==='prob') circle.appendChild(el('<div class="jb">!</div>'));
    d.appendChild(circle);
    d.appendChild(el('<div class="jl">'+st.label+'</div>'));
    d.appendChild(el('<div class="js">'+st.text+'</div>'));
    wrap.appendChild(d);
  });
  return wrap;
}

let scanStream = null, scanTimer = null, scanBusy = false, scanLastMsg = 0;
function stopScanner(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
}
function closeScan(){ stopScanner(); view.scanModal = false; render(); }
function extractCmdId(text){

function extractCreaId(text){
  text = String(text||'').trim();
  try{ const u = new URL(text); const id = u.searchParams.get('crea'); if(id) return id; }catch(e){}
  if(/^cr_\d+$/.test(text)) return text;

function openCreaFromScan(id){
  const x = crProd(id);
  if(!x){ showToast('⚠ Création introuvable'); return false; }
  view.crView = x.id;
  if(view.role==='admin'){ view.adminDept='crea'; view.adminOpen={}; try{ localStorage.setItem('dj_dept','crea'); }catch(e){} }

async function handleScanText(text){
  const crId = extractCreaId(text);
  if(crId){
    if(!crProd(crId)) await loadDataFromSupabase();
    if(!crProd(crId)){ if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Création introuvable'); } return false; }
    stopScanner(); view.scanModal = false; openCreaFromScan(crId); render(); return true;
  }
  const psId = extractPersoId(text);
  if(psId){
    if(!psJob(psId)) await loadDataFromSupabase();
    if(!psJob(psId)){ if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Commande introuvable'); } return false; }
    stopScanner(); view.scanModal = false; openPersoFromScan(psId); render(); return true;
  }
  const lotId = extractLotId(text);
  if(lotId){
    if(!trLot(lotId)) await loadDataFromSupabase();
    if(!trLot(lotId)){ if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Lot introuvable'); } return false; }
    stopScanner(); view.scanModal = false; openLotFromScan(lotId); render(); return true;
  }
  const id = extractCmdId(text);
  if(!id){
    if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Ce code QR n\'est pas une commande'); }
    return false;
  }
  let c = (DATA.commandes||[]).find(x=>x.id===id);
  if(!c){ await loadDataFromSupabase(); c = (DATA.commandes||[]).find(x=>x.id===id); }
  if(!c){
    if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Commande introuvable'); }
    return false;
  }
  stopScanner();
  view.scanModal = false;
  view.focusId = c.id;
  view.searchRef = c.reference;
  view.scrollToFiche = true;
  if(view.role==='admin') view.adminOpen = {recherche:true};
  if(view.role==='superviseur'){ view.orderView = c.id; }
  render();
  if(view.role!=='admin' && view.role!=='commercial') window.scrollTo(0,0);
  return true;
}
function loadJsQR(){
  if(window.jsQR) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    sc.onload = resolve;
    sc.onerror = ()=>reject(new Error('jsqr'));
    document.head.appendChild(sc);
  });
}
function qrFromCanvasSource(src, w, h){
  const maxW = 800;
  const k = w>maxW ? maxW/w : 1;
  const cw = Math.round(w*k), ch = Math.round(h*k);
  const cv = qrFromCanvasSource.cv || (qrFromCanvasSource.cv = document.createElement('canvas'));
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(src, 0, 0, cw, ch);
  const img = ctx.getImageData(0, 0, cw, ch);
  const code = window.jsQR(img.data, cw, ch);
  return code ? code.data : null;
}
async function decodeSource(src, w, h){
  if('BarcodeDetector' in window){
    if(!decodeSource.det) decodeSource.det = new BarcodeDetector({formats:['qr_code']});
    const r = await decodeSource.det.detect(src);
    return r.length ? r[0].rawValue : null;
  }
  await loadJsQR();
  if(!w) return null;
  return qrFromCanvasSource(src, w, h);
}
async function startScanner(video, status){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent = 'Caméra indisponible sur ce navigateur. Utilise « Prendre une photo du QR ».';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
  }catch(e){
    status.textContent = 'Caméra bloquée. Autorise la caméra pour ce site, ou utilise « Prendre une photo du QR ».';
    return;
  }
  if(!view.scanModal){ stopScanner(); return; }
  video.srcObject = scanStream;
  video.muted = true;
  video.setAttribute('playsinline', '');
  try{ await video.play(); }catch(e){}
  status.textContent = 'Place le code QR devant la caméra…';
  scanTimer = setInterval(async ()=>{
    if(scanBusy || !video.videoWidth) return;
    scanBusy = true;
    try{
      const txt = await decodeSource(video, video.videoWidth, video.videoHeight);
      if(txt) await handleScanText(txt);
    }catch(e){
      if(e && e.message==='jsqr'){
        status.textContent = "Scanner indisponible (pas de connexion). Utilise l'appareil photo du téléphone pour scanner.";
        stopScanner();
      }
    }
    scanBusy = false;
  }, 300);
}
async function scanFromFile(file, status){
  if(!file) return;
  status.textContent = 'Lecture de la photo…';
  try{
    const bmp = await createImageBitmap(file);
    const txt = await decodeSource(bmp, bmp.width, bmp.height);
    if(!txt){ status.textContent = 'Aucun code QR trouvé sur cette photo. Réessaie de plus près.'; return; }
    const ok = await handleScanText(txt);
    if(!ok) status.textContent = 'Ce code QR ne correspond à aucune commande.';
  }catch(e){
    status.textContent = 'Impossible de lire cette photo.';
  }
}
function renderScanModal(){

  setTimeout(()=>startScanner(video, status), 0);

const AN_COL = {bar:'#001D51', barHover:'#2B4C8A', track:'#EEF1F6', grid:'#E3DFD9', wait:'#C9D3E0'};
let anTipEl = null;
function anTip(){
  if(!anTipEl){ anTipEl = document.createElement('div'); anTipEl.className = 'an-tip'; document.body.appendChild(anTipEl); }
  return anTipEl;
}
function anHideTip(){ if(anTipEl) anTipEl.style.display = 'none'; }
function anShowTip(x, y, title, value, sub){
  const t = anTip();
  t.textContent = '';
  const v = document.createElement('div'); v.className = 'an-tip-v'; v.textContent = value; t.appendChild(v);
  const a = document.createElement('div'); a.className = 'an-tip-t'; a.textContent = title; t.appendChild(a);

  t.style.display = 'block';
  const w = t.offsetWidth, h = t.offsetHeight;
  let left = x + 14, top = y + 14;
  if(left + w > window.innerWidth - 8) left = x - w - 14;
  if(left < 8) left = 8;
  if(top + h > window.innerHeight - 8) top = y - h - 14;
  t.style.left = left + 'px'; t.style.top = top + 'px';
}
function anBind(node, title, value, sub){
  node.tabIndex = 0;
  node.addEventListener('pointermove', e=>anShowTip(e.clientX, e.clientY, title, value, sub));
  node.addEventListener('pointerleave', anHideTip);
  node.addEventListener('focus', ()=>{ const r = node.getBoundingClientRect(); anShowTip(r.left + r.width/2, r.top, title, value, sub); });
  node.addEventListener('blur', anHideTip);

function anNum(n){ return Number(n||0).toLocaleString('fr-FR', {maximumFractionDigits:0}); }
function anDA(n){ return anNum(n)+' DA'; }
function anDAshort(n){ n = Number(n)||0; return n>=1000000 ? (n/1000000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' M DA' : n>=10000 ? Math.round(n/1000).toLocaleString('fr-FR')+' k DA' : anNum(n)+' DA'; }
function anDays(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function anMonthLabel(key){

function anNiceMax(v){
  if(v<=0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/pow;
  const f = n<=1 ? 1 : n<=2 ? 2 : n<=5 ? 5 : 10;
  return f*pow;
}
function anTickLabel(v){ return v>=1000000 ? (v/1000000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M' : v>=10000 ? (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' k' : v.toLocaleString('fr-FR',{maximumFractionDigits:1}); }

function anGroup(orders, keyFn, valFn){
  const m = {};
  orders.forEach(c=>{
    const k = keyFn(c); if(!k) return;
    m[k] = m[k] || {key:k, value:0, n:0, da:0, reste:0};
    m[k].value += valFn(c); m[k].n += 1;
    const pi = payInfo(c); m[k].da += pi.total; m[k].reste += pi.reste;

function renderAnalyticsPanel(){
  anHideTip();
  const root = document.createElement('div');
  const orders = anOrders();
  const today = todayISO();

  // ---- filtre période : une seule ligne au-dessus, il agit sur tout ----
  const bar = el('<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;"></div>');
  bar.appendChild(el('<span style="font-size:12px;color:var(--text-soft);margin-right:4px;">Période (date de commande) :</span>'));
  [['tout','Tout'],['30','30 jours'],['90','90 jours'],['365','12 mois']].forEach(([k,l])=>{
    const b = el('<button class="btn small'+((view.anPeriod||'tout')===k?' primary':'')+'">'+l+'</button>');
    b.onclick = ()=>{ view.anPeriod = k; render(); };
    bar.appendChild(b);
  });
  root.appendChild(bar);

  if(orders.length===0){
    root.appendChild(anEmpty('Aucune commande sur cette période.'));
    return root;
  }

  // ---- calculs ----
  const steps = orders.map(c=>({c, st:journeySteps(c)}));
  const received = orders.filter(c=>ecartStock(c)!==null);
  const active = orders.filter(c=>ecartStock(c)===null && !(c.decoupe.statut==='Annulée'));
  const late = active.filter(c=>c.dateLivraisonPrevue && c.dateLivraisonPrevue < today);
  const pieces = orders.reduce((a,c)=>a+(Number(c.quantite)||0), 0);
  const withDates = received.filter(c=>c.dateLivraisonPrevue && c.stock.dateReception);
  const onTime = withDates.filter(c=>c.stock.dateReception <= c.dateLivraisonPrevue);
  const delays = received.filter(c=>c.dateCommande && c.stock.dateReception).map(c=>anDays(c.dateCommande, c.stock.dateReception)).filter(d=>d>=0);
  const avgDelay = delays.length ? Math.round(delays.reduce((a,b)=>a+b,0)/delays.length) : null;
  const pays = orders.map(payInfo);
  const totDA = pays.reduce((a,p)=>a+p.total,0), payeDA = pays.reduce((a,p)=>a+p.paye,0), resteDA = pays.reduce((a,p)=>a+p.reste,0);

  // ---- tuiles chiffres clés ----
  const stats = el('<div class="an-stats"></div>');
  stats.appendChild(anStat('Commandes', anNum(orders.length), anNum(pieces)+' pièces'));
  stats.appendChild(anStat('En production', anNum(active.length), anNum(received.length)+' reçues en stock'));
  stats.appendChild(anStat('En retard', anNum(late.length), 'livraison prévue dépassée', late.length>0));
  stats.appendChild(anStat('Livrées à temps', withDates.length ? Math.round(onTime.length/withDates.length*100)+' %' : '—', withDates.length ? onTime.length+' sur '+withDates.length : 'pas encore de réception'));
  stats.appendChild(anStat('Délai moyen', avgDelay===null ? '—' : avgDelay+' jours', 'commande → réception stock'));
  stats.appendChild(anStat('Reste à encaisser', anDAshort(resteDA), 'sur '+anDAshort(totDA)+' au total', resteDA>0));
  root.appendChild(stats);

  const grid = el('<div class="an-grid"></div>');

  // ---- 1. Pipeline de production ----
  const pc = anCard('Où en sont les commandes', 'Nombre de commandes par étape et par état');
  const stages = [['decoupe','Découpe'],['confection','Confection'],['emballage','Emballage'],['stock','Stock']];
  const stateDef = [['done','Terminée','var(--green)'],['cours','En cours','var(--orange)'],['prob','Problème','var(--red)'],['wait','En attente',AN_COL.wait]];
  const pRows = [];
  stages.forEach(([key,label],idx)=>{
    const counts = {done:0,cours:0,prob:0,wait:0};
    steps.forEach(s=>{ counts[s.st[idx].state]++; });
    const row = document.createElement('div'); row.className = 'an-pipe';
    const lab = document.createElement('div'); lab.className = 'an-pipe-l';
    const ic = document.createElement('span'); ic.className = 'an-pipe-ic'; ic.innerHTML = JOURNEY_ICONS[key]; lab.appendChild(ic);
    lab.appendChild(document.createTextNode(label)); row.appendChild(lab);
    const seg = document.createElement('div'); seg.className = 'an-seg';
    stateDef.forEach(([sk,sl,col])=>{
      if(!counts[sk]) return;
      const part = document.createElement('div'); part.className = 'an-seg-p';
      part.style.flex = counts[sk]+' 0 0'; part.style.background = col;
      anBind(part, label+' · '+sl, counts[sk]+' commande'+(counts[sk]>1?'s':''), Math.round(counts[sk]/orders.length*100)+' % des commandes');
      seg.appendChild(part);
    });
    row.appendChild(seg);
    const fig = document.createElement('div'); fig.className = 'an-pipe-f';
    fig.textContent = stateDef.filter(d=>counts[d[0]]).map(d=>counts[d[0]]+' '+d[1].toLowerCase()).join(' · ');
    row.appendChild(fig);
    pc.appendChild(row);
    pRows.push([label, counts.done, counts.cours, counts.prob, counts.wait]);
  });
  const leg = document.createElement('div'); leg.className = 'an-legend';
  stateDef.forEach(([sk,sl,col])=>{
    const i = document.createElement('span'); i.className = 'an-leg-i';
    const sw = document.createElement('span'); sw.className = 'an-sw'; sw.style.background = col; i.appendChild(sw);
    i.appendChild(document.createTextNode(sl)); leg.appendChild(i);
  });
  pc.appendChild(leg);
  pc.appendChild(anTable(['Étape','Terminée','En cours','Problème','En attente'], pRows));
  grid.appendChild(pc);

  // ---- 2. Commandes par mois ----
  const byMonth = {};
  orders.forEach(c=>{ const k = (c.dateCommande||'').slice(0,7); if(!k) return; byMonth[k] = byMonth[k] || {n:0,p:0}; byMonth[k].n++; byMonth[k].p += Number(c.quantite)||0; });
  let mKeys = Object.keys(byMonth).sort();
  if(mKeys.length){
    const full = []; let [y,m] = mKeys[0].split('-').map(Number); const [ey,em] = mKeys[mKeys.length-1].split('-').map(Number);
    while((y<ey || (y===ey && m<=em)) && full.length<24){ full.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){ m=1; y++; } }
    mKeys = full.slice(-12);
  }
  const mc = anCard('Commandes par mois', 'Nombre de commandes lancées');
  mc.appendChild(anColumns(mKeys.map(k=>({label:anMonthLabel(k), value:(byMonth[k]||{n:0}).n, tipTitle:anMonthLabel(k), tipSub:anNum((byMonth[k]||{p:0}).p)+' pièces'})), ''));
  mc.appendChild(anTable(['Mois','Commandes','Pièces'], mKeys.map(k=>[anMonthLabel(k), (byMonth[k]||{n:0}).n, (byMonth[k]||{p:0}).p])));
  grid.appendChild(mc);

  // ---- 3. Meilleurs clients ----
  const clients = anGroup(orders, c=>(c.client||'').trim(), c=>Number(c.quantite)||0);
  const cc = anCard('Meilleurs clients', 'Pièces commandées (8 premiers)');
  cc.appendChild(anBarsH(clients.slice(0,8).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')+(x.da>0?' · '+anDA(x.da):'')+(x.reste>0?' · reste '+anDA(x.reste):'')})), 'pcs'));
  cc.appendChild(anTable(['Client','Commandes','Pièces','Montant','Reste à payer'], clients.map(x=>[x.key, x.n, x.value, anDA(x.da), anDA(x.reste)])));
  grid.appendChild(cc);

  // ---- 4. Articles ----
  const arts = anGroup(orders, c=>(c.article||'').trim(), c=>Number(c.quantite)||0);
  const ac = anCard('Articles les plus commandés', 'Pièces commandées (8 premiers)');
  ac.appendChild(anBarsH(arts.slice(0,8).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'pcs'));
  ac.appendChild(anTable(['Article','Commandes','Pièces'], arts.map(x=>[x.key, x.n, x.value])));
  grid.appendChild(ac);

  // ---- 5. Tissus, couleurs et tailles ----
  const tissus = anGroup(orders, c=>(c.tissu||'').trim(), c=>Number(c.quantite)||0);
  const couleurOrders = [];
  orders.forEach(c=>{
    const ls = Array.isArray(c.lignes) ? c.lignes.filter(l=>l.couleur) : [];
    if(ls.length>1 || (ls.length===1 && Object.keys(ls[0].tailles||{}).length)){
      ls.forEach(l=>{ const q = Object.keys(l.tailles||{}).reduce((a,k)=>a+(Number(l.tailles[k])||0),0); couleurOrders.push(Object.assign({}, c, {couleur:l.couleur, quantite:q})); });
    } else couleurOrders.push(c);
  });
  const couleurs = anGroup(couleurOrders, c=>c.tissu && c.couleur ? c.tissu+' · '+c.couleur : '', c=>Number(c.quantite)||0);
  const tailleMap = {};
  orders.forEach(c=>{ Object.keys(c.tailles||{}).forEach(sz=>{ const q = Number(c.tailles[sz])||0; if(q) tailleMap[sz] = (tailleMap[sz]||0)+q; }); });
  const tailles = Object.keys(tailleMap).map(k=>({key:k, value:tailleMap[k]})).sort((a,b)=>b.value-a.value);
  const tc = anCard('Tissus, couleurs et tailles', 'Pièces commandées');
  tc.appendChild(el('<div class="an-mini">Tissus</div>'));
  tc.appendChild(anBarsH(tissus.slice(0,5).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'pcs'));
  tc.appendChild(el('<div class="an-mini">Couleurs</div>'));
  tc.appendChild(anBarsH(couleurs.slice(0,5).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'pcs'));
  tc.appendChild(el('<div class="an-mini">Tailles</div>'));
  tc.appendChild(anBarsH(tailles.slice(0,6).map(x=>({label:x.key, value:x.value})), 'pcs'));
  tc.appendChild(anTable(['Type','Nom','Pièces'], tissus.map(x=>['Tissu',x.key,x.value]).concat(couleurs.map(x=>['Couleur',x.key,x.value])).concat(tailles.map(x=>['Taille',x.key,x.value]))));
  grid.appendChild(tc);

  // ---- 6. Paiements ----
  const pyc = anCard('Paiements', 'Montant total des commandes et part encaissée');
  if(totDA>0){
    const tall = document.createElement('div'); tall.className = 'an-tall';
    [['Encaissé',payeDA,'var(--green)','#fff'],['Reste à encaisser',resteDA,AN_COL.wait,'#001D51']].forEach(([n,v,col,tc2])=>{
      if(v<=0) return;
      const part = document.createElement('div'); part.className = 'an-tall-p'; part.style.flex = v+' 0 0'; part.style.background = col; part.style.color = tc2;
      if(v/(payeDA+resteDA) > 0.2) part.textContent = Math.round(v/(payeDA+resteDA)*100)+' %';
      anBind(part, n, anDA(v), Math.round(v/(payeDA+resteDA)*100)+' % du total');
      tall.appendChild(part);
    });
    pyc.appendChild(tall);
    const lg = document.createElement('div'); lg.className = 'an-legend';
    [['Encaissé','var(--green)'],['Reste à encaisser',AN_COL.wait]].forEach(([n,col])=>{
      const i = document.createElement('span'); i.className = 'an-leg-i';
      const sw = document.createElement('span'); sw.className = 'an-sw'; sw.style.background = col; i.appendChild(sw); i.appendChild(document.createTextNode(n)); lg.appendChild(i);
    });
    pyc.appendChild(lg);
    const owing = anGroup(orders, c=>(c.client||'').trim(), c=>payInfo(c).reste).filter(x=>x.value>0);
    pyc.appendChild(el('<div class="an-mini">Clients qui doivent encore payer</div>'));
    pyc.appendChild(anBarsH(owing.slice(0,6).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'DA'));
    const st = {'Non payé':0,'Partiel':0,'Payé':0,'À définir':0}; pays.forEach(p=>{ st[p.statut]++; });
    pyc.appendChild(anTable(['Statut','Commandes'], Object.keys(st).map(k=>[k, st[k]]).concat([['Total (DA)', totDA],['Encaissé (DA)', payeDA],['Reste (DA)', resteDA]])));
  } else {
    pyc.appendChild(anEmpty('Aucun montant saisi. Ouvre l\'onglet Paiements pour entrer le total de tes commandes.'));
  }
  grid.appendChild(pyc);

  // ---- 7. Encaissements par mois ----
  const cash = {};
  orders.forEach(c=>{ (c.paiement && c.paiement.versements || []).forEach(v=>{ const k = (v.date||'').slice(0,7); if(!k) return; cash[k] = (cash[k]||0)+(Number(v.montant)||0); }); });
  const cKeys = Object.keys(cash).sort().slice(-12);
  const cashCard = anCard('Encaissements par mois', 'Montant reçu (DA)');
  if(cKeys.length){
    cashCard.appendChild(anColumns(cKeys.map(k=>({label:anMonthLabel(k), value:cash[k], tipTitle:anMonthLabel(k)})), 'DA'));
    cashCard.appendChild(anTable(['Mois','Encaissé (DA)'], cKeys.map(k=>[anMonthLabel(k), cash[k]])));
  } else cashCard.appendChild(anEmpty('Aucun versement enregistré pour le moment.'));
  grid.appendChild(cashCard);

  // ---- 8. Retards ----
  const lc = anCard('Commandes en retard', 'Livraison prévue dépassée et pas encore reçue en stock');
  if(late.length){
    const rows = late.map(c=>{
      const cur = journeySteps(c).find(s=>s.state!=='done');
      return {c, days:anDays(c.dateLivraisonPrevue, today), step: cur ? cur.label+' ('+cur.text.toLowerCase()+')' : '—'};
    }).sort((a,b)=>b.days-a.days);
    const tw = document.createElement('div'); tw.className = 'table-wrap';
    const t = document.createElement('table'); t.className = 'main';
    const hr = document.createElement('tr'); ['Référence','Client','Prévue le','Retard','Bloquée à'].forEach(h=>{ const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    const thd = document.createElement('thead'); thd.appendChild(hr); t.appendChild(thd);
    const tb = document.createElement('tbody');
    rows.slice(0,10).forEach(r=>{
      const tr = document.createElement('tr');
      [r.c.reference, r.c.client, fmtDate(r.c.dateLivraisonPrevue), r.days+' j', r.step].forEach((v,i)=>{ const td = document.createElement('td'); td.textContent = v; if(i===3){ td.style.color = 'var(--red)'; td.style.fontWeight = 'bold'; } tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); lc.appendChild(tw);
  } else lc.appendChild(anEmpty('Aucune commande en retard.'));
  grid.appendChild(lc);

  // ---- 9. Écarts de stock ----
  const ecs = received.filter(c=>ecartStock(c)!==0);
  const ec = anCard('Écarts de stock', 'Pièces reçues différentes de la commande');
  if(ecs.length){
    const tw = document.createElement('div'); tw.className = 'table-wrap';
    const t = document.createElement('table'); t.className = 'main';
    const hr = document.createElement('tr'); ['Référence','Commandé','Reçu','Écart','Géré'].forEach(h=>{ const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    const thd = document.createElement('thead'); thd.appendChild(hr); t.appendChild(thd);
    const tb = document.createElement('tbody');
    ecs.forEach(c=>{
      const e = ecartStock(c); const tr = document.createElement('tr');
      [c.reference, c.quantite, c.stock.quantiteRecue, (e>0?'+':'')+e, c.ecartGere?'Oui':'Non'].forEach((v,i)=>{ const td = document.createElement('td'); td.textContent = v; if(i===3){ td.style.color = 'var(--red)'; td.style.fontWeight = 'bold'; } tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); ec.appendChild(tw);
  } else ec.appendChild(anEmpty(received.length ? 'Aucun écart : toutes les réceptions sont conformes.' : 'Aucune réception pour le moment.'));
  grid.appendChild(ec);

  root.appendChild(grid);
  return root;
}
function renderSearchResult(box){
  box.innerHTML='';
  const ref = (view.searchRef||'').trim();
  if(!ref){ box.appendChild(el('<div class="search-msg">Tape une référence ci-dessus.</div>')); return; }
  const matches = DATA.commandes.filter(c=>c.reference.toLowerCase()===ref.toLowerCase());
  if(matches.length===0){ box.appendChild(el('<div class="search-msg">Aucune commande trouvée pour cette référence.</div>')); return; }
  let c = matches[matches.length-1];
  if(view.focusId){ const fc = matches.find(x=>x.id===view.focusId); if(fc) c = fc; }
  box.appendChild(el('<div class="search-msg">'+matches.length+' commande(s) trouvée(s) — détails de la plus récente :</div>'));
  box.appendChild(renderFiche(c));
  if(view.scrollToFiche){ view.scrollToFiche = false; setTimeout(()=>{ try{ box.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){} }, 80); }
}

function renderFiche(c){
  const f = el('<div class="fiche"></div>');
  const head = el('<div style="text-align:center;margin-bottom:12px;"></div>');
  head.appendChild(el('<div style="font-size:24px;font-weight:bold;">'+esc(c.reference)+(Number(c.priorite)>0?' '+prioTag(c):'')+(c.urgent?' <span class="pill probleme" style="vertical-align:middle;">URGENT</span>':'')+'</div>'));
  head.appendChild(el('<div style="font-size:13px;color:var(--text-soft);margin-top:2px;">'+esc(c.client)+' · '+esc(c.article)+' · '+esc(c.quantite)+' pièces</div>'));
  f.appendChild(head);

  // Parcours avec icônes : Découpe → Confection → Emballage → Stock
  f.appendChild(renderJourney(c));

  const row = el('<div class="fiche-bottom"></div>');

  const info = el('<div class="fiche-box"></div>');
  info.appendChild(el('<div class="fb-lbl">Livraison prévue</div>'));
  info.appendChild(el('<div class="fb-val">'+(c.dateLivraisonPrevue?fmtDate(c.dateLivraisonPrevue):'—')+'</div>'));
  if(canManagePay()){
    const com = commercialOf(c);
    { const g = consoGlobale(c.tissuInfo, c.quantite);
      if(g.total>0){
        info.appendChild(el('<div class="fb-lbl" style="margin-top:12px;">Conso. globale du produit</div>'));
        const gv = el('<div class="fb-val" style="font-size:14px;"></div>'); gv.textContent = fmtKg(g.total)+' kg'; info.appendChild(gv);
      } }
    info.appendChild(el('<div class="fb-lbl" style="margin-top:12px;">Commercial responsable</div>'));
    info.appendChild(el('<div class="fb-val" style="font-size:14px;">'+(com?esc(com.name):'<span style="color:var(--red);">Non assigné</span>')+'</div>'));
    const pi = payInfo(c);
    info.appendChild(el('<div class="fb-lbl" style="margin-top:12px;">Paiement</div>'));
    info.appendChild(el('<div style="margin-top:4px;">'+payPill(pi.statut)+(pi.total>0 && pi.reste>0 ? ' <span style="font-size:12px;color:var(--text-soft);">reste '+fmtDA(pi.reste)+'</span>' : '')+'</div>'));
  }
  row.appendChild(info);

  const qrBox = el('<div class="fiche-box" style="text-align:center;"></div>');
  qrBox.appendChild(el('<div class="fb-lbl">Code QR</div>'));
  const qr = el('<div style="display:flex;justify-content:center;margin-top:6px;"></div>');
  qr.innerHTML = qrSvg(orderUrl(c), 150);
  qrBox.appendChild(qr);
  const pr = el('<button class="btn small" style="margin-top:8px;">Imprimer l\'étiquette</button>');
  pr.onclick = ()=>printLabel(c);
  qrBox.appendChild(pr);
  row.appendChild(qrBox);
  f.appendChild(row);

  if(canManagePay()){
    const btnRow = el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center;"></div>');
    const editBtn = el('<button class="btn primary">Modifier cette commande</button>');
    editBtn.onclick = ()=>{ view.modal = {mode:'edit', data:JSON.parse(JSON.stringify(c))}; render(); };
    btnRow.appendChild(editBtn);
    const payBtn = el('<button class="btn">Gérer le paiement</button>');
    payBtn.onclick = ()=>{ view.payModal = {id:c.id, data:JSON.parse(JSON.stringify(c.paiement||{total:'',versements:[]}))}; render(); };
    btnRow.appendChild(payBtn);
    f.appendChild(btnRow);
  }
  return f;
}

function renderOrderView(){
  const c = (DATA.commandes||[]).find(x=>x.id===view.orderView);
  if(!c){ view.orderView = null; return document.createElement('div'); }
  const close = ()=>{ view.orderView = null; render(); };
  const who = id=>{ const p = (DATA.people||[]).find(x=>x.id===id); return p ? p.name : ''; };
  const D = x=>x ? fmtDate(x) : '—';
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal order-view"></div>');
  const et = orderEtat(c);
  m.appendChild(el('<h2>Suivi de la commande '+esc(c.reference)+' <span class="pill '+et.cls+'" style="font-size:12px;vertical-align:middle">'+esc(et.label)+'</span></h2>'));
  m.appendChild(renderFiche(c));

  // ---- détail du suivi, étape par étape ----
  m.appendChild(el('<div class="grp-head" style="background:#001D51;margin-top:14px">Suivi étape par étape</div>'));
  const d=c.decoupe||{}, f=c.confection||{}, e=c.emballage||{}, st=c.stock||{};
  const ec = (typeof ecartStock==='function') ? ecartStock(c) : null;
  const rows = [
    ['Commande lancée', 'Date : '+D(c.dateCommande)+(c.dateLivraisonPrevue?' · livraison prévue : '+D(c.dateLivraisonPrevue):'')+(commercialOf(c)?' · commercial : '+esc(commercialOf(c).name):''), 'prete'],
    ['Découpe', esc(d.statut||'En attente')+' · prévue : '+D(d.prevueLe)+' · faite : '+D(d.faiteLe)+(d.par&&who(d.par)?' · par '+esc(who(d.par)):''), STATUS_CLASS[d.statut]||'attente'],
    ['Confection', esc(f.statut||'En attente')+(f.atelier?' · atelier : '+esc(f.atelier):'')+' · début : '+D(f.debut)+' · fin : '+D(f.fin)+(f.par&&who(f.par)?' · par '+esc(who(f.par)):''), STATUS_CLASS[f.statut]||'attente'],
    ['Emballage', esc(e.statut||'En attente')+' · début : '+D(e.debut)+' · fin : '+D(e.fin)+(e.par&&who(e.par)?' · par '+esc(who(e.par)):''), STATUS_CLASS[e.statut]||'attente'],
    ['Stock / réception', (st.quantiteRecue!==''&&st.quantiteRecue!=null ? 'Reçu : '+esc(st.quantiteRecue)+' pièces sur '+esc(c.quantite||0)+' · le '+D(st.dateReception)+(ec!==null&&ec!==0?' · écart '+(ec>0?'+':'')+ec:'')+(st.par&&who(st.par)?' · par '+esc(who(st.par)):'') : 'Pas encore reçue'), (st.quantiteRecue!==''&&st.quantiteRecue!=null) ? 'prete' : 'attente']
  ];
  const tl = el('<div class="ov-steps"></div>');
  rows.forEach(r=>{ tl.appendChild(el('<div class="ov-step"><span class="pill '+r[2]+'">'+r[0]+'</span><div>'+r[1]+'</div></div>')); });
  m.appendChild(tl);

  // ---- produit : tissu, couleurs × tailles ----
  m.appendChild(el('<div class="grp-head" style="background:#B8860B;margin-top:14px">Produit</div>'));
  const lignes = (Array.isArray(c.lignes) && c.lignes.length) ? c.lignes : [{couleur:c.couleur||'', tailles:c.tailles||{}}];
  const order = (DATA.lists && DATA.lists.tailles) || [];
  const used = {}; lignes.forEach(l=>Object.keys(l.tailles||{}).forEach(k=>{ if(Number((l.tailles||{})[k])>0) used[k]=true; }));
  const sizes = order.filter(k=>used[k]).concat(Object.keys(used).filter(k=>order.indexOf(k)===-1));
  const info = el('<div class="cat-view-grid"></div>');
  [['Client',esc(c.client||'—')],['Article',esc(c.article||'—')],['Tissu',esc(c.tissu||'—')],['Quantité',esc(c.quantite||0)+' pièces']].forEach(([k,v])=>info.appendChild(el('<div class="cat-view-item"><span>'+k+'</span><b>'+v+'</b></div>')));
  m.appendChild(info);
  if(sizes.length){
    let html = '<table class="ov-table"><tr><th>Couleur</th>'+sizes.map(k=>'<th>'+esc(k)+'</th>').join('')+'<th>Total</th></tr>';
    lignes.forEach(l=>{ let t=0; html += '<tr><th>'+esc(l.couleur||'—')+'</th>'+sizes.map(k=>{ const n=Number((l.tailles||{})[k])||0; t+=n; return '<td>'+(n||'')+'</td>'; }).join('')+'<td><b>'+t+'</b></td></tr>'; });
    html += '</table>';
    m.appendChild(el('<div style="margin-top:10px;overflow-x:auto">'+html+'</div>'));
  }
  const psLies = (((DATA.perso||{}).jobs)||[]).filter(j=>j.cmdId===c.id);

const ETAT_LIST = [['attente','En attente de découpe'],['decoupe','En découpe'],['decoupee','Découpe terminée'],['confection','En confection'],['confectionnee','Confection terminée'],['emballage','En emballage'],['emballee','Emballée · attente stock'],['recue','Reçue en stock'],['probleme','Problème / tissu manquant'],['annulee','Annulée']];
function orderEtat(c){
  const d=c.decoupe||{}, f=c.confection||{}, e=c.emballage||{}, st=c.stock||{};
  if([d,f,e].some(x=>x.statut==='Annulée')) return {key:'annulee',label:'Annulée',cls:'annulee'};
  if(st.quantiteRecue!=='' && st.quantiteRecue!=null) return {key:'recue',label:'Reçue en stock',cls:'prete'};
  const prob = [['Découpe',d],['Confection',f],['Emballage',e]].find(x=>x[1].statut==='Problème' || x[1].statut==='Tissu non disponible');
  if(prob) return {key:'probleme',label:(prob[1].statut==='Problème'?'Problème':'Tissu manquant')+' · '+prob[0],cls:'probleme'};
  if(e.statut==='Prête') return {key:'emballee',label:'Emballée · attente stock',cls:'cours'};
  if(e.statut==='En cours') return {key:'emballage',label:'En emballage',cls:'cours'};
  if(f.statut==='Prête') return {key:'confectionnee',label:'Confection terminée',cls:'cours'};
  if(f.statut==='En cours') return {key:'confection',label:'En confection',cls:'cours'};
  if(d.statut==='Prête') return {key:'decoupee',label:'Découpe terminée',cls:'cours'};
  if(d.statut==='En cours') return {key:'decoupe',label:'En découpe',cls:'cours'};
  return {key:'attente',label:'En attente de découpe',cls:'attente'};
}
// ---------- CALCULATEUR DE DÉLAI ----------
function calcCfg(){
  const c = (DATA.settings && DATA.settings.calc) || {};
  let mn = Number(c.capMin), mx = Number(c.capMax);
  if(!(mn>0)) mn = 8000; if(!(mx>0)) mx = 10000;
  if(mn>mx){ const t=mn; mn=mx; mx=t; }
  return {capMin:mn, capMax:mx, vendredi:c.vendredi!==false, samedi:!!c.samedi};
}
function isoLocal(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function delaiIsOff(d, cfg){ const g = d.getDay(); return (g===5 && cfg.vendredi) || (g===6 && cfg.samedi); }
function delaiWorkdaysPerMonth(cfg){ const perWeek = 7 - (cfg.vendredi?1:0) - (cfg.samedi?1:0); return Math.max(perWeek,1)*52/12; }
// date du n-ième jour travaillé en partant d'aujourd'hui (aujourd'hui compte si c'est un jour travaillé)
function delaiDateAt(n, cfg){
  const d = new Date(); d.setHours(12,0,0,0);
  let left = Math.max(n,1);
  for(let i=0;i<4000;i++){
    if(!delaiIsOff(d,cfg)){ left--; if(left<=0) break; }
    d.setDate(d.getDate()+1);
  }
  return isoLocal(d);
}
function delaiQueue(){
  const open = (DATA.commandes||[]).filter(c=>{
    if([c.decoupe,c.confection,c.emballage].some(x=>x && x.statut==='Annulée')) return false;
    if(c.stock && c.stock.quantiteRecue!=='' && c.stock.quantiteRecue!=null) return false;
    if(c.emballage && c.emballage.statut==='Prête') return false;
    return true;
  });
  return open.sort((a,b)=>{
    const pa = prioRank(a), pb = prioRank(b);
    if(pa!==pb) return pa-pb;
    if(!!a.urgent!==!!b.urgent) return a.urgent? -1:1;
    return (a.dateCommande||'').localeCompare(b.dateCommande||'');
  });
}
function delaiObserved(){
  const lim = new Date(); lim.setDate(lim.getDate()-90); const limIso = isoLocal(lim);
  let tot = 0;
  (DATA.commandes||[]).forEach(c=>{ const st=c.stock||{}; if(st.dateReception && st.dateReception>=limIso && st.quantiteRecue!=='' && st.quantiteRecue!=null) tot += Number(st.quantiteRecue)||0; });
  return tot>0 ? Math.round(tot/3) : null;
}
function delaiEstimate(q, cfg){
  const wd = delaiWorkdaysPerMonth(cfg);
  const dEarly = Math.ceil(q/(cfg.capMax/wd)), dLate = Math.ceil(q/(cfg.capMin/wd));
  return {early:delaiDateAt(dEarly,cfg), late:delaiDateAt(dLate,cfg), dEarly:dEarly, dLate:dLate};
}

  const queue = delaiQueue();

  const thead = document.createElement('thead'); thead.appendChild(hr); t.appendChild(thead);

  return box;
}

// Numérotation automatique des références : JB0001, JB0002, ... à l'infini.
// On prend le plus grand numéro JB existant et on ajoute 1 (4 chiffres minimum,
// puis JB10000, JB10001... sans limite). Le champ reste modifiable à la main
// (par exemple pour relancer une référence déjà existante).
function nextReference(){
  let max = 0;
  (DATA.commandes||[]).concat(DATA.demandes||[]).forEach(c=>{
    const m = /^JB(\d+)$/i.exec(String(c.reference||'').trim());
    if(m){
      const n = parseInt(m[1], 10);
      if(n > max) max = n;
    }
  });
  return 'JB' + String(max + 1).padStart(4, '0');
}

      td(c.wilaya||'—'); td(c.commune||'—');

      td(st.reste>0?fmtDA(st.reste):'—').style.color = st.reste>0 ? '#E0392D' : '';

        else if(v==='del'){

          if(n>0){ alert('Impossible de supprimer « '+c.nom+' » : il a '+n+' commande(s). Tu peux modifier ses informations à la place.'); return; }
          if(!confirm('Supprimer le client « '+c.nom+' » ('+c.ref+') ?')) return;

          if(DATA.lists && DATA.lists.clients) DATA.lists.clients = DATA.lists.clients.filter(x=>normName(x)!==normName(c.nom));
          saveState('Client supprimé : '+c.nom);
        }
      };
      if(!RO_MODE) act.appendChild(sel);
      tr.appendChild(act);
      tbody.appendChild(tr);
    });
  }
  q.oninput = ()=>{ view.clientSearch = q.value; fill(); };
  ws.onchange = ()=>{ view.clientWilaya = ws.value; fill(); };
  so.onchange = ()=>{ view.clientSort = so.value; fill(); };
  fill();
  return box;
}

  cInp.oninput = ()=>data.commune = cInp.value;

  function fillCommunes(){
    dl.innerHTML='';

    (DATA.clients||[]).forEach(c=>{ if(c.commune && c.wilaya===data.wilaya && !seen[c.commune]){ seen[c.commune]=1; const o=document.createElement('option'); o.value=c.commune; dl.appendChild(o); } });
  }

    const nom = String(data.nom||'').trim();
    if(!nom){ alert('Le nom du client est obligatoire.'); return; }
    if((DATA.clients||[]).some(c=>c.id!==data.id && normName(c.nom)===normName(nom))){ alert('Un client avec ce nom existe déjà.'); return; }
    data.nom = nom; data.tel = String(data.tel||'').trim(); data.adresse = String(data.adresse||'').trim(); data.commune = String(data.commune||'').trim();
    DATA.clients = DATA.clients || [];
    if(mode==='create'){
      DATA.clients.push(data);
      DATA.lists = DATA.lists || {}; DATA.lists.clients = DATA.lists.clients || [];
      if(DATA.lists.clients.indexOf(nom)<0) DATA.lists.clients.push(nom);
    } else {
      const i = DATA.clients.findIndex(c=>c.id===data.id);
      if(i>=0) DATA.clients[i] = data;
      if(oldName && normName(oldName)!==normName(nom)){
        (DATA.commandes||[]).forEach(c=>{ if(normName(c.client)===normName(oldName)) c.client = nom; });
        if(DATA.lists && DATA.lists.clients) DATA.lists.clients = DATA.lists.clients.map(x=>normName(x)===normName(oldName)?nom:x);
      }

  };
  actions.appendChild(cancel); actions.appendChild(save); m.appendChild(actions);
  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.clientModal=null; render(); } };
  return overlay;
}

function clientNames(){
  const set = {};
  ((DATA.lists||{}).clients||[]).forEach(x=>{ if(x) set[x]=1; });
  (DATA.clients||[]).forEach(x=>{ if(x && x.nom) set[x.nom]=1; });
  (DATA.commandes||[]).forEach(c=>{ if(c.client && String(c.client).trim()) set[String(c.client).trim()]=1; });
  return Object.keys(set);
}
function articleNames(){
  const set = {};
  (DATA.catalogue||[]).forEach(p=>{ if(p.article) set[p.article]=1; });
  ((DATA.lists||{}).articles||[]).forEach(x=>{ if(x) set[x]=1; });
  (DATA.commandes||[]).forEach(c=>{ if(c.article && String(c.article).trim()) set[String(c.article).trim()]=1; });
  return Object.keys(set);
}
function rememberNames(data){
  DATA.lists = DATA.lists || {};
  const add = (key,val)=>{ val = String(val||'').trim(); if(!val) return; DATA.lists[key] = DATA.lists[key] || []; if(DATA.lists[key].indexOf(val)<0) DATA.lists[key].push(val); };
  add('clients', data.client); add('articles', data.article);
  syncClients();
}

// Pas d'en-tête Authorization : la clé sb_publishable_ n'est pas un JWT.

// ----- Département TRICOTAGE : stock de fil, production, finition, stock tissu fini, vente -----
// =====================================================================
function TR(){
  DATA.tricotage = DATA.tricotage || {};
  const t = DATA.tricotage;
  ['fils','mvtFil','prods','ventes','ajustFini','clients'].forEach(k=>{ if(!Array.isArray(t[k])) t[k]=[]; });
  return t;
}
function trNum(x){ const n = parseFloat(String(x==null?'':x).replace(',','.')); return isNaN(n) ? 0 : n; }
function trKg(n){ return (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' kg'; }
function trNextRef(prefix, arr, digits){
  let max = 0; (arr||[]).forEach(x=>{ const m = String(x.ref||'').match(/(\d+)$/); if(m) max = Math.max(max, Number(m[1])); });
  return prefix + String(max+1).padStart(digits||4,'0');
}
const TR_ICON_FIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="12" height="3" rx="1"/><rect x="5" y="18.5" width="12" height="3" rx="1"/><path d="M7.5 5.5v13M14.5 5.5v13"/><path d="M7.5 8.5l7 1.6M7.5 11.5l7 1.6M7.5 14.5l7 1.6"/><path d="M14.5 16.2c2.6.2 4.6 1.4 4.6 3.4 0 1.1-.6 1.9-1.6 1.9"/></svg>';
const TR_STEPS = [['lavage','Lavage'],['repassage','Repassage'],['grattage','Grattage']];
function trFil(id){ return TR().fils.find(f=>f.id===id); }
function trFilLabel(f){ return f ? (f.nom + (f.couleur ? ' · '+f.couleur : '')) : '—'; }
function trFilStock(id){
  const t = TR();
  let s = 0, entree = 0, conso = 0;
  t.mvtFil.forEach(m=>{ if(m.filId!==id) return; if(m.type==='entree'){ s+=trNum(m.qte); entree+=trNum(m.qte); } else { s-=trNum(m.qte); conso+=trNum(m.qte); } });
  t.prods.forEach(p=>(p.fils||[]).forEach(u=>{ if(u.filId===id){ s-=trNum(u.qte); conso+=trNum(u.qte); } }));
  return {stock:s, entree:entree, conso:conso};
}
function trStage(p){
  if(p.dateStock) return {key:'stock', label:'En stock tissu fini', cls:'prete'};
  if(p.statut!=='Terminé') return {key:'tricot', label:'En tricotage', cls:'cours'};
  const f = p.finition || {};
  const req = TR_STEPS.filter(([k])=>!f[k] || f[k].statut!=='Non requis');
  if(req.every(([k])=>f[k] && f[k].statut==='Fait')) return {key:'pret', label:'Finition terminée', cls:'cours'};
  return {key:'finition', label:'En finition', cls:'attente'};
}
function trFiniKey(tissu, couleur){ return String(tissu||'').trim().toUpperCase()+'|'+String(couleur||'').trim().toUpperCase(); }
function trFiniStock(){
  const t = TR(); const map = {};
  function g(tissu, couleur){ const k = trFiniKey(tissu,couleur); if(!map[k]) map[k] = {tissu:String(tissu||'').trim().toUpperCase(), couleur:String(couleur||'').trim().toUpperCase(), entre:0, vendu:0}; return map[k]; }
  t.prods.forEach(p=>{ if(p.dateStock) g(p.tissu, p.couleurFinie||p.couleur).entre += trNum(p.qteFinie||p.qteProduite); });
  t.ajustFini.forEach(a=>{ g(a.tissu, a.couleur).entre += trNum(a.qte); });
  t.ventes.forEach(v=>{ g(v.tissu, v.couleur).vendu += trNum(v.qte); });
  return Object.values(map).map(x=>Object.assign(x,{stock:x.entre-x.vendu})).sort((a,b)=>(a.tissu+a.couleur).localeCompare(b.tissu+b.couleur));
}
function trCouts(){ const t = TR(); t.couts = t.couts || {}; return t.couts; }
function trFilPrixMoyen(id){
  let q=0, v=0; TR().mvtFil.forEach(m=>{ if(m.filId===id && m.type==='entree' && trNum(m.prixKg)>0){ q+=trNum(m.qte); v+=trNum(m.qte)*trNum(m.prixKg); } });
  return q ? v/q : 0;
}
function trLotCout(p){
  const c = trCouts(); const qp = trNum(p.qteProduite);
  const fil = (p.fils||[]).reduce((a,u)=>a+trNum(u.qte)*trFilPrixMoyen(u.filId),0);
  const f = p.finition || {};
  let fac = trNum(c.tricotageKg) + trNum(c.autresKg);
  TR_STEPS.forEach(([k])=>{ if(!(f[k] && f[k].statut==='Non requis')) fac += trNum(c[k+'Kg']); });
  const total = fil + qp*fac;
  const base = trNum(p.qteFinie) || qp;
  return {fil:fil, facon:qp*fac, total:total, kg: base ? total/base : 0};
}
function trCoutMoyenFini(tissu, couleur){
  const key = trFiniKey(tissu, couleur); let q=0, v=0;
  TR().prods.forEach(p=>{ if(p.dateStock && trFiniKey(p.tissu, p.couleurFinie||p.couleur)===key){ const kg = p.coutKg!=null && p.coutKg!=='' ? trNum(p.coutKg) : trLotCout(p).kg; const qq = trNum(p.qteFinie||p.qteProduite); q+=qq; v+=qq*kg; } });
  TR().ajustFini.forEach(a=>{ if(trFiniKey(a.tissu,a.couleur)===key && trNum(a.qte)>0 && trNum(a.coutKg)>0){ q+=trNum(a.qte); v+=trNum(a.qte)*trNum(a.coutKg); } });
  return q ? v/q : 0;
}
function trBenef(v){ const ca = trNum(v.qte)*trNum(v.prixKg), cout = trNum(v.qte)*trNum(v.coutKg); return {ca:ca, cout:cout, benef:ca-cout, marge: ca ? 100*(ca-cout)/ca : 0}; }
function trLotUrl(p){ return siteBase()+'/?lot='+encodeURIComponent(p.id); }
function trLot(id){ return TR().prods.find(p=>p.id===id); }
function trPrintLabels(p){
  const n = Math.max(1, Math.round(trNum(p.rouleaux)) || 1);
  const w = window.open('', '_blank', 'width=460,height=640');
  if(!w){ alert("Le navigateur a bloqué la fenêtre d'impression. Autorise les pop-ups pour ce site."); return; }
  const logo = (DATA.settings && DATA.settings.logoUrl) || DEFAULT_LOGO;

      +'<div class="i">Rouleau '+i+' / '+n+(p.qteFinie?' · lot '+esc(trKg(p.qteFinie)):'')+'</div><div class="i">'+(p.dateStock?'Entré en stock le '+fmtDate(p.dateStock):'Tricoté le '+fmtDate(p.date))+'</div></div>';
  }
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+esc(p.ref)+'</title><style>body{font-family:Arial,sans-serif;margin:0;color:#000}.lab{text-align:center;padding:18px;page-break-after:always}.lab:last-child{page-break-after:auto}img.l{height:44px;margin-bottom:6px}.r{font-size:28px;font-weight:bold;margin-top:6px}.i{font-size:15px;margin-top:4px}</style></head><body>'
    + html + '<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>');
  w.document.close();
}
function renderTricoLotView(){
  const p = trLot(view.tricoLotView);

  const actions = el('<div class="actions"></div>');

  actions.appendChild(close);
