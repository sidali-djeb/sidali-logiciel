// Downscales + re-encodes an uploaded photo client-side before it's embedded
// as a data: URI in DATA (this page has no separate file/asset store — every
// image lives inline in the published HTML, so keeping it small matters).
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function formatTailles(c){
  const t = c.tailles;
  if(!t || typeof t!=='object') return '—';
  const order = (DATA.lists && DATA.lists.tailles) || [];
  const known = order.filter(sz=>t[sz]!==undefined && t[sz]!=='' && t[sz]!=null);
  const extra = Object.keys(t).filter(sz=>order.indexOf(sz)===-1 && t[sz]!==undefined && t[sz]!=='' && t[sz]!=null);
  const parts = known.concat(extra).map(sz=>t[sz]+sz);
  return parts.length ? parts.join('/') : '—';
}

function render(){
  applyThemeSettings();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(view.screen==='login') app.appendChild(renderLogin());
  else if(view.screen==='dept') app.appendChild(renderDeptScreen());
  else if(view.screen==='commercial') app.appendChild(renderCommercialScreen());
  else if(view.screen==='admin') app.appendChild(renderAdminScreen());
  if(view.modal) app.appendChild(renderModal());
  if(view.personModal) app.appendChild(renderPersonModal());
  if(view.catalogueModal) app.appendChild(renderCatalogueModal());
  if(view.settingsModal) app.appendChild(renderSettingsModal());
  if(view.discussionOpen) app.appendChild(renderDiscussion());
}

function currentPerson(){
  return (DATA.people||[]).find(p=>p.id===view.personId) || null;
}

function findPersonForLogin(idVal, codeVal){
  const idNorm = (idVal||'').trim().toLowerCase();
  const codeNorm = (codeVal||'').trim();
  if(!idNorm || !codeNorm) return null;
  return (DATA.people||[]).find(p=>
    p.active!==false && String(p.code)===codeNorm &&
    ((p.email||'').toLowerCase()===idNorm || (p.name||'').toLowerCase()===idNorm)
  ) || null;
}

function renderLogin(){
  const w = el('<div class="center-wrap"></div>');
  const img = document.createElement('img');
  img.src = LOGO_CHARCOAL;
  w.appendChild(img);
  w.appendChild(el('<h1>'+DATA.companyTitle+'</h1>'));
  w.appendChild(el('<p class="sub">Connecte-toi avec ton email (ou ton nom) et ton code personnel</p>'));

  const form = el('<div class="login-form"></div>');
  const idField = el('<div class="login-field"><label>Email ou nom</label></div>');
  const idInput = document.createElement('input');
  idInput.type = 'text';
  idInput.placeholder = 'ex : sidali@... ou Sidali';
  idInput.value = view.loginId || '';
  idInput.oninput = ()=>{ view.loginId = idInput.value; };
  idField.appendChild(idInput);
  form.appendChild(idField);

  const codeField = el('<div class="login-field"><label>Code</label></div>');
  const codeInput = document.createElement('input');
  codeInput.type = 'password';
  codeInput.inputMode = 'numeric';
  codeInput.maxLength = 4;
  codeInput.placeholder = '••••';
  codeInput.value = view.loginCode || '';
  codeInput.oninput = ()=>{ view.loginCode = codeInput.value; };
  codeField.appendChild(codeInput);
  form.appendChild(codeField);

  form.appendChild(el('<div class="pin-error">'+(view.loginError||'')+'</div>'));

  const btn = el('<button class="btn primary" style="width:100%;margin-top:4px;">Se connecter</button>');
  const doLogin = ()=>{
    const person = findPersonForLogin(idInput.value, codeInput.value);
    if(!person){
      view.loginError = 'Email/nom ou code incorrect.';
      view.loginCode = '';
      render();
      return;
    }
    view.personId = person.id;
    view.role = person.role;
    view.screen = person.role==='admin' ? 'admin' : (person.role==='commercial' ? 'commercial' : 'dept');
    view.loginId=''; view.loginCode=''; view.loginError='';
    render();
  };
  btn.onclick = doLogin;
  idInput.onkeydown = (e)=>{ if(e.key==='Enter') codeInput.focus(); };
  codeInput.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
  form.appendChild(btn);
  w.appendChild(form);
  return w;
}

function topbar(title, badgeCount){
  const bar = el('<div class="topbar"></div>');
  const img = document.createElement('img');
  img.src = LOGO_WHITE;
  bar.appendChild(img);
  const person = currentPerson();
  const badgeHtml = badgeCount ? '<span class="badge">'+badgeCount+'</span>' : '';
  bar.appendChild(el('<div class="title">'+title+(person?' · '+person.name:'')+badgeHtml+'</div>'));
  bar.appendChild(el('<div class="spacer"></div>'));
  const count = (DATA.messages||[]).length;
  const chat = el('<button class="link">Discussion'+(count?' ('+count+')':'')+'</button>');
  chat.onclick = ()=>{ view.discussionOpen=true; render(); };
  bar.appendChild(chat);
  const out = el('<button class="link">Se déconnecter</button>');
  out.onclick = ()=>{ view.screen='login'; view.role=null; view.personId=null; view.discussionOpen=false; render(); };
  bar.appendChild(out);
  return bar;
}

function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const pad = n=>String(n).padStart(2,'0');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function postMessage(text){
  if(!text || !text.trim()) return;
  const person = currentPerson();
  const author = person ? person.name : (ROLE_LABEL[view.role]||'Inconnu');
  DATA.messages = DATA.messages || [];
  DATA.messages.push({
    id: 'msg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    author: author, role: view.role, personId: view.personId, text: text.trim(), ts: new Date().toISOString()
  });
  if(DATA.messages.length>200) DATA.messages = DATA.messages.slice(-200);
  saveState('Message envoyé');
}

function renderDiscussion(){
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal chat-modal"></div>');
  m.appendChild(el('<h2>Discussion équipe</h2>'));
  const list = el('<div class="chat-list"></div>');
  const msgs = (DATA.messages||[]).slice().sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
  if(msgs.length===0){
    list.appendChild(el('<div class="empty-msg">Aucun message pour le moment. Écris le premier ci-dessous.</div>'));
  } else {
    msgs.forEach(msg=>{
      const mine = msg.personId && msg.personId===view.personId;
      const bubble = el('<div class="chat-msg'+(mine?' mine':'')+'"></div>');
      bubble.appendChild(el('<div class="chat-meta"><b>'+msg.author+'</b> · '+fmtDateTime(msg.ts)+'</div>'));
      const textDiv = document.createElement('div');
      textDiv.className = 'chat-text';
      textDiv.textContent = msg.text;
      bubble.appendChild(textDiv);
      list.appendChild(bubble);
    });
  }
  m.appendChild(list);

  const inputRow = el('<div class="chat-input-row"></div>');
  const ta = document.createElement('textarea');
  ta.rows = 2;
  ta.placeholder = 'Écris un message à toute l\'équipe...';
  inputRow.appendChild(ta);
  const sendBtn = el('<button class="btn primary">Envoyer</button>');
  sendBtn.onclick = ()=>{
    const t = ta.value;
    if(!t || !t.trim()) return;
    view.discussionOpen = false;
    postMessage(t);
  };
  inputRow.appendChild(sendBtn);
  m.appendChild(inputRow);

  const closeBtn = el('<button class="btn" style="margin-top:10px;">Fermer</button>');
  closeBtn.onclick = ()=>{ view.discussionOpen=false; render(); };
  m.appendChild(closeBtn);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.discussionOpen=false; render(); } };
  return overlay;
}

// ---------- DEPARTMENT SCREEN ----------
function isNewForDept(c, dept){
  // "Notification" signal: an item the department hasn't started touching yet —
  // either just launched by Commercial, or just handed off by the previous
  // department (for stock, arrival in the queue at all IS the notification).
  if(dept==='stock') return true;
  return c[dept].statut==='En attente';
}

function renderDeptScreen(){
  const w = el('<div></div>');
  const dept = view.role;
  const active = DATA.commandes.filter(c=>{
    if(dept==='stock') return c.emballage.statut==='Prête' && (c.stock.quantiteRecue===''||c.stock.quantiteRecue===null);
    const st = c[dept].statut;
    return st!=='Prête' && st!=='Annulée';
  });
  const newCount = active.filter(c=>isNewForDept(c,dept)).length;
  const ecarts = dept==='emballage' ? ecartsAGerer() : [];
  w.appendChild(topbar('Espace '+DEPT_LABEL[view.role], newCount+ecarts.length));
  const wrap = el('<div class="wrap"></div>');

  if(dept==='emballage' && ecarts.length){
    wrap.appendChild(el('<div class="section-title" style="background:var(--red);">Écarts de stock à gérer ('+ecarts.length+')</div>'));
    const ecBody = el('<div class="section-body"></div>');
    ecarts.forEach(c=>ecBody.appendChild(renderEcartCard(c)));
    wrap.appendChild(ecBody);
  }

  active.sort((a,b)=>{
    if(a.urgent!==b.urgent) return a.urgent? -1:1;
    const an = isNewForDept(a,dept), bn = isNewForDept(b,dept);
    if(an!==bn) return an? -1:1;
    return (a.dateCommande||'').localeCompare(b.dateCommande||'');
  });
  wrap.appendChild(el('<div class="section-title">Tâches en cours ('+active.length+')'+(newCount?' — dont '+newCount+' nouvelle(s)':'')+'</div>'));
  const body = el('<div class="section-body"></div>');
  if(active.length===0){
    body.appendChild(el('<div class="empty-msg">Aucune commande en attente pour '+DEPT_LABEL[dept]+'.</div>'));
  } else {
    active.forEach(c=>body.appendChild(renderDeptCard(c, dept)));
  }
  wrap.appendChild(body);

  const doneList = DATA.commandes.filter(c=>{
    if(dept==='stock') return c.emballage.statut==='Prête' && c.stock.quantiteRecue!=='' && c.stock.quantiteRecue!=null;
    return c[dept].statut==='Prête' || c[dept].statut==='Annulée';
  });
  const toggle = el('<button class="collapse-toggle">'+(view.showDone[dept]?'Masquer':'Voir')+' les commandes terminées ('+doneList.length+')</button>');
  toggle.onclick = ()=>{ view.showDone[dept]=!view.showDone[dept]; render(); };
  wrap.appendChild(toggle);
  if(view.showDone[dept]){
    const dl = el('<div class="done-list"></div>');
    doneList.forEach(c=>{
      const st = dept==='stock' ? statutReception(c) : c[dept].statut;
      dl.appendChild(el('<div class="item"><span>'+c.reference+' — '+c.article+'</span><span>'+st+'</span></div>'));
    });
    wrap.appendChild(dl);
  }
  w.appendChild(wrap);
  return w;
}

function ecartsAGerer(){
  return DATA.commandes.filter(c=>{ const e=ecartStock(c); return e!==null && e!==0 && !c.ecartGere; });
}

function renderEcartCard(c){
  const e = ecartStock(c);
  const card = el('<div class="dept-card" style="border-left:4px solid var(--red);"></div>');
  const head = el('<div class="head"></div>');
  head.appendChild(el('<div><div class="ref">'+c.reference+'</div><div class="art">'+c.article+' · '+c.client+'</div></div>'));
  head.appendChild(el('<span class="pill probleme">'+(e>0?'+':'')+e+' pièce(s)</span>'));
  card.appendChild(head);
  card.appendChild(el('<div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;">Commandé : '+c.quantite+' pièces · Reçu : '+c.stock.quantiteRecue+' pièces le '+fmtDate(c.stock.dateReception)+'</div>'));

  const notesWrap = el('<div style="margin-bottom:8px;"></div>');
  (c.ecartNotes||[]).forEach(n=>{
    notesWrap.appendChild(el('<div style="font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:5px;"><b>'+n.author+'</b> · '+fmtDateTime(n.ts)+'<br>'+n.text+'</div>'));
  });
  card.appendChild(notesWrap);

  const ta = document.createElement('textarea'); ta.rows=2;
  ta.placeholder = 'Explique la cause / action prise (obligatoire pour marquer comme géré)...';
  ta.style.cssText = 'width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:Arial,sans-serif;margin-bottom:8px;';
  card.appendChild(ta);

  function pushNoteIfAny(){
    const txt = ta.value.trim();
    if(!txt) return false;
    c.ecartNotes = c.ecartNotes || [];
    const person = currentPerson();
    c.ecartNotes.push({author: person?person.name:(ROLE_LABEL[view.role]||'Inconnu'), text: txt, ts: new Date().toISOString()});
    return true;
  }

  const btnRow = el('<div class="save-row"></div>');
  const addNoteBtn = el('<button class="btn small">+ Ajouter une note</button>');
  addNoteBtn.onclick = ()=>{
    if(pushNoteIfAny()) saveState('Note ajoutée pour '+c.reference);
  };
  const resolveBtn = el('<button class="btn primary small">Marquer comme géré</button>');
  resolveBtn.onclick = ()=>{
    const addedNow = pushNoteIfAny();
    const hasAnyNote = addedNow || (c.ecartNotes && c.ecartNotes.length>0);
    if(!hasAnyNote){ alert('Ajoute une note expliquant la cause avant de marquer comme géré.'); return; }
    c.ecartGere = true;
    saveState('Écart marqué comme géré : '+c.reference);
  };
  btnRow.appendChild(addNoteBtn);
  btnRow.appendChild(resolveBtn);
  card.appendChild(btnRow);
  return card;
}

function renderDeptCard(c, dept){
  const card = el('<div class="dept-card'+(c.urgent?' urgent':'')+'"></div>');
  const head = el('<div class="head"></div>');
  head.appendChild(el('<div><div class="ref">'+c.reference+'</div><div class="art">'+c.article+' · '+c.client+' · '+c.quantite+' pièces</div></div>'));
  const tags = el('<div style="display:flex;gap:6px;"></div>');
  if(isNewForDept(c,dept)) tags.appendChild(el('<span class="pill nouveau">NOUVEAU</span>'));
  if(c.urgent) tags.appendChild(el('<span class="urgent-tag">URGENT</span>'));
  head.appendChild(tags);
  card.appendChild(head);

  if(dept==='stock'){
    const row = el('<div class="field-row"></div>');
    const f1 = el('<div><label>Quantité reçue (pièces)</label></div>');
    const inp1 = document.createElement('input'); inp1.type='number'; inp1.value=c.stock.quantiteRecue;
    f1.appendChild(inp1); row.appendChild(f1);
    const f2 = el('<div><label>Date de réception</label></div>');
    const inp2 = document.createElement('input'); inp2.type='date'; inp2.value=c.stock.dateReception||'';
    f2.appendChild(inp2); row.appendChild(f2);
    card.appendChild(row);
    const saveRow = el('<div class="save-row"></div>');
    const btn = el('<button class="btn primary">Enregistrer</button>');
    btn.onclick = ()=>{
      c.stock.quantiteRecue = inp1.value===''?'':Number(inp1.value);
      c.stock.dateReception = inp2.value;
      const e = ecartStock(c);
      if(e!==null && e!==0){
        // a fresh (or changed) discrepancy always needs fresh attention,
        // even if a previous reception on this order had been marked "géré"
        c.ecartGere = false;
      }
      saveState('Réception stock enregistrée pour '+c.reference);
    };
    saveRow.appendChild(btn);
    card.appendChild(saveRow);
    return card;
  }

  const d = c[dept];
  const row1 = el('<div class="field-row"></div>');
  const f1 = el('<div><label>Statut '+DEPT_LABEL[dept]+'</label></div>');
  const sel = document.createElement('select');
  STATUS_OPTIONS.forEach(o=>{
    const opt = document.createElement('option'); opt.value=o; opt.textContent=o;
    if(o===d.statut) opt.selected=true;
    sel.appendChild(opt);
  });
  f1.appendChild(sel); row1.appendChild(f1);
  card.appendChild(row1);

  const row2 = el('<div class="field-row"></div>');
  let dateInputs = [];
  if(dept==='decoupe'){
    const f2 = el('<div><label>Découpe prévue le</label></div>');
    const i2 = document.createElement('input'); i2.type='date'; i2.value=d.prevueLe||''; f2.appendChild(i2); row2.appendChild(f2);
    const f3 = el('<div><label>Découpe faite le</label></div>');
    const i3 = document.createElement('input'); i3.type='date'; i3.value=d.faiteLe||''; f3.appendChild(i3); row2.appendChild(f3);
    dateInputs = [['prevueLe',i2],['faiteLe',i3]];
  } else if(dept==='confection'){
    const f2 = el('<div><label>Atelier / Chaîne</label></div>');
    const i2 = document.createElement('input'); i2.type='text'; i2.value=d.atelier||''; f2.appendChild(i2); row2.appendChild(f2);
    const f3 = el('<div><label>Début</label></div>');
    const i3 = document.createElement('input'); i3.type='date'; i3.value=d.debut||''; f3.appendChild(i3); row2.appendChild(f3);
    dateInputs = [['atelier',i2],['debut',i3]];
  } else if(dept==='emballage'){
    const f2 = el('<div><label>Début</label></div>');
    const i2 = document.createElement('input'); i2.type='date'; i2.value=d.debut||''; f2.appendChild(i2); row2.appendChild(f2);
    const f3 = el('<div><label>Fin</label></div>');
    const i3 = document.createElement('input'); i3.type='date'; i3.value=d.fin||''; f3.appendChild(i3); row2.appendChild(f3);
    dateInputs = [['debut',i2],['fin',i3]];
  }
  card.appendChild(row2);

  let extraRow=null, i4=null;
  if(dept==='confection'){
    extraRow = el('<div class="field-row"></div>');
    const f4 = el('<div><label>Fin</label></div>');
    i4 = document.createElement('input'); i4.type='date'; i4.value=d.fin||''; f4.appendChild(i4); extraRow.appendChild(f4);
    card.appendChild(extraRow);
  }

  const saveRow = el('<div class="save-row"></div>');
  const btn = el('<button class="btn primary">Enregistrer</button>');
  btn.onclick = ()=>{
    d.statut = sel.value;
    dateInputs.forEach(([key,inp])=>{ d[key]=inp.value; });
    if(dept==='confection' && i4) d.fin = i4.value;
    saveState('Mis à jour : '+c.reference);
  };
  saveRow.appendChild(btn);
  card.appendChild(saveRow);
  return card;
}

  // ---- Tissus & leurs couleurs ----

    const delTissuBtn = el('<button class="btn small" style="color:#A42834;border-color:#A42834;">Supprimer ce tissu</button>');
    delTissuBtn.onclick = ()=>{
      if(confirm('Supprimer le tissu "'+t+'" et sa liste de couleurs ?')){
        delete DATA.lists.tissus[t];
        saveState('Tissu supprimé : '+t);
      }

    head.appendChild(delTissuBtn);
    box.appendChild(head);
    const colorChips = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;"></div>');
    (DATA.lists.tissus[t]||[]).forEach(c=>{
      colorChips.appendChild(chip(c, ()=>{

      }));

    box.appendChild(colorChips);
    const addColorRow = el('<div style="display:flex;gap:6px;"></div>');
    const colorInp = document.createElement('input'); colorInp.placeholder='Nouvelle couleur pour '+t;
    const addColorBtn = el('<button class="btn small">+ Ajouter couleur</button>');
    const doAddColor = ()=>{
      const v = colorInp.value.trim().toUpperCase();
      if(!v) return;
      DATA.lists.tissus[t] = DATA.lists.tissus[t] || [];
      if(!DATA.lists.tissus[t].includes(v)){ DATA.lists.tissus[t].push(v); saveState('Couleur ajoutée à '+t+' : '+v); }
    };
    addColorBtn.onclick = doAddColor;
    colorInp.onkeydown = (e)=>{ if(e.key==='Enter') doAddColor(); };
    addColorRow.appendChild(colorInp); addColorRow.appendChild(addColorBtn);
    box.appendChild(addColorRow);
    wrap.appendChild(box);
  });
  const addTissuRow = el('<div style="display:flex;gap:6px;"></div>');
  const tissuInp = document.createElement('input'); tissuInp.placeholder='Nouveau tissu (ex : SOIE)';
  const addTissuBtn = el('<button class="btn primary small">+ Ajouter un tissu</button>');
  const doAddTissu = ()=>{
    const v = tissuInp.value.trim().toUpperCase();
    if(!v) return;
    if(!DATA.lists.tissus[v]){ DATA.lists.tissus[v]=[]; saveState('Tissu ajouté : '+v); }
  };
  addTissuBtn.onclick = doAddTissu;
  tissuInp.onkeydown = (e)=>{ if(e.key==='Enter') doAddTissu(); };
  addTissuRow.appendChild(tissuInp); addTissuRow.appendChild(addTissuBtn);
  wrap.appendChild(addTissuRow);

  return wrap;
}

function renderPersonModal(){
  const {mode, data} = view.personModal;
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal"></div>');
  m.appendChild(el('<h2>'+(mode==='create'?'Ajouter une personne':'Modifier '+(data.name||'cette personne'))+'</h2>'));

  function frow(fields){
    const row = el('<div class="frow"></div>');
    fields.forEach(f=>row.appendChild(f));
    m.appendChild(row);
  }
  function field(labelText, value, onchange, type){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>'+labelText+'</label>'));
    let inp;
    if(type==='role-select'){
      inp = document.createElement('select');
      ROLE_OPTIONS.forEach(r=>{
        const opt=document.createElement('option'); opt.value=r; opt.textContent=ROLE_LABEL[r];
        if(r===value) opt.selected=true; inp.appendChild(opt);
      });
    } else {
      inp = document.createElement('input');
      if(type) inp.type=type;
      inp.value = value===null||value===undefined?'':value;
    }
    inp.oninput = ()=>onchange(inp.value);
    wrap.appendChild(inp);
    return wrap;
  }
  frow([
    field('Nom', data.name, v=>data.name=v),
    field('Email', data.email, v=>data.email=v, 'email')
  ]);
  frow([
    field('Rôle / département', data.role, v=>data.role=v, 'role-select'),
    field('Code (4 chiffres)', data.code, v=>data.code=v)
  ]);
  const activeWrap = el('<div style="margin:6px 0 10px;"></div>');
  const activeLabel = el('<label style="display:flex;align-items:center;gap:6px;font-size:13px;"></label>');
  const activeInp = document.createElement('input'); activeInp.type='checkbox'; activeInp.checked = data.active!==false;
  activeInp.onchange = ()=>data.active=activeInp.checked;
  activeLabel.appendChild(activeInp);
  activeLabel.appendChild(document.createTextNode('Accès actif (décoche pour bloquer sans supprimer)'));
  activeWrap.appendChild(activeLabel);
  m.appendChild(activeWrap);

  function countActiveAdmins(excludeId){
    return (DATA.people||[]).filter(p=>p.role==='admin' && p.active!==false && p.id!==excludeId).length;
  }

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>');
  cancel.onclick = ()=>{ view.personModal=null; render(); };
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    if(!data.name || !data.name.trim()){ alert('Le nom est obligatoire.'); return; }
    if(!data.email || !data.email.trim()){ alert("L'email est obligatoire."); return; }
    if(!data.code || !String(data.code).trim()){ alert('Le code est obligatoire.'); return; }
    const wouldBeAdmin = data.role==='admin' && data.active!==false;
    if(!wouldBeAdmin && countActiveAdmins(data.id)===0 && (DATA.people||[]).some(p=>p.id===data.id && p.role==='admin')){
      alert("Impossible : il doit rester au moins un accès Admin actif.");
      return;
    }
    if(mode==='create'){
      DATA.people = DATA.people || [];
      DATA.people.push(data);
      view.personModal=null;
      saveState('Accès ajouté pour '+data.name);
    } else {
      const idx = (DATA.people||[]).findIndex(x=>x.id===data.id);
      if(idx>=0) DATA.people[idx]=data;
      view.personModal=null;
      saveState('Accès modifié pour '+data.name);
    }
  };
  const del = mode==='edit' ? el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>') : null;
  if(del){
    del.onclick = ()=>{
      if(data.role==='admin' && countActiveAdmins(data.id)===0){
        alert("Impossible de supprimer : il doit rester au moins un accès Admin actif.");
        return;
      }
      if(confirm("Supprimer l'accès de "+data.name+' ?')){
        DATA.people = (DATA.people||[]).filter(x=>x.id!==data.id);
        view.personModal=null;
        saveState('Accès supprimé pour '+data.name);
      }
    };
  }
  if(del) actions.appendChild(del);
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.personModal=null; render(); } };
  return overlay;
}

    // Sauvegarder dans Supabase
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/settings`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ config: settings }),
        signal: AbortSignal.timeout(5000)
      });
      if(!res.ok && res.status !== 204){
        throw new Error('Erreur Supabase');
      }
    } catch(e){
      console.log('Sync Supabase échouée:', e.message);
    }

    view.settingsModal=null;
    applyThemeSettings();
    showToast('✓ Paramètres enregistrés !');
    render();
  };
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.settingsModal=null; render(); } };
  return overlay;
}

function applyThemeSettings(){
  const settings = DATA.settings || {};
  const root = document.documentElement;
  if(settings.primaryColor) root.style.setProperty('--terracotta', settings.primaryColor);
  if(settings.secondaryColor) root.style.setProperty('--charcoal', settings.secondaryColor);
  const title = document.querySelector('.topbar .title');
  if(title && settings.companyName) title.textContent = settings.companyName;
  if(settings.logoUrl){
    document.querySelectorAll('img[src*="logo"]').forEach(img=>{
      img.src = settings.logoUrl;
    });
  }
}

function renderSearchResult(box){
  box.innerHTML='';
  const ref = (view.searchRef||'').trim();
  if(!ref){ box.appendChild(el('<div class="search-msg">Tape une référence ci-dessus.</div>')); return; }
  const matches = DATA.commandes.filter(c=>c.reference.toLowerCase()===ref.toLowerCase());
  if(matches.length===0){ box.appendChild(el('<div class="search-msg">Aucune commande trouvée pour cette référence.</div>')); return; }
  const c = matches[matches.length-1];
  box.appendChild(el('<div class="search-msg">'+matches.length+' commande(s) trouvée(s) — détails de la plus récente :</div>'));
  box.appendChild(renderFiche(c));
}

function renderFiche(c){
  const f = el('<div class="fiche"></div>');
  const hero = el('<div class="hero"><div class="lbl">Date de livraison prévue</div><div class="val">'+(c.dateLivraisonPrevue?fmtDate(c.dateLivraisonPrevue):'—')+'</div></div>');
  f.appendChild(hero);
  const catProd = c.catalogueId ? catalogueById(c.catalogueId) : null;
  if(catProd && catProd.photo){
    const photoWrap = el('<div style="text-align:center;margin-bottom:12px;"></div>');
    const img = document.createElement('img');
    img.src = catProd.photo;
    img.style.cssText = 'width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--border);';
    photoWrap.appendChild(img);
    f.appendChild(photoWrap);
  }

  function grp(title,color,rows){
    const g = el('<div class="grp"></div>');
    g.appendChild(el('<div class="grp-head" style="background:'+color+'">'+title+'</div>'));
    rows.forEach(([k,v])=>g.appendChild(el('<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>')));
    f.appendChild(g);
  }
  grp('Identité article / commande','#1C1815',[
    ['Référence',c.reference],['Client',c.client],['Article',c.article],['Tissu',c.tissu],
    ['Tailles',formatTailles(c)],['Couleur',c.couleur],['Quantité',c.quantite+' pièces'],
    ['Date commande',fmtDate(c.dateCommande)],['Urgent',c.urgent?'Oui':'Non']
  ]);
  grp('Découpe','#6B4226',[
    ['Statut',pill(c.decoupe.statut)],['Prévue le',fmtDate(c.decoupe.prevueLe)],['Faite le',fmtDate(c.decoupe.faiteLe)]
  ]);
  grp('Confection','#A8492E',[
    ['Statut',pill(c.confection.statut)],['Atelier / Chaîne',c.confection.atelier||'—'],
    ['Début',fmtDate(c.confection.debut)],['Fin',fmtDate(c.confection.fin)]
  ]);
  grp('Emballage','#8A6D3B',[
    ['Statut',pill(c.emballage.statut)],['Début',fmtDate(c.emballage.debut)],['Fin',fmtDate(c.emballage.fin)]
  ]);
  const ep = ecartPoidsPiece(c);
  grp('Tissu / Matière','#4A6C6F',[
    ['Poids matelas (kg)',c.tissuInfo.poidsMatelas||'—'],['Poids/pièce (kg)',c.tissuInfo.poidsPiece||'—'],
    ['Conso tissu (kg)',c.tissuInfo.consoTissu||'—'],
    ['Écart vs moyenne',ep===null?'—':(Math.round(ep*1000)/10)+'%']
  ]);
  grp('Notes','#666666',[['Notes',c.notes||'—']]);
  const stockRows = [
    ['Quantité reçue',c.stock.quantiteRecue===''?'—':c.stock.quantiteRecue],
    ['Date réception',fmtDate(c.stock.dateReception)],
    ['Écart (pièces)',ecartStock(c)===null?'—':ecartStock(c)],
    ['Statut réception',statutReception(c)]
  ];
  const ecVal = ecartStock(c);
  if(ecVal!==null && ecVal!==0){
    stockRows.push(['Écart géré ?', c.ecartGere ? 'Oui' : 'Non — en attente (Emballage / Commercial)']);
    const lastNote = (c.ecartNotes && c.ecartNotes.length) ? c.ecartNotes[c.ecartNotes.length-1] : null;
    if(lastNote) stockRows.push(['Dernière note', lastNote.author+' : '+lastNote.text]);
  }
  grp('Stock','#3E5C76', stockRows);
  const editBtn = el('<button class="btn primary" style="margin-top:6px;">Modifier cette commande</button>');
  editBtn.onclick = ()=>{ view.modal = {mode:'edit', data:JSON.parse(JSON.stringify(c))}; render(); };
  f.appendChild(editBtn);
  return f;
}

function renderTable(){
  // Table-structural elements (thead/tr/td) cannot be created via the el()
  // innerHTML-on-a-<div> trick — the HTML parser drops them outside a real
  // <table> context. Build them with createElement instead.
  const wrap = document.createElement('div'); wrap.className = 'table-wrap';
  const t = document.createElement('table'); t.className = 'main';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['Référence','Article','Client','Qté','Découpe','Confection','Emballage','Livraison prévue',''].forEach(h=>{
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  t.appendChild(thead);
  const tbody = document.createElement('tbody');
  DATA.commandes.slice().reverse().forEach(c=>{
    const tr = document.createElement('tr');
    function td(html){ const cell=document.createElement('td'); cell.innerHTML=html; tr.appendChild(cell); }
    td('<b>'+c.reference+'</b>'+(c.urgent?' <span class="pill probleme">URG</span>':''));
    td(c.article);
    td(c.client);
    td(String(c.quantite));
    td(pill(c.decoupe.statut));
    td(pill(c.confection.statut));
    td(pill(c.emballage.statut));
    td(c.dateLivraisonPrevue?fmtDate(c.dateLivraisonPrevue):'—');
    const editTd = document.createElement('td');
    const b = document.createElement('button'); b.className='btn small'; b.textContent='Modifier';
    b.onclick = ()=>{ view.modal = {mode:'edit', data:JSON.parse(JSON.stringify(c))}; render(); };
    editTd.appendChild(b);
    tr.appendChild(editTd);
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

function blankCommande(){
  return {
    id: 'cmd_'+Date.now(), catalogueId:'', reference:'', client:'', article:'', tissu:'', tailles:{}, couleur:'',
    quantite:'', dateCommande: todayISO(), dateLivraisonPrevue:'', urgent:false,
    decoupe:{statut:'En attente',prevueLe:'',faiteLe:''},
    confection:{statut:'En attente',atelier:'',debut:'',fin:''},
    emballage:{statut:'En attente',debut:'',fin:''},
    tissuInfo:{poidsMatelas:'',poidsPiece:'',consoTissu:''},
    notes:'', stock:{quantiteRecue:'',dateReception:''}, ecartGere:false, ecartNotes:[]
  };
}

function renderModal(){
  const {mode, data} = view.modal;
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal"></div>');
  m.appendChild(el('<h2>'+(mode==='create'?'Nouvelle commande':'Modifier '+data.reference)+'</h2>'));

  function frow(fields){
    const row = el('<div class="frow"></div>');
    fields.forEach(f=>row.appendChild(f));
    m.appendChild(row);
  }
  function field(labelText, value, onchange, type, optsOverride){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>'+labelText+'</label>'));
    const inp = document.createElement(type==='select'?'select':'input');
    if(type && type!=='select') inp.type=type;
    if(type==='select'){
      const opts = optsOverride || STATUS_OPTIONS;
      if(optsOverride){
        const empty=document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —';
        if(!value) empty.selected=true; inp.appendChild(empty);
      }
      opts.forEach(o=>{
        const opt=document.createElement('option'); opt.value=o; opt.textContent=o;
        if(o===value) opt.selected=true; inp.appendChild(opt);
      });
    } else {
      inp.value = value===null||value===undefined?'':value;
    }
    inp.oninput = ()=>onchange(inp.value);
    wrap.appendChild(inp);
    return wrap;
  }
  function tissuSelectField(){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>Tissu</label>'));
    const inp = document.createElement('select');
    const empty=document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —';
    if(!data.tissu) empty.selected=true; inp.appendChild(empty);
    Object.keys(DATA.lists.tissus||{}).forEach(t=>{
      const opt=document.createElement('option'); opt.value=t; opt.textContent=t;
      if(t===data.tissu) opt.selected=true; inp.appendChild(opt);
    });
    inp.onchange = ()=>{
      data.tissu = inp.value;
      // couleur is scoped to the chosen tissu — clear it if it no longer applies
      if(!inp.value || !((DATA.lists.tissus[inp.value]||[]).includes(data.couleur))) data.couleur='';
      render();
    };
    wrap.appendChild(inp);
    return wrap;
  }
  function couleurSelectField(){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>Couleur'+(data.tissu?'':' (choisis un tissu d\'abord)')+'</label>'));
    const inp = document.createElement('select');
    inp.disabled = !data.tissu;
    const colors = (data.tissu && DATA.lists.tissus[data.tissu]) || [];
    const empty=document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —';
    if(!data.couleur) empty.selected=true; inp.appendChild(empty);
    colors.forEach(c=>{
      const opt=document.createElement('option'); opt.value=c; opt.textContent=c;
      if(c===data.couleur) opt.selected=true; inp.appendChild(opt);
    });
    inp.onchange = ()=>{ data.couleur = inp.value; };
    wrap.appendChild(inp);
    return wrap;
  }

  if((DATA.catalogue||[]).length){
    m.appendChild(el('<div class="grp-head" style="background:#4A6C6F">Produit du catalogue (optionnel)</div>'));
    const catWrap = el('<div style="margin-bottom:10px;"></div>');
    const catSel = document.createElement('select');
    const catEmpty = document.createElement('option'); catEmpty.value=''; catEmpty.textContent='— Commande libre (sans produit du catalogue) —';
    if(!data.catalogueId) catEmpty.selected=true; catSel.appendChild(catEmpty);
    (DATA.catalogue||[]).forEach(p=>{
      const opt = document.createElement('option'); opt.value=p.id; opt.textContent=p.article;
      if(p.id===data.catalogueId) opt.selected=true; catSel.appendChild(opt);
    });
    catSel.onchange = ()=>{
      data.catalogueId = catSel.value;
      const prod = catalogueById(catSel.value);
      if(prod){
        data.article = prod.article;
        if(prod.tissu && DATA.lists.tissus[prod.tissu]){
          data.tissu = prod.tissu;
          if(!(DATA.lists.tissus[prod.tissu]||[]).includes(data.couleur)) data.couleur='';
        }
        // drop any chosen size that isn't offered by this product
        const allowed = prod.tailles||[];
        Object.keys(data.tailles||{}).forEach(sz=>{ if(allowed.indexOf(sz)===-1) delete data.tailles[sz]; });
      }
      render();
    };
    catWrap.appendChild(catSel);
    if(data.catalogueId){
      const prod = catalogueById(data.catalogueId);
      if(prod && prod.photo){
        const img = document.createElement('img');
        img.src = prod.photo;
        img.style.cssText = 'width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);margin-top:8px;display:block;';
        catWrap.appendChild(img);
      }
    }
    m.appendChild(catWrap);
  }

  m.appendChild(el('<div class="grp-head" style="background:#1C1815">Identité article / commande</div>'));
  frow([
    field('Référence', data.reference, v=>data.reference=v),
    field('Client', data.client, v=>data.client=v)
  ]);
  frow([
    field('Article', data.article, v=>data.article=v),
    tissuSelectField()
  ]);
  frow([
    couleurSelectField()
  ]);
  m.appendChild(el('<label style="display:block;font-size:11px;color:var(--text-soft);margin-bottom:5px;">Répartition par taille (coche + quantité)</label>'));
  const sizeGrid = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:8px;"></div>');
  data.tailles = data.tailles || {};
  const sizeOptions = (data.catalogueId && catalogueById(data.catalogueId)) ? (catalogueById(data.catalogueId).tailles||[]) : (DATA.lists.tailles||[]);
  sizeOptions.forEach(sz=>{
    const cell = el('<div style="border:1px solid var(--border);border-radius:5px;padding:6px;"></div>');
    const lab = el('<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:bold;margin-bottom:4px;"></label>');
    const chk = document.createElement('input'); chk.type='checkbox';
    chk.checked = data.tailles[sz]!==undefined && data.tailles[sz]!=='' && data.tailles[sz]!=null;
    lab.appendChild(chk);
    lab.appendChild(document.createTextNode(sz));
    cell.appendChild(lab);
    const qtyInp = document.createElement('input'); qtyInp.type='number'; qtyInp.min='0';
    qtyInp.value = data.tailles[sz]!==undefined ? data.tailles[sz] : '';
    qtyInp.disabled = !chk.checked;
    qtyInp.oninput = ()=>{ data.tailles[sz] = qtyInp.value===''?'':Number(qtyInp.value); };
    chk.onchange = ()=>{
      qtyInp.disabled = !chk.checked;
      if(!chk.checked){ delete data.tailles[sz]; qtyInp.value=''; }
      else if(qtyInp.value===''){ qtyInp.focus(); }
    };
    cell.appendChild(qtyInp);
    sizeGrid.appendChild(cell);
  });
  m.appendChild(sizeGrid);
  frow([
    field('Quantité (pièces)', data.quantite, v=>data.quantite=v===''?'':Number(v), 'number'),
    field('Date commande', data.dateCommande, v=>data.dateCommande=v, 'date')
  ]);
  frow([
    field('Date de livraison prévue', data.dateLivraisonPrevue, v=>data.dateLivraisonPrevue=v, 'date')
  ]);
  const urgWrap = el('<div style="margin:6px 0 10px;"></div>');
  const urgLabel = el('<label style="display:flex;align-items:center;gap:6px;font-size:13px;"></label>');
  const urgInp = document.createElement('input'); urgInp.type='checkbox'; urgInp.checked=!!data.urgent;
  urgInp.onchange = ()=>data.urgent=urgInp.checked;
  urgLabel.appendChild(urgInp);
  urgLabel.appendChild(document.createTextNode('Commande urgente'));
  urgWrap.appendChild(urgLabel);
  m.appendChild(urgWrap);

  m.appendChild(el('<div class="grp-head" style="background:#6B4226">Découpe</div>'));
  frow([
    field('Statut', data.decoupe.statut, v=>data.decoupe.statut=v, 'select'),
    field('Prévue le', data.decoupe.prevueLe, v=>data.decoupe.prevueLe=v, 'date')
  ]);
  frow([ field('Faite le', data.decoupe.faiteLe, v=>data.decoupe.faiteLe=v, 'date') ]);

  m.appendChild(el('<div class="grp-head" style="background:#A8492E">Confection</div>'));
  frow([
    field('Statut', data.confection.statut, v=>data.confection.statut=v, 'select'),
    field('Atelier / Chaîne', data.confection.atelier, v=>data.confection.atelier=v)
  ]);
  frow([
    field('Début', data.confection.debut, v=>data.confection.debut=v, 'date'),
    field('Fin', data.confection.fin, v=>data.confection.fin=v, 'date')
  ]);

  m.appendChild(el('<div class="grp-head" style="background:#8A6D3B">Emballage</div>'));
  frow([
    field('Statut', data.emballage.statut, v=>data.emballage.statut=v, 'select'),
    field('Début', data.emballage.debut, v=>data.emballage.debut=v, 'date')
  ]);
  frow([ field('Fin', data.emballage.fin, v=>data.emballage.fin=v, 'date') ]);

  m.appendChild(el('<div class="grp-head" style="background:#4A6C6F">Tissu / Matière</div>'));
  frow([
    field('Poids matelas (kg)', data.tissuInfo.poidsMatelas, v=>data.tissuInfo.poidsMatelas=v===''?'':Number(v), 'number'),
    field('Poids/pièce (kg)', data.tissuInfo.poidsPiece, v=>data.tissuInfo.poidsPiece=v===''?'':Number(v), 'number')
  ]);
  frow([ field('Conso tissu (kg)', data.tissuInfo.consoTissu, v=>data.tissuInfo.consoTissu=v===''?'':Number(v), 'number') ]);

  m.appendChild(el('<div class="grp-head" style="background:#666666">Notes</div>'));
  const notesWrap = el('<div style="margin-bottom:8px;"></div>');
  const notesArea = document.createElement('textarea'); notesArea.rows=2; notesArea.value=data.notes||'';
  notesArea.oninput = ()=>data.notes=notesArea.value;
  notesWrap.appendChild(notesArea);
  m.appendChild(notesWrap);

  m.appendChild(el('<div class="grp-head" style="background:#3E5C76">Stock</div>'));
  frow([
    field('Quantité reçue', data.stock.quantiteRecue, v=>data.stock.quantiteRecue=v===''?'':Number(v), 'number'),
    field('Date réception', data.stock.dateReception, v=>data.stock.dateReception=v, 'date')
  ]);

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>');
  cancel.onclick = ()=>{ view.modal=null; render(); };
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    if(!data.reference || !data.reference.trim()){ alert('La référence est obligatoire.'); return; }
    if(mode==='create'){
      DATA.commandes.push(data);
      view.modal=null;
      saveState('Nouvelle commande ajoutée : '+data.reference);
    } else {
      const idx = DATA.commandes.findIndex(x=>x.id===data.id);
      if(idx>=0) DATA.commandes[idx]=data;
      view.modal=null;
      saveState('Commande modifiée : '+data.reference);
    }
  };
  const del = mode==='edit' ? el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>') : null;
  if(del){
    del.onclick = ()=>{
      if(confirm('Supprimer définitivement la commande '+data.reference+' ?')){
        DATA.commandes = DATA.commandes.filter(x=>x.id!==data.id);
        view.modal=null;
        saveState('Commande supprimée : '+data.reference);
      }
    };
  }
  if(del) actions.appendChild(del);
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.modal=null; render(); } };
  return overlay;
}

// ---------- PERSISTENCE ----------
function showToast(msg){
  const t = el('<div class="toast">'+msg+'</div>');
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

async function saveState(toastMsg){
  render();
  if(toastMsg) showToast('✓ '+toastMsg);
}


async function boot(){
  await loadSettingsFromSupabase();
  render();
}

boot();
</script>
</body>
</html>
