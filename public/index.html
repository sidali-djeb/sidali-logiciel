    const repl = el('<button class="btn" style="color:#A42834;border-color:#A42834;">Remplacer tout</button>');
    repl.onclick = ()=>{
      const hasAdmin = Array.isArray(d.people) && d.people.some(p=>p.role==='admin' && p.active!==false);
      if(!hasAdmin){ alert('Remplacement refusé : ce fichier ne contient aucun compte admin actif (tu ne pourrais plus te connecter).'); return; }

      exportJSON();
      const keep = DATA;
      DATA = Object.assign({}, keep, d);
      finish('Données remplacées');
    };
    actions.appendChild(cancel); actions.appendChild(merge); actions.appendChild(repl);
  }
  m.appendChild(actions);

function renderPersonModal(){
  const {mode, data} = view.personModal;
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal"></div>');
  m.appendChild(el('<h2>'+(mode==='create'?'Ajouter une personne':'Modifier '+(data.name||'cette personne'))+'</h2>'));

  function frow(fields){
    const row = el('<div class="frow"></div>');
    fields.forEach(f=>row.appendChild(f));
    m.appendChild(row);
  }
  function field(labelText, value, onchange, type){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>'+labelText+'</label>'));
    let inp;
    if(type==='role-select'){
      inp = document.createElement('select');
      ROLE_OPTIONS.forEach(r=>{
        const opt=document.createElement('option'); opt.value=r; opt.textContent=ROLE_LABEL[r];
        if(r===value) opt.selected=true; inp.appendChild(opt);
      });
    } else {
      inp = document.createElement('input');
      if(type) inp.type=type;
      inp.value = value===null||value===undefined?'':value;
    }
    inp.oninput = ()=>onchange(inp.value);
    wrap.appendChild(inp);
    return wrap;
  }
  frow([
    field('Nom', data.name, v=>data.name=v),
    field('Email', data.email, v=>data.email=v, 'email')
  ]);
  frow([
    field('Rôle / département', data.role, v=>data.role=v, 'role-select'),
    field('Code (4 chiffres)', data.code, v=>data.code=v)
  ]);
  const activeWrap = el('<div style="margin:6px 0 10px;"></div>');
  const activeLabel = el('<label style="display:flex;align-items:center;gap:6px;font-size:13px;"></label>');
  const activeInp = document.createElement('input'); activeInp.type='checkbox'; activeInp.checked = data.active!==false;
  activeInp.onchange = ()=>data.active=activeInp.checked;
  activeLabel.appendChild(activeInp);
  activeLabel.appendChild(document.createTextNode('Accès actif (décoche pour bloquer sans supprimer)'));
  activeWrap.appendChild(activeLabel);
  m.appendChild(activeWrap);

  function countActiveAdmins(excludeId){
    return (DATA.people||[]).filter(p=>p.role==='admin' && p.active!==false && p.id!==excludeId).length;
  }

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>');
  cancel.onclick = ()=>{ view.personModal=null; render(); };
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    if(!data.name || !data.name.trim()){ alert('Le nom est obligatoire.'); return; }
    if(!data.email || !data.email.trim()){ alert("L'email est obligatoire."); return; }
    if(!data.code || !String(data.code).trim()){ alert('Le code est obligatoire.'); return; }
    const wouldBeAdmin = data.role==='admin' && data.active!==false;
    if(!wouldBeAdmin && countActiveAdmins(data.id)===0 && (DATA.people||[]).some(p=>p.id===data.id && p.role==='admin')){
      alert("Impossible : il doit rester au moins un accès Admin actif.");
      return;
    }
    if(mode==='create'){
      DATA.people = DATA.people || [];
      DATA.people.push(data);
      view.personModal=null;
      saveState('Accès ajouté pour '+data.name);
    } else {
      const idx = (DATA.people||[]).findIndex(x=>x.id===data.id);
      if(idx>=0) DATA.people[idx]=data;
      view.personModal=null;
      saveState('Accès modifié pour '+data.name);
    }
  };
  const del = mode==='edit' ? el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>') : null;
  if(del){
    del.onclick = ()=>{
      if(data.role==='admin' && countActiveAdmins(data.id)===0){
        alert("Impossible de supprimer : il doit rester au moins un accès Admin actif.");
        return;
      }
      if(confirm("Supprimer l'accès de "+data.name+' ?')){
        DATA.people = (DATA.people||[]).filter(x=>x.id!==data.id);
        view.personModal=null;
        saveState('Accès supprimé pour '+data.name);
      }
    };
  }
  if(del) actions.appendChild(del);
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.personModal=null; render(); } };
  return overlay;
}

// ---------- CATALOGUE PRODUITS ----------
function blankCatalogueItem(){
  return {id:'prod_'+Date.now(), article:'', tissu:'', tailles:[], photo:'', refPatron:'', consoMoyenne:'', consoUnite:'kg', creeLe:'', modifieLe:''};
}

function launchFromProduct(p){
  const d = blankCommande();
  d.catalogueId = p.id; d.article = p.article || '';
  if(p.tissu && DATA.lists && DATA.lists.tissus && DATA.lists.tissus[p.tissu]) d.tissu = p.tissu;
  view.modal = {mode:'create', data:d};
  render();
}
function renderLaunchBar(){
  const bar = el('<div class="cat-launch"></div>');
  bar.appendChild(el('<b>Lancer une commande depuis le catalogue :</b>'));
  const sel = document.createElement('select');
  const e0 = document.createElement('option'); e0.value=''; e0.textContent='— Choisir un produit —'; sel.appendChild(e0);
  (DATA.catalogue||[]).slice().sort((a,b)=>String(a.article||'').localeCompare(String(b.article||''),'fr')).forEach(p=>{
    const o = document.createElement('option'); o.value=p.id; o.textContent=p.article||'(sans nom)'+(p.refPatron?' · '+p.refPatron:''); sel.appendChild(o);
  });
  const go = el('<button class="btn primary">Lancer la commande</button>');
  go.onclick = ()=>{
    const p = (DATA.catalogue||[]).find(x=>x.id===sel.value);
    if(!p){ alert('Choisis d\'abord un produit dans la liste.'); return; }
    launchFromProduct(p);
  };
  bar.appendChild(sel); bar.appendChild(go);
  return bar;
}
function catDate(iso){
  if(!iso) return '—';
  const d = new Date(iso); if(isNaN(d.getTime())) return '—';
  const p = n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function catOrdersUsing(id){ return (DATA.commandes||[]).filter(c=>c.catalogueId===id).length; }
function catDuplicate(ids){
  const now = new Date().toISOString(); let n = 0;
  ids.forEach((id,i)=>{
    const p = (DATA.catalogue||[]).find(x=>x.id===id); if(!p) return;
    const c = JSON.parse(JSON.stringify(p));
    c.id = 'prod_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5);
    c.article = (p.article||'Produit')+' (copie)';
    c.creeLe = c.modifieLe = now;
    DATA.catalogue.push(c); n++;
  });
  return n;
}
function catDelete(ids){
  const used = ids.reduce((a,id)=>a+catOrdersUsing(id),0);
  const names = ids.map(id=>{ const p=(DATA.catalogue||[]).find(x=>x.id===id); return p?p.article:''; }).filter(Boolean);
  const msg = (ids.length===1 ? 'Supprimer "'+names[0]+'" du catalogue ?' : 'Supprimer ces '+ids.length+' produits du catalogue ?\n\n'+names.slice(0,8).join('\n')+(names.length>8?'\n…':''))
    + (used ? '\n\nAttention : '+used+' commande(s) utilisent déjà ce(s) produit(s). Elles restent intactes, mais ne seront plus liées au catalogue.' : '')
    + '\n\nCette action est définitive.';
  if(!confirm(msg)) return false;
  DATA.catalogue = (DATA.catalogue||[]).filter(x=>ids.indexOf(x.id)<0);
  view.catSel = {};
  return true;
}
function renderCatalogueTable(){
  view.catSel = view.catSel || {};
  const box = document.createElement('div');
  if((DATA.catalogue||[]).length) box.appendChild(renderLaunchBar());
  // barre : recherche + tri
  const bar = el('<div class="cat-bar"></div>');
  const q = document.createElement('input'); q.type='search'; q.placeholder='Rechercher un produit (nom, tissu, patron)…'; q.value = view.catSearch||'';
  const sortSel = document.createElement('select');
  [['recent','Les plus récents d\'abord'],['ancien','Les plus anciens d\'abord'],['az','Ordre alphabétique (A → Z)']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if((view.catSort||'recent')===v) o.selected=true; sortSel.appendChild(o); });
  bar.appendChild(q); bar.appendChild(sortSel);
  box.appendChild(bar);
  const bulk = el('<div class="cat-bulk"></div>');
  box.appendChild(bulk);
  const wrap = document.createElement('div'); wrap.className='table-wrap';
  const t = document.createElement('table'); t.className='main';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const thSel = document.createElement('th'); const allCk = document.createElement('input'); allCk.type='checkbox'; allCk.title='Tout sélectionner'; thSel.appendChild(allCk); headRow.appendChild(thSel);
  ['Photo','Article','Réf. patron','Tissu','Conso moyenne','Tailles disponibles','Ajouté le','Modifié le','Actions'].forEach(h=>{
    const th = document.createElement('th'); th.textContent=h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  t.appendChild(thead);
  const tbody = document.createElement('tbody');
  t.appendChild(tbody);
  wrap.appendChild(t);
  box.appendChild(wrap);
  const empty = el('<div class="empty-msg" style="display:none;">Aucun produit trouvé.</div>');
  box.appendChild(empty);

  function visible(){
    const term = (view.catSearch||'').trim().toLowerCase();
    let list = (DATA.catalogue||[]).slice();
    if(term) list = list.filter(p=>[p.article,p.tissu,p.refPatron].join(' ').toLowerCase().indexOf(term)>=0);
    const sm = view.catSort||'recent';
    const dt = p=>(p.modifieLe||p.creeLe||'');
    if(sm==='az') list.sort((a,b)=>String(a.article||'').localeCompare(String(b.article||''),'fr'));
    else if(sm==='ancien') list.sort((a,b)=>dt(a).localeCompare(dt(b)));
    else list.sort((a,b)=>dt(b).localeCompare(dt(a)));
    return list;
  }
  function selIds(){ return Object.keys(view.catSel).filter(k=>view.catSel[k] && (DATA.catalogue||[]).some(p=>p.id===k)); }
  function fillBulk(){
    const ids = selIds();
    bulk.innerHTML = '';
    bulk.style.display = ids.length ? 'flex' : 'none';
    if(!ids.length) return;
    const lbl = el('<b></b>'); lbl.textContent = ids.length+' produit(s) sélectionné(s)';
    const dup = el('<button class="btn small">Dupliquer la sélection</button>');
    dup.onclick = ()=>{ const n = catDuplicate(ids); view.catSel = {}; saveState(n+' produit(s) dupliqué(s)'); };
    const del = el('<button class="btn small" style="color:#E0392D;">Supprimer la sélection</button>');
    del.onclick = ()=>{ if(catDelete(ids)) saveState(ids.length+' produit(s) supprimé(s) du catalogue'); };
    const none = el('<button class="btn small">Annuler</button>');
    none.onclick = ()=>{ view.catSel = {}; fill(); };
    bulk.appendChild(lbl); bulk.appendChild(dup); bulk.appendChild(del); bulk.appendChild(none);
  }
  function fill(){
    tbody.innerHTML = '';
    const list = visible();
    empty.style.display = list.length ? 'none' : 'block';
    empty.textContent = (DATA.catalogue||[]).length ? 'Aucun produit ne correspond à la recherche.' : 'Le catalogue est vide. Ajoute ton premier produit avec « + Ajouter un produit ».';
    list.forEach(p=>{
      const tr = document.createElement('tr');
      const ckTd = document.createElement('td'); const ck = document.createElement('input'); ck.type='checkbox'; ck.checked = !!view.catSel[p.id];
      ck.onchange = ()=>{ if(ck.checked) view.catSel[p.id]=true; else delete view.catSel[p.id]; allCk.checked = list.every(x=>view.catSel[x.id]); fillBulk(); };
      ckTd.appendChild(ck); tr.appendChild(ckTd);
      const photoTd = document.createElement('td');
      if(p.photo){
        const img = document.createElement('img');
        img.src = p.photo; img.style.cssText='width:36px;height:36px;object-fit:cover;border-radius:5px;border:1px solid var(--border);display:block;';
        photoTd.appendChild(img);
      } else {
        photoTd.appendChild(el('<div style="width:36px;height:36px;border-radius:5px;background:var(--bg);border:1px solid var(--border);"></div>'));
      }
      tr.appendChild(photoTd);
      function td(text){ const cell=document.createElement('td'); cell.textContent=text; tr.appendChild(cell); return cell; }
      td(p.article||'—').style.fontWeight='bold';
      td(p.refPatron||'—');
      td(p.tissu||'—');
      td((p.consoMoyenne!==''&&p.consoMoyenne!=null) ? p.consoMoyenne+' '+(p.consoUnite||'kg')+' / pièce' : '—');
      td((p.tailles||[]).join(' / ')||'—');
      td(catDate(p.creeLe));
      td(catDate(p.modifieLe));
      const act = document.createElement('td'); act.style.whiteSpace='normal'; act.style.minWidth='150px';
      const b0 = el('<button class="btn small primary">Lancer commande</button>');
      b0.onclick = ()=>launchFromProduct(p);
      const b1 = el('<button class="btn small">Modifier</button>');
      b1.onclick = ()=>{ view.catalogueModal = {mode:'edit', data:JSON.parse(JSON.stringify(p))}; render(); };
      const b2 = el('<button class="btn small">Dupliquer</button>');
      b2.onclick = ()=>{ catDuplicate([p.id]); saveState('Produit dupliqué : '+p.article); };
      const b3 = el('<button class="btn small" style="color:#E0392D;">Supprimer</button>');
      b3.onclick = ()=>{ if(catDelete([p.id])) saveState('Produit supprimé du catalogue : '+p.article); };
      const grp = el('<div style="display:flex;flex-wrap:wrap;gap:6px;max-width:190px;"></div>'); grp.appendChild(b0); grp.appendChild(b1); grp.appendChild(b2); grp.appendChild(b3); act.appendChild(grp);
      tr.appendChild(act);
      tbody.appendChild(tr);
    });
    allCk.checked = list.length>0 && list.every(x=>view.catSel[x.id]);
    fillBulk();
  }
  allCk.onchange = ()=>{ visible().forEach(p=>{ if(allCk.checked) view.catSel[p.id]=true; else delete view.catSel[p.id]; }); fill(); };
  q.oninput = ()=>{ view.catSearch = q.value; fill(); };
  sortSel.onchange = ()=>{ view.catSort = sortSel.value; fill(); };
  fill();
  return box;
}

// ---------- CODE QR + PAIEMENTS ----------
const SITE_URL = 'https://sidali-logiciel.vercel.app';
function siteBase(){ return /^https?:/.test(location.protocol) ? location.origin : SITE_URL; }
function orderUrl(c){ return siteBase()+'/?cmd='+encodeURIComponent(c.id); }
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function qrSvg(text, px){
  const q = new QRLib(-1, 0); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4; let d = '';
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) d += 'M'+(k+m)+' '+(r+m)+'h1v1h-1z';
  const t = n+2*m;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" width="'+px+'" height="'+px+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
// Ouvre la commande scannée (QR) juste après la connexion
function applyScan(){
  const id = view.scanId;
  if(!id || !view.personId) return;
  view.scanId = null;
  const c = (DATA.commandes||[]).find(x=>x.id===id);
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
  if(!c){ setTimeout(()=>showToast('⚠ Commande introuvable'), 400); return; }
  view.focusId = c.id;
  view.searchRef = c.reference;
  view.scrollToFiche = true;
  if(view.role==='admin') view.adminOpen = {recherche:true};
}

function canManagePay(){ return view.role==='admin' || view.role==='commercial'; }
function fmtDA(n){ return (Number(n)||0).toLocaleString('fr-FR', {maximumFractionDigits:2})+' DA'; }
function payInfo(c){
  const p = c.paiement || {};
  const total = Number(p.total) || 0;
  const vers = Array.isArray(p.versements) ? p.versements : [];
  const paye = vers.reduce((a,v)=>a+(Number(v.montant)||0), 0);
  const reste = Math.max(total-paye, 0);
  let statut;
  if(total<=0) statut = 'À définir';
  else if(paye<=0) statut = 'Non payé';
  else if(paye>=total) statut = 'Payé';
  else statut = 'Partiel';
  const dernier = vers.map(v=>v.date||'').filter(Boolean).sort().pop() || '';
  return {total, paye, reste, statut, dernier, vers};
}
const PAY_CLASS = {'Payé':'prete','Partiel':'cours','Non payé':'probleme','À définir':'attente'};
function payPill(st){ return '<span class="pill '+(PAY_CLASS[st]||'attente')+'">'+st+'</span>'; }
function nbNonSoldes(){
  return (DATA.commandes||[]).filter(c=>{ const st = payInfo(c).statut; return st==='Non payé' || st==='Partiel'; }).length;
}

function renderPaymentsPanel(){
  const wrap = document.createElement('div');
  const all = (DATA.commandes||[]).map(c=>({c, pi:payInfo(c)}));
  const sum = (f)=>all.reduce((a,x)=>a+f(x.pi), 0);
  const kpi = el('<div class="kpi-row"></div>');
  kpi.appendChild(el('<div class="kpi"><div class="num" style="font-size:18px;">'+fmtDA(sum(p=>p.total))+'</div><div class="label">Total des commandes</div></div>'));
  kpi.appendChild(el('<div class="kpi" style="background:var(--green);"><div class="num" style="font-size:18px;">'+fmtDA(sum(p=>p.paye))+'</div><div class="label">Déjà encaissé</div></div>'));
  const reste = sum(p=>p.reste);
  kpi.appendChild(el('<div class="kpi'+(reste>0?' alert':'')+'"><div class="num" style="font-size:18px;">'+fmtDA(reste)+'</div><div class="label">Reste à encaisser</div></div>'));
  kpi.appendChild(el('<div class="kpi'+(nbNonSoldes()>0?' alert':'')+'"><div class="num">'+nbNonSoldes()+'</div><div class="label">Commandes non soldées</div></div>'));
  wrap.appendChild(kpi);

  const bar = el('<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;"></div>');
  const filters = [['tous','Toutes'],['Non payé','Non payé'],['Partiel','Partiel'],['Payé','Payé'],['À définir','À définir']];
  const box = document.createElement('div');
  function draw(){
    box.innerHTML = '';
    const q = (view.paySearch||'').trim().toLowerCase();
    const order = {'Non payé':0,'Partiel':1,'À définir':2,'Payé':3};
    const rows = all.filter(x=>(view.payFilter==='tous' || x.pi.statut===view.payFilter) &&
      (!q || (x.c.reference||'').toLowerCase().includes(q) || (x.c.client||'').toLowerCase().includes(q)))
      .slice().reverse().sort((a,b)=>order[a.pi.statut]-order[b.pi.statut]);
    if(rows.length===0){ box.appendChild(el('<div class="empty-msg">Aucune commande dans cette liste.</div>')); return; }
    const tw = document.createElement('div'); tw.className = 'table-wrap';
    const t = document.createElement('table'); t.className = 'main';
    const thead = document.createElement('thead'); const hr = document.createElement('tr');
    ['Référence','Client','Total','Payé','Reste','Statut','Dernier versement',''].forEach(h=>{ const th=document.createElement('th'); th.textContent=h; hr.appendChild(th); });
    thead.appendChild(hr); t.appendChild(thead);
    const tb = document.createElement('tbody');
    rows.forEach(({c,pi})=>{
      const tr = document.createElement('tr');
      const td = (html)=>{ const cell=document.createElement('td'); cell.innerHTML=html; tr.appendChild(cell); };
      td('<b>'+esc(c.reference)+'</b>');
      td(esc(c.client));
      td(pi.total>0 ? fmtDA(pi.total) : '—');
      td(fmtDA(pi.paye));
      td(pi.total>0 ? '<b>'+fmtDA(pi.reste)+'</b>' : '—');
      td(payPill(pi.statut));
      td(pi.dernier ? fmtDate(pi.dernier) : '—');
      const act = document.createElement('td');
      const b = document.createElement('button'); b.className='btn small'; b.textContent='Gérer';
      b.onclick = ()=>{ view.payModal = {id:c.id, data:JSON.parse(JSON.stringify(c.paiement||{total:'',versements:[]}))}; render(); };
      act.appendChild(b); tr.appendChild(act);
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); box.appendChild(tw);
  }
  filters.forEach(([key,label])=>{
    const b = el('<button class="btn small'+(view.payFilter===key?' primary':'')+'">'+label+'</button>');
    b.onclick = ()=>{ view.payFilter = key; render(); };
    bar.appendChild(b);
  });
  const sInp = document.createElement('input');
  sInp.placeholder = 'Chercher un client ou une référence';
  sInp.value = view.paySearch || '';
  sInp.style.cssText = 'flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;';
  sInp.oninput = ()=>{ view.paySearch = sInp.value; draw(); };
  bar.appendChild(sInp);
  wrap.appendChild(bar);
  wrap.appendChild(box);
  draw();
  return wrap;
}

function renderPayModal(){
  const c = (DATA.commandes||[]).find(x=>x.id===view.payModal.id);

  const data = view.payModal.data;

    const pi = payInfo({paiement:data});

  } else {

  fr.appendChild(dW); fr.appendChild(mW); m.appendChild(fr);

    data.versements.push({id:'v_'+Date.now(), date:draft.date||todayISO(), montant:amount, note:(draft.note||'').trim()});

  m.appendChild(actions);
  updateSummary();
  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.payModal=null; render(); } };
  return overlay;
}

// ---------- PARCOURS D'UNE COMMANDE (Découpe → Confection → Emballage → Stock) ----------
const JOURNEY_ICONS = {
  decoupe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.2 8 20.5 18M8.2 16 20.5 6"/></svg>',
  confection: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3 3 6.5l2.3 3.7L8 8.8V21h8V8.8l2.7 1.4L21 6.5 15.5 3c-.5 1.4-1.7 2.1-3.5 2.1S9 4.4 8.5 3Z"/></svg>',
  emballage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/><path d="M7.5 5.2 16 9.7"/></svg>',
  stock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6v10H3V10Z"/><path d="M7.5 20v-6.5h9V20M7.5 16.7h9"/></svg>'
};
function journeyState(statut){
  if(statut==='Prête') return {state:'done', text:'Terminée'};
  if(statut==='En cours') return {state:'cours', text:'En cours'};
  if(statut==='Problème') return {state:'prob', text:'Problème'};
  if(statut==='Tissu non disponible') return {state:'prob', text:'Tissu manquant'};
  if(statut==='Annulée') return {state:'wait', text:'Annulée'};
  return {state:'wait', text:'En attente'};
}
function journeySteps(c){
  const steps = [
    Object.assign({key:'decoupe', label:'Découpe'}, journeyState(c.decoupe.statut)),
    Object.assign({key:'confection', label:'Confection'}, journeyState(c.confection.statut)),
    Object.assign({key:'emballage', label:'Emballage'}, journeyState(c.emballage.statut))
  ];
  const e = ecartStock(c);
  let st;
  if(e!==null && e===0) st = {state:'done', text:'Reçue'};
  else if(e!==null) st = {state:'prob', text:'Écart '+(e>0?'+':'')+e};
  else if(c.emballage.statut==='Prête') st = {state:'cours', text:'À réceptionner'};
  else st = {state:'wait', text:'En attente'};
  steps.push(Object.assign({key:'stock', label:'Stock'}, st));
  return steps;
}
function renderJourney(c, stepsOverride){
  const wrap = el('<div class="journey"></div>');
  const steps = stepsOverride || journeySteps(c);
  steps.forEach((st,i)=>{
    const prevDone = i>0 && steps[i-1].state==='done';
    const d = el('<div class="jstep '+st.state+(prevDone?' linedone':'')+'"></div>');
    const circle = el('<div class="jc">'+JOURNEY_ICONS[st.key]+'</div>');
    if(st.state==='done') circle.appendChild(el('<div class="jb">✓</div>'));
    if(st.state==='prob') circle.appendChild(el('<div class="jb">!</div>'));
    d.appendChild(circle);
    d.appendChild(el('<div class="jl">'+st.label+'</div>'));
    d.appendChild(el('<div class="js">'+st.text+'</div>'));
    wrap.appendChild(d);
  });
  return wrap;
}


// ---------- SCANNER UN CODE QR AVEC LA CAMÉRA ----------
let scanStream = null, scanTimer = null, scanBusy = false, scanLastMsg = 0;
function stopScanner(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream = null; }
}
function closeScan(){ stopScanner(); view.scanModal = false; render(); }
function extractCmdId(text){
  text = String(text||'').trim();
  try{ const u = new URL(text); const id = u.searchParams.get('cmd'); if(id) return id; }catch(e){}
  if(/^cmd_\w+$/.test(text)) return text;
  return null;
}
async function handleScanText(text){
  const id = extractCmdId(text);
  if(!id){
    if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Ce code QR n\'est pas une commande'); }
    return false;
  }
  let c = (DATA.commandes||[]).find(x=>x.id===id);
  if(!c){ await loadDataFromSupabase(); c = (DATA.commandes||[]).find(x=>x.id===id); }
  if(!c){
    if(Date.now()-scanLastMsg > 2500){ scanLastMsg = Date.now(); showToast('⚠ Commande introuvable'); }
    return false;
  }
  stopScanner();
  view.scanModal = false;
  view.focusId = c.id;
  view.searchRef = c.reference;
  view.scrollToFiche = true;
  if(view.role==='admin') view.adminOpen = {recherche:true};
  render();
  if(view.role!=='admin' && view.role!=='commercial') window.scrollTo(0,0);
  return true;
}
function loadJsQR(){
  if(window.jsQR) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    sc.onload = resolve;
    sc.onerror = ()=>reject(new Error('jsqr'));
    document.head.appendChild(sc);
  });
}
function qrFromCanvasSource(src, w, h){
  const maxW = 800;
  const k = w>maxW ? maxW/w : 1;
  const cw = Math.round(w*k), ch = Math.round(h*k);
  const cv = qrFromCanvasSource.cv || (qrFromCanvasSource.cv = document.createElement('canvas'));
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(src, 0, 0, cw, ch);
  const img = ctx.getImageData(0, 0, cw, ch);
  const code = window.jsQR(img.data, cw, ch);
  return code ? code.data : null;
}
async function decodeSource(src, w, h){
  if('BarcodeDetector' in window){
    if(!decodeSource.det) decodeSource.det = new BarcodeDetector({formats:['qr_code']});
    const r = await decodeSource.det.detect(src);
    return r.length ? r[0].rawValue : null;
  }
  await loadJsQR();
  if(!w) return null;
  return qrFromCanvasSource(src, w, h);
}
async function startScanner(video, status){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status.textContent = 'Caméra indisponible sur ce navigateur. Utilise « Prendre une photo du QR ».';
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
  }catch(e){
    status.textContent = 'Caméra bloquée. Autorise la caméra pour ce site, ou utilise « Prendre une photo du QR ».';
    return;
  }
  if(!view.scanModal){ stopScanner(); return; }
  video.srcObject = scanStream;
  video.muted = true;
  video.setAttribute('playsinline', '');
  try{ await video.play(); }catch(e){}
  status.textContent = 'Place le code QR devant la caméra…';
  scanTimer = setInterval(async ()=>{
    if(scanBusy || !video.videoWidth) return;
    scanBusy = true;
    try{
      const txt = await decodeSource(video, video.videoWidth, video.videoHeight);
      if(txt) await handleScanText(txt);
    }catch(e){
      if(e && e.message==='jsqr'){
        status.textContent = "Scanner indisponible (pas de connexion). Utilise l'appareil photo du téléphone pour scanner.";
        stopScanner();
      }
    }
    scanBusy = false;
  }, 300);
}
async function scanFromFile(file, status){
  if(!file) return;
  status.textContent = 'Lecture de la photo…';
  try{
    const bmp = await createImageBitmap(file);
    const txt = await decodeSource(bmp, bmp.width, bmp.height);
    if(!txt){ status.textContent = 'Aucun code QR trouvé sur cette photo. Réessaie de plus près.'; return; }
    const ok = await handleScanText(txt);
    if(!ok) status.textContent = 'Ce code QR ne correspond à aucune commande.';
  }catch(e){
    status.textContent = 'Impossible de lire cette photo.';
  }
}
function renderScanModal(){
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal" style="max-width:420px;text-align:center;"></div>');
  m.appendChild(el('<h2>Scanner un code QR</h2>'));
  const video = document.createElement('video');
  video.style.cssText = 'width:100%;max-height:340px;background:#000;border-radius:10px;object-fit:cover;';
  video.setAttribute('playsinline', '');
  m.appendChild(video);

  const fileInp = document.createElement('input');
  fileInp.type = 'file'; fileInp.accept = 'image/*'; fileInp.setAttribute('capture', 'environment');
  fileInp.style.display = 'none';

  actions.appendChild(cl);
  m.appendChild(actions);
  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay) closeScan(); };
  setTimeout(()=>startScanner(video, status), 0);
  return overlay;
}
function scanButton(small){
  const b = el('<button class="btn'+(small?' small':'')+'">Scanner un QR</button>');

// ---------- STATISTIQUES : tableau de bord analytique ----------
const AN_COL = {bar:'#001D51', barHover:'#2B4C8A', track:'#EEF1F6', grid:'#E3DFD9', wait:'#C9D3E0'};
let anTipEl = null;
function anTip(){
  if(!anTipEl){ anTipEl = document.createElement('div'); anTipEl.className = 'an-tip'; document.body.appendChild(anTipEl); }
  return anTipEl;
}
function anHideTip(){ if(anTipEl) anTipEl.style.display = 'none'; }
function anShowTip(x, y, title, value, sub){
  const t = anTip();
  t.textContent = '';
  const v = document.createElement('div'); v.className = 'an-tip-v'; v.textContent = value; t.appendChild(v);
  const a = document.createElement('div'); a.className = 'an-tip-t'; a.textContent = title; t.appendChild(a);
  if(sub){ const b = document.createElement('div'); b.className = 'an-tip-s'; b.textContent = sub; t.appendChild(b); }
  t.style.display = 'block';
  const w = t.offsetWidth, h = t.offsetHeight;
  let left = x + 14, top = y + 14;
  if(left + w > window.innerWidth - 8) left = x - w - 14;
  if(left < 8) left = 8;
  if(top + h > window.innerHeight - 8) top = y - h - 14;
  t.style.left = left + 'px'; t.style.top = top + 'px';
}
function anBind(node, title, value, sub){
  node.tabIndex = 0;
  node.addEventListener('pointermove', e=>anShowTip(e.clientX, e.clientY, title, value, sub));
  node.addEventListener('pointerleave', anHideTip);
  node.addEventListener('focus', ()=>{ const r = node.getBoundingClientRect(); anShowTip(r.left + r.width/2, r.top, title, value, sub); });
  node.addEventListener('blur', anHideTip);
}
function anNum(n){ return Number(n||0).toLocaleString('fr-FR', {maximumFractionDigits:0}); }
function anDA(n){ return anNum(n)+' DA'; }
function anDAshort(n){ n = Number(n)||0; return n>=1000000 ? (n/1000000).toLocaleString('fr-FR',{maximumFractionDigits:2})+' M DA' : n>=10000 ? Math.round(n/1000).toLocaleString('fr-FR')+' k DA' : anNum(n)+' DA'; }
function anDays(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function anMonthLabel(key){
  const m = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const p = key.split('-'); return m[Number(p[1])-1]+' '+p[0].slice(2);
}
function anNiceMax(v){
  if(v<=0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/pow;
  const f = n<=1 ? 1 : n<=2 ? 2 : n<=5 ? 5 : 10;
  return f*pow;
}
function anTickLabel(v){ return v>=1000000 ? (v/1000000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M' : v>=10000 ? (v/1000).toLocaleString('fr-FR',{maximumFractionDigits:1})+' k' : v.toLocaleString('fr-FR',{maximumFractionDigits:1}); }
function anOrders(){
  const all = DATA.commandes || [];
  const p = view.anPeriod || 'tout';
  if(p==='tout') return all;
  const d = new Date(); d.setDate(d.getDate() - Number(p));
  const lim = d.toISOString().slice(0,10);
  return all.filter(c=>(c.dateCommande||'') >= lim);
}
function anCard(title, subtitle){
  const card = document.createElement('div'); card.className = 'an-card';
  const h = document.createElement('div'); h.className = 'an-title'; h.textContent = title; card.appendChild(h);
  if(subtitle){ const s = document.createElement('div'); s.className = 'an-sub'; s.textContent = subtitle; card.appendChild(s); }
  return card;
}
function anTable(headers, rows){
  const det = document.createElement('details'); det.className = 'an-det';
  const sm = document.createElement('summary'); sm.textContent = 'Voir les chiffres'; det.appendChild(sm);
  const tw = document.createElement('div'); tw.className = 'table-wrap';

  const hr = document.createElement('tr');
  headers.forEach(h=>{ const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
  const th = document.createElement('thead'); th.appendChild(hr); t.appendChild(th);
  const tb = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    r.forEach(v=>{ const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t); det.appendChild(tw);
  return det;
}
function anEmpty(msg){ const d = document.createElement('div'); d.className = 'empty-msg'; d.textContent = msg; return d; }

// Barres horizontales classées : items = [{label, value, tipTitle, tipSub}]
function anBarsH(items, unit){
  const wrap = document.createElement('div');
  if(!items.length){ wrap.appendChild(anEmpty('Pas encore de données.')); return wrap; }
  const max = Math.max.apply(null, items.map(i=>i.value).concat([1]));
  items.forEach(it=>{
    const row = document.createElement('div'); row.className = 'an-row';
    const lab = document.createElement('div'); lab.className = 'an-lab'; lab.textContent = it.label; row.appendChild(lab);
    const area = document.createElement('div'); area.className = 'an-area';
    const bar = document.createElement('div'); bar.className = 'an-hbar';
    bar.style.width = 'calc((100% - 70px) * '+(it.value/max)+')';
    area.appendChild(bar);
    const val = document.createElement('span'); val.className = 'an-val'; val.textContent = anNum(it.value)+(unit?' '+unit:''); area.appendChild(val);
    row.appendChild(area);
    anBind(row, it.tipTitle || it.label, anNum(it.value)+(unit?' '+unit:''), it.tipSub);
    wrap.appendChild(row);
  });
  return wrap;
}

// Colonnes (mois) : items = [{label, value, tipTitle, tipSub}]
function anColumns(items, unit){
  const wrap = document.createElement('div');
  if(!items.length){ wrap.appendChild(anEmpty('Pas encore de données.')); return wrap; }
  let maxV = anNiceMax(Math.max.apply(null, items.map(i=>i.value).concat([1])));
  if(!unit && maxV<=10) maxV = Math.max(2, Math.ceil(Math.max.apply(null, items.map(i=>i.value))/2)*2);
  const H = 150;
  const chart = document.createElement('div'); chart.className = 'an-cols';
  chart.style.height = (H+26)+'px';
  [0, 0.5, 1].forEach(f=>{
    const g = document.createElement('div'); g.className = 'an-grid-line'; g.style.bottom = (26 + f*H)+'px';
    const t = document.createElement('span'); t.textContent = anTickLabel(maxV*f); g.appendChild(t);
    chart.appendChild(g);
  });
  const slots = document.createElement('div'); slots.className = 'an-slots';
  items.forEach(it=>{
    const slot = document.createElement('div'); slot.className = 'an-slot';
    const h = Math.max(it.value>0 ? 3 : 0, Math.round(it.value/maxV*H));
    const colwrap = document.createElement('div'); colwrap.className = 'an-colwrap'; colwrap.style.height = H+'px';
    if(it.value>0){
      const v = document.createElement('div'); v.className = 'an-colval'; v.textContent = anTickLabel(it.value);
      v.style.bottom = (h+3)+'px'; colwrap.appendChild(v);
    }
    const bar = document.createElement('div'); bar.className = 'an-vbar'; bar.style.height = h+'px';
    colwrap.appendChild(bar);
    slot.appendChild(colwrap);
    const lab = document.createElement('div'); lab.className = 'an-collab'; lab.textContent = it.label; slot.appendChild(lab);
    anBind(slot, it.tipTitle || it.label, anNum(it.value)+(unit?' '+unit:''), it.tipSub);
    slots.appendChild(slot);
  });
  chart.appendChild(slots);
  wrap.appendChild(chart);
  return wrap;
}

function anStat(label, value, sub, alert){
  const t = document.createElement('div'); t.className = 'an-stat'+(alert?' alert':'');
  const l = document.createElement('div'); l.className = 'an-stat-l'; l.textContent = label;
  const v = document.createElement('div'); v.className = 'an-stat-v'; v.textContent = value;
  t.appendChild(l); t.appendChild(v);
  if(sub){ const s = document.createElement('div'); s.className = 'an-stat-s'; s.textContent = sub; t.appendChild(s); }

}

function anGroup(orders, keyFn, valFn){
  const m = {};
  orders.forEach(c=>{
    const k = keyFn(c); if(!k) return;
    m[k] = m[k] || {key:k, value:0, n:0, da:0, reste:0};
    m[k].value += valFn(c); m[k].n += 1;
    const pi = payInfo(c); m[k].da += pi.total; m[k].reste += pi.reste;
  });
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>b.value-a.value);
}

function renderAnalyticsPanel(){
  anHideTip();
  const root = document.createElement('div');
  const orders = anOrders();
  const today = todayISO();

  // ---- filtre période : une seule ligne au-dessus, il agit sur tout ----
  const bar = el('<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;"></div>');
  bar.appendChild(el('<span style="font-size:12px;color:var(--text-soft);margin-right:4px;">Période (date de commande) :</span>'));
  [['tout','Tout'],['30','30 jours'],['90','90 jours'],['365','12 mois']].forEach(([k,l])=>{
    const b = el('<button class="btn small'+((view.anPeriod||'tout')===k?' primary':'')+'">'+l+'</button>');
    b.onclick = ()=>{ view.anPeriod = k; render(); };
    bar.appendChild(b);
  });
  root.appendChild(bar);

  if(orders.length===0){
    root.appendChild(anEmpty('Aucune commande sur cette période.'));
    return root;
  }

  // ---- calculs ----
  const steps = orders.map(c=>({c, st:journeySteps(c)}));
  const received = orders.filter(c=>ecartStock(c)!==null);
  const active = orders.filter(c=>ecartStock(c)===null && !(c.decoupe.statut==='Annulée'));
  const late = active.filter(c=>c.dateLivraisonPrevue && c.dateLivraisonPrevue < today);
  const pieces = orders.reduce((a,c)=>a+(Number(c.quantite)||0), 0);
  const withDates = received.filter(c=>c.dateLivraisonPrevue && c.stock.dateReception);
  const onTime = withDates.filter(c=>c.stock.dateReception <= c.dateLivraisonPrevue);
  const delays = received.filter(c=>c.dateCommande && c.stock.dateReception).map(c=>anDays(c.dateCommande, c.stock.dateReception)).filter(d=>d>=0);
  const avgDelay = delays.length ? Math.round(delays.reduce((a,b)=>a+b,0)/delays.length) : null;
  const pays = orders.map(payInfo);
  const totDA = pays.reduce((a,p)=>a+p.total,0), payeDA = pays.reduce((a,p)=>a+p.paye,0), resteDA = pays.reduce((a,p)=>a+p.reste,0);

  // ---- tuiles chiffres clés ----
  const stats = el('<div class="an-stats"></div>');
  stats.appendChild(anStat('Commandes', anNum(orders.length), anNum(pieces)+' pièces'));
  stats.appendChild(anStat('En production', anNum(active.length), anNum(received.length)+' reçues en stock'));
  stats.appendChild(anStat('En retard', anNum(late.length), 'livraison prévue dépassée', late.length>0));
  stats.appendChild(anStat('Livrées à temps', withDates.length ? Math.round(onTime.length/withDates.length*100)+' %' : '—', withDates.length ? onTime.length+' sur '+withDates.length : 'pas encore de réception'));
  stats.appendChild(anStat('Délai moyen', avgDelay===null ? '—' : avgDelay+' jours', 'commande → réception stock'));
  stats.appendChild(anStat('Reste à encaisser', anDAshort(resteDA), 'sur '+anDAshort(totDA)+' au total', resteDA>0));
  root.appendChild(stats);

  const grid = el('<div class="an-grid"></div>');

  // ---- 1. Pipeline de production ----
  const pc = anCard('Où en sont les commandes', 'Nombre de commandes par étape et par état');
  const stages = [['decoupe','Découpe'],['confection','Confection'],['emballage','Emballage'],['stock','Stock']];
  const stateDef = [['done','Terminée','var(--green)'],['cours','En cours','var(--orange)'],['prob','Problème','var(--red)'],['wait','En attente',AN_COL.wait]];
  const pRows = [];
  stages.forEach(([key,label],idx)=>{
    const counts = {done:0,cours:0,prob:0,wait:0};
    steps.forEach(s=>{ counts[s.st[idx].state]++; });
    const row = document.createElement('div'); row.className = 'an-pipe';
    const lab = document.createElement('div'); lab.className = 'an-pipe-l';
    const ic = document.createElement('span'); ic.className = 'an-pipe-ic'; ic.innerHTML = JOURNEY_ICONS[key]; lab.appendChild(ic);
    lab.appendChild(document.createTextNode(label)); row.appendChild(lab);
    const seg = document.createElement('div'); seg.className = 'an-seg';
    stateDef.forEach(([sk,sl,col])=>{
      if(!counts[sk]) return;
      const part = document.createElement('div'); part.className = 'an-seg-p';
      part.style.flex = counts[sk]+' 0 0'; part.style.background = col;
      anBind(part, label+' · '+sl, counts[sk]+' commande'+(counts[sk]>1?'s':''), Math.round(counts[sk]/orders.length*100)+' % des commandes');
      seg.appendChild(part);
    });
    row.appendChild(seg);
    const fig = document.createElement('div'); fig.className = 'an-pipe-f';
    fig.textContent = stateDef.filter(d=>counts[d[0]]).map(d=>counts[d[0]]+' '+d[1].toLowerCase()).join(' · ');
    row.appendChild(fig);
    pc.appendChild(row);
    pRows.push([label, counts.done, counts.cours, counts.prob, counts.wait]);
  });
  const leg = document.createElement('div'); leg.className = 'an-legend';
  stateDef.forEach(([sk,sl,col])=>{
    const i = document.createElement('span'); i.className = 'an-leg-i';
    const sw = document.createElement('span'); sw.className = 'an-sw'; sw.style.background = col; i.appendChild(sw);
    i.appendChild(document.createTextNode(sl)); leg.appendChild(i);
  });
  pc.appendChild(leg);
  pc.appendChild(anTable(['Étape','Terminée','En cours','Problème','En attente'], pRows));
  grid.appendChild(pc);

  // ---- 2. Commandes par mois ----
  const byMonth = {};
  orders.forEach(c=>{ const k = (c.dateCommande||'').slice(0,7); if(!k) return; byMonth[k] = byMonth[k] || {n:0,p:0}; byMonth[k].n++; byMonth[k].p += Number(c.quantite)||0; });
  let mKeys = Object.keys(byMonth).sort();
  if(mKeys.length){
    const full = []; let [y,m] = mKeys[0].split('-').map(Number); const [ey,em] = mKeys[mKeys.length-1].split('-').map(Number);
    while((y<ey || (y===ey && m<=em)) && full.length<24){ full.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){ m=1; y++; } }
    mKeys = full.slice(-12);
  }
  const mc = anCard('Commandes par mois', 'Nombre de commandes lancées');
  mc.appendChild(anColumns(mKeys.map(k=>({label:anMonthLabel(k), value:(byMonth[k]||{n:0}).n, tipTitle:anMonthLabel(k), tipSub:anNum((byMonth[k]||{p:0}).p)+' pièces'})), ''));
  mc.appendChild(anTable(['Mois','Commandes','Pièces'], mKeys.map(k=>[anMonthLabel(k), (byMonth[k]||{n:0}).n, (byMonth[k]||{p:0}).p])));
  grid.appendChild(mc);

  // ---- 3. Meilleurs clients ----
  const clients = anGroup(orders, c=>(c.client||'').trim(), c=>Number(c.quantite)||0);
  const cc = anCard('Meilleurs clients', 'Pièces commandées (8 premiers)');
  cc.appendChild(anBarsH(clients.slice(0,8).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')+(x.da>0?' · '+anDA(x.da):'')+(x.reste>0?' · reste '+anDA(x.reste):'')})), 'pcs'));
  cc.appendChild(anTable(['Client','Commandes','Pièces','Montant','Reste à payer'], clients.map(x=>[x.key, x.n, x.value, anDA(x.da), anDA(x.reste)])));
  grid.appendChild(cc);

  // ---- 4. Articles ----
  const arts = anGroup(orders, c=>(c.article||'').trim(), c=>Number(c.quantite)||0);
  const ac = anCard('Articles les plus commandés', 'Pièces commandées (8 premiers)');
  ac.appendChild(anBarsH(arts.slice(0,8).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'pcs'));
  ac.appendChild(anTable(['Article','Commandes','Pièces'], arts.map(x=>[x.key, x.n, x.value])));
  grid.appendChild(ac);

  // ---- 5. Tissus, couleurs et tailles ----
  const tissus = anGroup(orders, c=>(c.tissu||'').trim(), c=>Number(c.quantite)||0);
  const couleurs = anGroup(orders, c=>c.tissu && c.couleur ? c.tissu+' · '+c.couleur : '', c=>Number(c.quantite)||0);
  const tailleMap = {};
  orders.forEach(c=>{ Object.keys(c.tailles||{}).forEach(sz=>{ const q = Number(c.tailles[sz])||0; if(q) tailleMap[sz] = (tailleMap[sz]||0)+q; }); });
  const tailles = Object.keys(tailleMap).map(k=>({key:k, value:tailleMap[k]})).sort((a,b)=>b.value-a.value);
  const tc = anCard('Tissus, couleurs et tailles', 'Pièces commandées');
  tc.appendChild(el('<div class="an-mini">Tissus</div>'));
  tc.appendChild(anBarsH(tissus.slice(0,5).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'pcs'));
  tc.appendChild(el('<div class="an-mini">Couleurs</div>'));
  tc.appendChild(anBarsH(couleurs.slice(0,5).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'pcs'));
  tc.appendChild(el('<div class="an-mini">Tailles</div>'));
  tc.appendChild(anBarsH(tailles.slice(0,6).map(x=>({label:x.key, value:x.value})), 'pcs'));
  tc.appendChild(anTable(['Type','Nom','Pièces'], tissus.map(x=>['Tissu',x.key,x.value]).concat(couleurs.map(x=>['Couleur',x.key,x.value])).concat(tailles.map(x=>['Taille',x.key,x.value]))));
  grid.appendChild(tc);

  // ---- 6. Paiements ----
  const pyc = anCard('Paiements', 'Montant total des commandes et part encaissée');
  if(totDA>0){
    const tall = document.createElement('div'); tall.className = 'an-tall';
    [['Encaissé',payeDA,'var(--green)','#fff'],['Reste à encaisser',resteDA,AN_COL.wait,'#001D51']].forEach(([n,v,col,tc2])=>{
      if(v<=0) return;
      const part = document.createElement('div'); part.className = 'an-tall-p'; part.style.flex = v+' 0 0'; part.style.background = col; part.style.color = tc2;
      if(v/(payeDA+resteDA) > 0.2) part.textContent = Math.round(v/(payeDA+resteDA)*100)+' %';
      anBind(part, n, anDA(v), Math.round(v/(payeDA+resteDA)*100)+' % du total');
      tall.appendChild(part);
    });
    pyc.appendChild(tall);
    const lg = document.createElement('div'); lg.className = 'an-legend';
    [['Encaissé','var(--green)'],['Reste à encaisser',AN_COL.wait]].forEach(([n,col])=>{
      const i = document.createElement('span'); i.className = 'an-leg-i';
      const sw = document.createElement('span'); sw.className = 'an-sw'; sw.style.background = col; i.appendChild(sw); i.appendChild(document.createTextNode(n)); lg.appendChild(i);
    });
    pyc.appendChild(lg);
    const owing = anGroup(orders, c=>(c.client||'').trim(), c=>payInfo(c).reste).filter(x=>x.value>0);
    pyc.appendChild(el('<div class="an-mini">Clients qui doivent encore payer</div>'));
    pyc.appendChild(anBarsH(owing.slice(0,6).map(x=>({label:x.key, value:x.value, tipSub:x.n+' commande'+(x.n>1?'s':'')})), 'DA'));
    const st = {'Non payé':0,'Partiel':0,'Payé':0,'À définir':0}; pays.forEach(p=>{ st[p.statut]++; });
    pyc.appendChild(anTable(['Statut','Commandes'], Object.keys(st).map(k=>[k, st[k]]).concat([['Total (DA)', totDA],['Encaissé (DA)', payeDA],['Reste (DA)', resteDA]])));
  } else {
    pyc.appendChild(anEmpty('Aucun montant saisi. Ouvre l\'onglet Paiements pour entrer le total de tes commandes.'));
  }
  grid.appendChild(pyc);

  // ---- 7. Encaissements par mois ----
  const cash = {};
  orders.forEach(c=>{ (c.paiement && c.paiement.versements || []).forEach(v=>{ const k = (v.date||'').slice(0,7); if(!k) return; cash[k] = (cash[k]||0)+(Number(v.montant)||0); }); });
  const cKeys = Object.keys(cash).sort().slice(-12);
  const cashCard = anCard('Encaissements par mois', 'Montant reçu (DA)');
  if(cKeys.length){
    cashCard.appendChild(anColumns(cKeys.map(k=>({label:anMonthLabel(k), value:cash[k], tipTitle:anMonthLabel(k)})), 'DA'));
    cashCard.appendChild(anTable(['Mois','Encaissé (DA)'], cKeys.map(k=>[anMonthLabel(k), cash[k]])));
  } else cashCard.appendChild(anEmpty('Aucun versement enregistré pour le moment.'));
  grid.appendChild(cashCard);

  // ---- 8. Retards ----
  const lc = anCard('Commandes en retard', 'Livraison prévue dépassée et pas encore reçue en stock');
  if(late.length){
    const rows = late.map(c=>{
      const cur = journeySteps(c).find(s=>s.state!=='done');
      return {c, days:anDays(c.dateLivraisonPrevue, today), step: cur ? cur.label+' ('+cur.text.toLowerCase()+')' : '—'};
    }).sort((a,b)=>b.days-a.days);
    const tw = document.createElement('div'); tw.className = 'table-wrap';
    const t = document.createElement('table'); t.className = 'main';
    const hr = document.createElement('tr'); ['Référence','Client','Prévue le','Retard','Bloquée à'].forEach(h=>{ const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    const thd = document.createElement('thead'); thd.appendChild(hr); t.appendChild(thd);
    const tb = document.createElement('tbody');
    rows.slice(0,10).forEach(r=>{
      const tr = document.createElement('tr');
      [r.c.reference, r.c.client, fmtDate(r.c.dateLivraisonPrevue), r.days+' j', r.step].forEach((v,i)=>{ const td = document.createElement('td'); td.textContent = v; if(i===3){ td.style.color = 'var(--red)'; td.style.fontWeight = 'bold'; } tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); lc.appendChild(tw);
  } else lc.appendChild(anEmpty('Aucune commande en retard.'));
  grid.appendChild(lc);

  // ---- 9. Écarts de stock ----
  const ecs = received.filter(c=>ecartStock(c)!==0);
  const ec = anCard('Écarts de stock', 'Pièces reçues différentes de la commande');
  if(ecs.length){
    const tw = document.createElement('div'); tw.className = 'table-wrap';
    const t = document.createElement('table'); t.className = 'main';
    const hr = document.createElement('tr'); ['Référence','Commandé','Reçu','Écart','Géré'].forEach(h=>{ const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    const thd = document.createElement('thead'); thd.appendChild(hr); t.appendChild(thd);
    const tb = document.createElement('tbody');
    ecs.forEach(c=>{
      const e = ecartStock(c); const tr = document.createElement('tr');
      [c.reference, c.quantite, c.stock.quantiteRecue, (e>0?'+':'')+e, c.ecartGere?'Oui':'Non'].forEach((v,i)=>{ const td = document.createElement('td'); td.textContent = v; if(i===3){ td.style.color = 'var(--red)'; td.style.fontWeight = 'bold'; } tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); tw.appendChild(t); ec.appendChild(tw);
  } else ec.appendChild(anEmpty(received.length ? 'Aucun écart : toutes les réceptions sont conformes.' : 'Aucune réception pour le moment.'));
  grid.appendChild(ec);

  root.appendChild(grid);
  return root;
}
function renderSearchResult(box){
  box.innerHTML='';
  const ref = (view.searchRef||'').trim();
  if(!ref){ box.appendChild(el('<div class="search-msg">Tape une référence ci-dessus.</div>')); return; }
  const matches = DATA.commandes.filter(c=>c.reference.toLowerCase()===ref.toLowerCase());
  if(matches.length===0){ box.appendChild(el('<div class="search-msg">Aucune commande trouvée pour cette référence.</div>')); return; }
  let c = matches[matches.length-1];
  if(view.focusId){ const fc = matches.find(x=>x.id===view.focusId); if(fc) c = fc; }
  box.appendChild(el('<div class="search-msg">'+matches.length+' commande(s) trouvée(s) — détails de la plus récente :</div>'));
  box.appendChild(renderFiche(c));
  if(view.scrollToFiche){ view.scrollToFiche = false; setTimeout(()=>{ try{ box.scrollIntoView({behavior:'smooth', block:'start'}); }catch(e){} }, 80); }
}

function renderTable(onlyMine){
  // Table-structural elements (thead/tr/td) cannot be created via the el()
  // innerHTML-on-a-<div> trick — the HTML parser drops them outside a real
  // <table> context. Build them with createElement instead.
  const wrap = document.createElement('div'); wrap.className = 'table-wrap';
  const t = document.createElement('table'); t.className = 'main';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  ['Référence','Article','Client','Responsable','Qté','Découpe','Confection','Emballage','Livraison prévue',''].forEach(h=>{
    const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  t.appendChild(thead);
  const tbody = document.createElement('tbody');
  DATA.commandes.slice().reverse().filter(c=>!onlyMine || c.commercialId===view.personId).forEach(c=>{
    const tr = document.createElement('tr');
    function td(html){ const cell=document.createElement('td'); cell.innerHTML=html; tr.appendChild(cell); }
    td('<b>'+c.reference+'</b>'+(Number(c.priorite)>0?' <span class="prio-tag">P'+Number(c.priorite)+'</span>':'')+(c.urgent?' <span class="pill probleme">URG</span>':''));
    td(c.article);
    td(esc(c.client));
    { const cm = commercialOf(c); td(cm?esc(cm.name):'<span style="color:var(--red);">—</span>'); }
    td(String(c.quantite));
    td(pill(c.decoupe.statut));
    td(pill(c.confection.statut));
    td(pill(c.emballage.statut));
    td(c.dateLivraisonPrevue?fmtDate(c.dateLivraisonPrevue):'—');
    const editTd = document.createElement('td');
    const b = document.createElement('button'); b.className='btn small'; b.textContent='Modifier';
    b.onclick = ()=>{ view.modal = {mode:'edit', data:JSON.parse(JSON.stringify(c))}; render(); };
    editTd.appendChild(b);
    const qb = document.createElement('button'); qb.className='btn small'; qb.textContent='QR'; qb.style.marginLeft='6px';
    qb.onclick = ()=>{ view.qrModal = {id:c.id}; render(); };
    editTd.appendChild(qb);
    tr.appendChild(editTd);
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

// Numérotation automatique des références : JB0001, JB0002, ... à l'infini.
// On prend le plus grand numéro JB existant et on ajoute 1 (4 chiffres minimum,
// puis JB10000, JB10001... sans limite). Le champ reste modifiable à la main
// (par exemple pour relancer une référence déjà existante).
function nextReference(){
  let max = 0;
  (DATA.commandes||[]).forEach(c=>{
    const m = /^JB(\d+)$/i.exec(String(c.reference||'').trim());
    if(m){
      const n = parseInt(m[1], 10);
      if(n > max) max = n;
    }
  });
  return 'JB' + String(max + 1).padStart(4, '0');
}

function renderModal(){
  const {mode, data} = view.modal;
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal"></div>');
  m.appendChild(el('<h2>'+(mode==='create'?'Nouvelle commande':'Modifier '+data.reference)+'</h2>'));

  function frow(fields){
    const row = el('<div class="frow"></div>');
    fields.forEach(f=>row.appendChild(f));
    m.appendChild(row);
  }
  function field(labelText, value, onchange, type, optsOverride){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>'+labelText+'</label>'));
    const inp = document.createElement(type==='select'?'select':'input');
    if(type && type!=='select') inp.type=type;
    if(type==='select'){
      const opts = optsOverride || STATUS_OPTIONS;
      if(optsOverride){
        const empty=document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —';
        if(!value) empty.selected=true; inp.appendChild(empty);
      }
      opts.forEach(o=>{
        const opt=document.createElement('option'); opt.value=o; opt.textContent=o;
        if(o===value) opt.selected=true; inp.appendChild(opt);
      });
    } else {
      inp.value = value===null||value===undefined?'':value;
    }
    inp.oninput = ()=>onchange(inp.value);
    wrap.appendChild(inp);
    return wrap;
  }
  // Liste déroulante avec « + Autre… » pour saisir une nouvelle valeur
  function comboField(labelText, value, options, onchange, newLabel){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>'+labelText+'</label>'));
    const sel = document.createElement('select');
    const list = options.filter((x,i,a)=>x && a.indexOf(x)===i);
    if(value && list.indexOf(value)<0) list.push(value);
    list.sort((a,b)=>String(a).localeCompare(String(b),'fr'));
    const empty = document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —'; if(!value) empty.selected=true; sel.appendChild(empty);
    list.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; if(o===value) op.selected=true; sel.appendChild(op); });
    const nw = document.createElement('option'); nw.value='__new__'; nw.textContent='＋ '+newLabel; sel.appendChild(nw);
    const txt = document.createElement('input'); txt.placeholder = newLabel; txt.style.display='none'; txt.style.marginTop='6px';
    sel.onchange = ()=>{
      if(sel.value==='__new__'){ txt.style.display=''; txt.value=''; onchange(''); txt.focus(); }
      else { txt.style.display='none'; onchange(sel.value); }
    };
    txt.oninput = ()=>onchange(txt.value);
    wrap.appendChild(sel); wrap.appendChild(txt);
    return wrap;
  }
  function pickCatalogueByArticle(name){
    const prod = (DATA.catalogue||[]).find(p=>p.article===name);
    if(!prod) return false;
    data.catalogueId = prod.id; data.article = prod.article;
    if(prod.tissu && DATA.lists.tissus[prod.tissu]){
      data.tissu = prod.tissu;
      if(!(DATA.lists.tissus[prod.tissu]||[]).includes(data.couleur)) data.couleur='';
    }
    const allowed = prod.tailles||[];
    Object.keys(data.tailles||{}).forEach(sz=>{ if(allowed.indexOf(sz)===-1) delete data.tailles[sz]; });
    return true;
  }
  function tissuSelectField(){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>Tissu</label>'));
    const inp = document.createElement('select');
    const empty=document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —';
    if(!data.tissu) empty.selected=true; inp.appendChild(empty);
    Object.keys(DATA.lists.tissus||{}).forEach(t=>{
      const opt=document.createElement('option'); opt.value=t; opt.textContent=t;
      if(t===data.tissu) opt.selected=true; inp.appendChild(opt);
    });
    inp.onchange = ()=>{
      data.tissu = inp.value;
      // couleur is scoped to the chosen tissu — clear it if it no longer applies
      if(!inp.value || !((DATA.lists.tissus[inp.value]||[]).includes(data.couleur))) data.couleur='';
      render();
    };
    wrap.appendChild(inp);
    return wrap;
  }
  function couleurSelectField(){
    const wrap = el('<div></div>');
    wrap.appendChild(el('<label>Couleur'+(data.tissu?'':' (choisis un tissu d\'abord)')+'</label>'));
    const inp = document.createElement('select');
    inp.disabled = !data.tissu;
    const colors = (data.tissu && DATA.lists.tissus[data.tissu]) || [];
    const empty=document.createElement('option'); empty.value=''; empty.textContent='— Sélectionner —';
    if(!data.couleur) empty.selected=true; inp.appendChild(empty);
    colors.forEach(c=>{
      const opt=document.createElement('option'); opt.value=c; opt.textContent=c;
      if(c===data.couleur) opt.selected=true; inp.appendChild(opt);
    });
    inp.onchange = ()=>{ data.couleur = inp.value; };
    wrap.appendChild(inp);
    return wrap;
  }

  if((DATA.catalogue||[]).length){
    m.appendChild(el('<div class="grp-head" style="background:#4A6C6F">Produit du catalogue (optionnel)</div>'));
    const catWrap = el('<div style="margin-bottom:10px;"></div>');
    const catSel = document.createElement('select');
    const catEmpty = document.createElement('option'); catEmpty.value=''; catEmpty.textContent='— Commande libre (sans produit du catalogue) —';
    if(!data.catalogueId) catEmpty.selected=true; catSel.appendChild(catEmpty);
    (DATA.catalogue||[]).forEach(p=>{
      const opt = document.createElement('option'); opt.value=p.id; opt.textContent=p.article;
      if(p.id===data.catalogueId) opt.selected=true; catSel.appendChild(opt);
    });
    catSel.onchange = ()=>{
      data.catalogueId = catSel.value;
      const prod = catalogueById(catSel.value);
      if(prod){
        data.article = prod.article;
        if(prod.tissu && DATA.lists.tissus[prod.tissu]){
          data.tissu = prod.tissu;
          if(!(DATA.lists.tissus[prod.tissu]||[]).includes(data.couleur)) data.couleur='';
        }
        // drop any chosen size that isn't offered by this product
        const allowed = prod.tailles||[];
        Object.keys(data.tailles||{}).forEach(sz=>{ if(allowed.indexOf(sz)===-1) delete data.tailles[sz]; });
      }
      render();
    };
    catWrap.appendChild(catSel);
    if(data.catalogueId){
      const prod = catalogueById(data.catalogueId);
      if(prod && prod.photo){
        const img = document.createElement('img');
        img.src = prod.photo;
        img.style.cssText = 'width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);margin-top:8px;display:block;';
        catWrap.appendChild(img);
      }
    }
    m.appendChild(catWrap);
  }

  m.appendChild(el('<div class="grp-head" style="background:#001D51">Identité article / commande</div>'));
  frow([
    field(mode==='create' ? 'Référence (automatique, modifiable)' : 'Référence', data.reference, v=>data.reference=v),
    comboField('Client', data.client, clientNames(), v=>data.client=v, 'Nouveau client…')
  ]);
  // Commercial responsable du suivi de cette commande
  const comWrap = el('<div></div>');
  comWrap.appendChild(el('<label>Commercial responsable (suit la commande)</label>'));
  const comSel = document.createElement('select');
  const comEmpty = document.createElement('option'); comEmpty.value=''; comEmpty.textContent='— Choisir un commercial —';
  comSel.appendChild(comEmpty);
  (DATA.people||[]).filter(p=>p.role==='commercial' && (p.active!==false || p.id===data.commercialId)).forEach(p=>{
    const o = document.createElement('option'); o.value = p.id; o.textContent = p.name;
    if(p.id===data.commercialId) o.selected = true;
    comSel.appendChild(o);
  });
  comSel.onchange = ()=>{ data.commercialId = comSel.value; };
  comWrap.appendChild(comSel);
  const comRow = el('<div class="frow"></div>'); comRow.appendChild(comWrap); m.appendChild(comRow);
  frow([
    (function(){
      const w = comboField('Article', data.article, articleNames(), v=>{ data.article=v; if(v && pickCatalogueByArticle(v)) render(); }, 'Autre article…');
      return w;
    })(),
    tissuSelectField()
  ]);
  frow([
    couleurSelectField()
  ]);
  m.appendChild(el('<label style="display:block;font-size:11px;color:var(--text-soft);margin-bottom:5px;">Répartition par taille (coche + quantité)</label>'));
  const sizeGrid = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:8px;"></div>');
  data.tailles = data.tailles || {};
  const sizeOptions = (data.catalogueId && catalogueById(data.catalogueId)) ? (catalogueById(data.catalogueId).tailles||[]) : (DATA.lists.tailles||[]);
  sizeOptions.forEach(sz=>{
    const cell = el('<div style="border:1px solid var(--border);border-radius:5px;padding:6px;"></div>');
    const lab = el('<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:bold;margin-bottom:4px;"></label>');
    const chk = document.createElement('input'); chk.type='checkbox';
    chk.checked = data.tailles[sz]!==undefined && data.tailles[sz]!=='' && data.tailles[sz]!=null;
    lab.appendChild(chk);
    lab.appendChild(document.createTextNode(sz));
    cell.appendChild(lab);
    const qtyInp = document.createElement('input'); qtyInp.type='number'; qtyInp.min='0';
    qtyInp.value = data.tailles[sz]!==undefined ? data.tailles[sz] : '';
    qtyInp.disabled = !chk.checked;
    qtyInp.oninput = ()=>{ data.tailles[sz] = qtyInp.value===''?'':Number(qtyInp.value); };
    chk.onchange = ()=>{
      qtyInp.disabled = !chk.checked;
      if(!chk.checked){ delete data.tailles[sz]; qtyInp.value=''; }
      else if(qtyInp.value===''){ qtyInp.focus(); }
    };
    cell.appendChild(qtyInp);
    sizeGrid.appendChild(cell);
  });
  m.appendChild(sizeGrid);
  frow([
    field('Quantité (pièces)', data.quantite, v=>data.quantite=v===''?'':Number(v), 'number'),
    field('Date commande', data.dateCommande, v=>data.dateCommande=v, 'date')
  ]);
  frow([
    field('Date de livraison prévue', data.dateLivraisonPrevue, v=>data.dateLivraisonPrevue=v, 'date')
  ]);
  const urgWrap = el('<div style="margin:6px 0 10px;"></div>');
  const urgLabel = el('<label style="display:flex;align-items:center;gap:6px;font-size:13px;"></label>');
  const urgInp = document.createElement('input'); urgInp.type='checkbox'; urgInp.checked=!!data.urgent;
  urgInp.onchange = ()=>data.urgent=urgInp.checked;
  urgLabel.appendChild(urgInp);
  urgLabel.appendChild(document.createTextNode('Commande urgente'));
  urgWrap.appendChild(urgLabel);
  m.appendChild(urgWrap);
  (function(){
    const w = el('<div></div>');
    w.appendChild(el('<label>Priorité (1 = traitée en premier)</label>'));
    const sel = document.createElement('select');
    const used = {};
    DATA.commandes.filter(x=>x.id!==data.id && Number(x.priorite)>0 && x.decoupe.statut!=='Prête' && x.decoupe.statut!=='Annulée').forEach(x=>{ used[Number(x.priorite)] = x.reference; });
    const cur = Number(data.priorite)>0 ? Number(data.priorite) : 0;
    const max = Math.max(10, cur);
    const o0 = document.createElement('option'); o0.value=''; o0.textContent='Normale (sans priorité)'; if(!cur) o0.selected=true; sel.appendChild(o0);
    for(let i=1;i<=max;i++){
      const o = document.createElement('option'); o.value=String(i);
      o.textContent = 'Priorité '+i+(i===1?' — en premier':'')+(used[i]?'  (déjà : '+used[i]+')':'');
      if(i===cur) o.selected=true; sel.appendChild(o);
    }
    sel.onchange = ()=>{ data.priorite = sel.value==='' ? '' : Number(sel.value); };
    w.appendChild(sel);
    const row = el('<div class="frow"></div>'); row.appendChild(w); m.appendChild(row);
  })();

  m.appendChild(el('<div class="grp-head" style="background:#6B4226">Découpe</div>'));
  frow([
    field('Statut', data.decoupe.statut, v=>data.decoupe.statut=v, 'select'),
    field('Prévue le', data.decoupe.prevueLe, v=>data.decoupe.prevueLe=v, 'date')
  ]);
  frow([ field('Faite le', data.decoupe.faiteLe, v=>data.decoupe.faiteLe=v, 'date') ]);

  m.appendChild(el('<div class="grp-head" style="background:#A8492E">Confection</div>'));
  frow([
    field('Statut', data.confection.statut, v=>data.confection.statut=v, 'select'),
    field('Atelier / Chaîne', data.confection.atelier, v=>data.confection.atelier=v)
  ]);
  frow([
    field('Début', data.confection.debut, v=>data.confection.debut=v, 'date'),
    field('Fin', data.confection.fin, v=>data.confection.fin=v, 'date')
  ]);

  m.appendChild(el('<div class="grp-head" style="background:#8A6D3B">Emballage</div>'));
  frow([
    field('Statut', data.emballage.statut, v=>data.emballage.statut=v, 'select'),
    field('Début', data.emballage.debut, v=>data.emballage.debut=v, 'date')
  ]);
  frow([ field('Fin', data.emballage.fin, v=>data.emballage.fin=v, 'date') ]);

  if(mode==='edit'){
    m.appendChild(el('<div class="grp-head" style="background:#4A6C6F">Tissu / Matière (rempli par la Découpe)</div>'));
    data.tissuInfo = data.tissuInfo || {};
    const mb = matiereBlock(data.tissuInfo, data.quantite, v=>{ Object.assign(data.tissuInfo, v); data.tissuInfo.consoGlobale = consoGlobale(data.tissuInfo, data.quantite).total; });
    m.appendChild(mb.node);
  }

  m.appendChild(el('<div class="grp-head" style="background:#666666">Notes</div>'));
  const notesWrap = el('<div style="margin-bottom:8px;"></div>');
  const notesArea = document.createElement('textarea'); notesArea.rows=2; notesArea.value=data.notes||'';
  notesArea.oninput = ()=>data.notes=notesArea.value;
  notesWrap.appendChild(notesArea);
  m.appendChild(notesWrap);

  if(canManagePay()){
    data.paiement = data.paiement || {total:'', versements:[]};
    m.appendChild(el('<div class="grp-head" style="background:#1E7A34">Paiement</div>'));
    frow([ field('Montant total de la commande (DA)', data.paiement.total, v=>data.paiement.total=v===''?'':Number(v), 'number') ]);
  }
  m.appendChild(el('<div class="grp-head" style="background:#3E5C76">Stock</div>'));
  frow([
    field('Quantité reçue', data.stock.quantiteRecue, v=>data.stock.quantiteRecue=v===''?'':Number(v), 'number'),
    field('Date réception', data.stock.dateReception, v=>data.stock.dateReception=v, 'date')
  ]);

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>');
  cancel.onclick = ()=>{ view.modal=null; render(); };
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    if(!data.reference || !data.reference.trim()){ alert('La référence est obligatoire.'); return; }
    if(mode==='create' && !data.commercialId){ alert('Choisis le commercial responsable de cette commande.'); return; }
    data.client = String(data.client||'').trim(); data.article = String(data.article||'').trim();
    rememberNames(data);
    if(mode==='create'){
      DATA.commandes.push(data);
      view.modal=null;
      saveState('Nouvelle commande ajoutée : '+data.reference);
    } else {
      const idx = DATA.commandes.findIndex(x=>x.id===data.id);
      if(idx>=0) DATA.commandes[idx]=data;
      view.modal=null;
      saveState('Commande modifiée : '+data.reference);
    }
  };
  const del = mode==='edit' ? el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>') : null;
  if(del){
    del.onclick = ()=>{
      if(confirm('Supprimer définitivement la commande '+data.reference+' ?')){
        DATA.commandes = DATA.commandes.filter(x=>x.id!==data.id);
        view.modal=null;
        saveState('Commande supprimée : '+data.reference);
      }
    };
  }
  if(del) actions.appendChild(del);
  actions.appendChild(cancel);
  actions.appendChild(save);
  m.appendChild(actions);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.modal=null; render(); } };
  return overlay;
}

// ---------- PERSISTENCE ----------
function showToast(msg){
  const t = el('<div class="toast">'+msg+'</div>');
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

// Lecture : la clé publishable s'envoie uniquement dans l'en-tête apikey.
// Pas d'en-tête Authorization : la clé sb_publishable_ n'est pas un JWT.
async function loadDataFromSupabase(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main`, {
      headers: { 'apikey': SUPABASE_KEY }
    });
    if(!res.ok){
      console.log('Chargement Supabase échoué:', res.status, await res.text());
      return;
    }
    const rows = await res.json();
    if(rows && rows.length && rows[0].data){
      // on garde les valeurs par défaut pour toute clé absente de la base
      DATA = Object.assign({}, DATA, rows[0].data);
    }
  } catch(e){
    console.log('Supabase non disponible:', e.message);
  }
}

async function saveToSupabase(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ data: DATA })
    });
    if(!res.ok){
      console.log('Enregistrement Supabase échoué:', res.status, await res.text());
      return false;
    }
    return true;
  } catch(e){
    console.log('Erreur Supabase:', e.message);
    return false;
  }
}

async function saveState(toastMsg){
  render();
  const ok = await saveToSupabase();
  if(!ok){
    showToast("⚠ Échec de l'enregistrement, vérifiez la connexion");
    return;
  }
  if(toastMsg) showToast('✓ '+toastMsg);
}

// Session : on garde la personne connectée même si on actualise la page.
function saveSession(id){
  try { localStorage.setItem('dj_session', id); } catch(e){}
}
function clearSession(){
  try { localStorage.removeItem('dj_session'); } catch(e){}
}
function restoreSession(){
  let id = null;
  try { id = localStorage.getItem('dj_session'); } catch(e){}
  if(!id) return;
  const person = (DATA.people||[]).find(p=>p.id===id && p.active!==false);
  if(!person){ clearSession(); return; }
  view.personId = person.id;
  view.role = person.role;
  view.screen = person.role==='admin' ? 'admin' : (person.role==='commercial' ? 'commercial' : 'dept');
}

async function boot(){
  try{ view.scanId = new URLSearchParams(location.search).get('cmd'); }catch(e){}
  await loadDataFromSupabase();
  restoreSession();
  if(!view.personId && view.scanId){
    // visiteur sans compte (client) : le QR ouvre le suivi de la commande
    const c = (DATA.commandes||[]).find(x=>x.id===view.scanId);
    if(c){ view.trackId = c.id; view.trackRef = c.reference; view.trackSearched = true; }
  }
  applyScan();
  render();
  // Discussion en direct : on récupère les nouveaux messages toutes les 4 secondes
  setInterval(pollMessages, 4000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollMessages(); });
}

boot();
</script>
