<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Production DJ</title>
<style>
:root{
  --charcoal:#001D51; --brown:#6B4226; --terracotta:#DBC4A0; --amber:#8A6D3B;
  --teal:#4A6C6F; --gray:#666666; --steel:#3E5C76;
  --green:#1E7A34; --orange:#B5651D; --red:#A42834;
  --amber-bg:#FFF3CD; --green-bg:#D4EDDA; --orange-bg:#FCE8D6; --red-bg:#F8D7DA; --gray-bg:#E2E2E2;
  --bg:#F8F4EC; --card:#FFFFFF; --border:#E3DFD9; --text:#1C1815; --text-soft:#6B6560;
  color-scheme: light;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;}
.app{min-height:100%;display:flex;flex-direction:column;}
.topbar{background:var(--charcoal);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;}
.topbar img{height:34px;width:auto;display:block;}
.topbar .title{font-size:15px;font-weight:bold;letter-spacing:.3px;}
.topbar .spacer{flex:1;}
.topbar button.link{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
.topbar button.link:hover{background:rgba(255,255,255,.12);}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px;width:100%;}
.center-wrap{max-width:420px;margin:60px auto;padding:0 18px;text-align:center;}
.center-wrap img{width:200px;height:auto;margin-bottom:18px;}
.center-wrap h1{font-size:19px;margin:0 0 6px;}
.center-wrap p.sub{color:var(--text-soft);font-size:13px;margin:0 0 28px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.role-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 10px;font-size:14px;font-weight:bold;color:var(--charcoal);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.role-btn:hover{border-color:var(--terracotta);}
.role-btn.admin{grid-column:1/3;background:var(--charcoal);color:#fff;}
.pin-pad{margin-top:22px;}
.pin-display{font-size:28px;letter-spacing:10px;font-weight:bold;min-height:38px;margin-bottom:16px;color:var(--charcoal);}
.pin-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.pin-keys button{padding:16px 0;font-size:18px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;}
.pin-keys button:hover{border-color:var(--terracotta);}
.pin-keys button.wide{grid-column:span 1;color:var(--text-soft);font-size:13px;}
.pin-error{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}
.back-link{background:none;border:none;color:var(--text-soft);font-size:13px;cursor:pointer;margin-top:22px;text-decoration:underline;}
.login-form{margin-top:18px;text-align:left;}
.login-field{margin-bottom:14px;}
.login-field label{display:block;font-size:12px;color:var(--text-soft);margin-bottom:4px;}
.login-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:Arial,sans-serif;}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:bold;border-radius:10px;padding:1px 8px;margin-left:8px;vertical-align:middle;}
.pill.nouveau{background:var(--steel);color:#fff;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin-bottom:22px;}
.kpi{min-width:0;}
.kpi .num{overflow-wrap:anywhere;}
.kpi{background:var(--charcoal);color:#fff;border-radius:10px;padding:14px;text-align:center;}
.kpi .num{font-size:26px;font-weight:bold;}
.kpi .label{font-size:11px;opacity:.85;margin-top:2px;}
.kpi.alert{background:var(--red);}

.icon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:6px;}
.icon-tile{position:relative;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;font-family:Arial,sans-serif;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.icon-tile:hover{border-color:var(--terracotta);}
.icon-tile.active{background:var(--terracotta);border-color:var(--terracotta);}
.icon-tile.active .icon-tile-lbl{color:#001D51;}
.icon-tile.active .icon-tile-ic{color:#001D51;}
.icon-tile-ic{color:var(--charcoal);margin-bottom:8px;display:flex;align-items:center;justify-content:center;}
.icon-tile-ic svg{width:28px;height:28px;}
.icon-tile-lbl{font-size:12px;font-weight:bold;color:var(--charcoal);}
.icon-tile-badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:11px;font-weight:bold;border-radius:10px;padding:1px 7px;}
.icon-tile.active .icon-tile-badge{background:#001D51;color:#fff;}
.admin-panel{}

.section-title{background:var(--terracotta);color:#001D51;font-weight:bold;font-size:13px;padding:9px 14px;border-radius:8px 8px 0 0;margin-top:26px;}
.section-body{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:14px;}

.search-row{display:flex;gap:8px;margin-bottom:4px;}
.search-row input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#FFF3CD;font-weight:bold;}
.search-msg{font-size:12px;color:var(--text-soft);font-style:italic;margin:8px 0;}

.fiche{margin-top:10px;}
.fiche .hero{background:var(--green-bg);border:2px solid var(--green);border-radius:8px;padding:10px 14px;text-align:center;margin-bottom:14px;}
.fiche .hero .lbl{font-size:11px;font-weight:bold;color:var(--green);text-transform:uppercase;}
.fiche .hero .val{font-size:20px;font-weight:bold;color:var(--green);margin-top:2px;}
.grp{margin-bottom:10px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.grp .grp-head{color:#fff;font-size:12px;font-weight:bold;padding:6px 10px;}
.grp .row{display:flex;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--border);font-size:13px;}
.grp .row:first-of-type{border-top:none;}
.grp .row .k{color:var(--text-soft);}
.grp .row .v{font-weight:bold;text-align:right;}

.table-wrap{overflow-x:auto;}
table.main{width:100%;border-collapse:collapse;font-size:12.5px;}
table.main th{background:var(--charcoal);color:#fff;text-align:left;padding:8px 10px;white-space:nowrap;}
table.main td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.main tr:hover td{background:#FBF9F6;}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;}
.pill.attente{background:var(--amber-bg);color:var(--amber);}
.pill.cours{background:var(--orange-bg);color:var(--orange);}
.pill.prete{background:var(--green-bg);color:var(--green);}
.pill.probleme,.pill.tissu{background:var(--red-bg);color:var(--red);}
.pill.annulee{background:var(--gray-bg);color:var(--gray);}
.btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;font-weight:bold;}
.btn:hover{border-color:var(--terracotta);}
.btn.primary{background:var(--terracotta);border-color:var(--terracotta);color:#001D51;}
.btn.small{padding:4px 9px;font-size:11px;}
.add-row{margin:16px 0;text-align:right;}

.dept-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;}
.dept-card.urgent{border-left:4px solid var(--red);}
.dept-card .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.dept-card .head .ref{font-weight:bold;font-size:15px;}
.dept-card .head .art{font-size:12px;color:var(--text-soft);}
.dept-card .urgent-tag{background:var(--red);color:#fff;font-size:10px;font-weight:bold;padding:2px 7px;border-radius:8px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.field-row label{display:block;font-size:11px;color:var(--text-soft);margin-bottom:3px;}
.field-row select,.field-row input{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:Arial,sans-serif;}
.dept-card .save-row{text-align:right;margin-top:6px;}
.empty-msg{color:var(--text-soft);font-size:13px;padding:16px 0;text-align:center;}
.collapse-toggle{background:none;border:none;color:var(--steel);font-size:12px;cursor:pointer;text-decoration:underline;margin:14px 0 6px;padding:0;}
.done-list{font-size:12px;color:var(--text-soft);}
.done-list .item{padding:5px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:20px;margin-bottom:40px;}
.modal h2{margin:0 0 14px;font-size:16px;}
.modal .grp-head{color:#fff;font-size:12px;font-weight:bold;padding:6px 10px;border-radius:5px;margin:14px 0 8px;}
.modal .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.modal label{display:block;font-size:11px;color:var(--text-soft);margin-bottom:3px;}
.modal input,.modal select,.modal textarea{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:Arial,sans-serif;}
.modal .actions{text-align:right;margin-top:16px;display:flex;justify-content:flex-end;gap:8px;}
.dept-det{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin:8px 0 10px;}
.dept-det .k{color:var(--text-soft);font-size:11px;}
.dept-det .v{font-size:13px;font-weight:bold;color:var(--text);}
.dept-det .full{grid-column:1/-1;}
.dept-det .sz{display:inline-block;background:#fff;border:1px solid var(--border);border-radius:6px;padding:2px 7px;margin:3px 4px 0 0;font-size:12px;font-weight:bold;}
.dept-det .note{font-size:12px;font-weight:normal;white-space:pre-wrap;}
.io-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;}
.io-lbl{font-size:11px;font-weight:bold;color:var(--text-soft);margin-right:2px;}
.stars{font-size:17px;letter-spacing:1px;white-space:nowrap;}
.stars .on{color:#E0A100;} .stars .off{color:#D5CFC6;}
.stars-in{display:flex;gap:4px;}
.stars-in button{border:none;background:none;font-size:30px;line-height:1;color:#D5CFC6;cursor:pointer;padding:0 2px;}
.stars-in button.on{color:#E0A100;}
.eval-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.eval-lbl{font-size:13px;font-weight:bold;}
.team-avg{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 12px;}
.team-avg span{color:var(--text-soft);}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.team-card{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff;}
.team-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px;}
.team-name{font-weight:bold;font-size:14px;}
.team-role{font-size:12px;color:var(--text-soft);}
.team-score{text-align:right;}
.team-num{font-size:11px;color:var(--text-soft);}
.team-none{font-size:12px;color:var(--text-soft);}
.team-perf{background:var(--bg);border-radius:8px;padding:6px 10px;margin-bottom:8px;}
.team-perf div{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;}
.team-perf span{color:var(--text-soft);}
.ev-edit{background:#FFF9E8;border:1px solid #F0DC9A;border-radius:8px;padding:9px 11px;margin:8px 0 14px;}
.ev-edit-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:6px;}
.ev-edit-h span{color:var(--text-soft);}
.ev-edit-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.ev-edit .stars-in button{font-size:26px;}
.ev-items{border:1px solid var(--border);border-radius:8px;max-height:190px;overflow:auto;margin:4px 0 6px;}
.ev-item{display:flex;gap:8px;align-items:baseline;padding:5px 9px;border-top:1px solid var(--border);font-size:12px;}
.ev-item:first-child{border-top:none;}
.ev-why{color:var(--text-soft);}
.ev-ok{font-weight:bold;width:14px;}
.ov-note{color:#1F3A5F;font-style:italic;}
.prio-tag{background:#1F3A5F;color:#fff;font-size:10px;font-weight:bold;padding:2px 7px;border-radius:8px;white-space:nowrap;}
.dept-card.waiting{opacity:.6;}
.stars.big{font-size:30px;}
.my-eval-head{display:flex;align-items:center;gap:12px;margin:2px 0 6px;}
.my-eval-num{font-size:20px;font-weight:bold;}
.my-eval-msg{background:#FFF6DB;border:1px solid #F0DC9A;border-radius:8px;padding:9px 11px;font-size:13px;margin:0 0 10px;}
.team-period{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--text-soft);}
.team-how{margin:0 0 12px;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.team-how summary{cursor:pointer;font-weight:bold;}
.team-how div{margin-top:8px;line-height:1.55;color:var(--text-soft);}
.team-crit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--border);}
.team-crit:first-child{border-top:none;}
.tc-l{display:flex;flex-direction:column;min-width:0;}
.tc-l b{font-size:12px;} .tc-l small{font-size:11px;color:var(--text-soft);}
.tc-r{text-align:right;flex:0 0 auto;}
.tc-r .stars{font-size:14px;}
.tc-pct{font-size:11px;font-weight:bold;}
.team-foot{font-size:11px;color:var(--text-soft);margin-top:8px;}
.team-btns{display:flex;gap:6px;flex-wrap:wrap;}
.team-hist{margin-top:8px;border-top:1px solid var(--border);}
.team-hist-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.team-hist-top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;}
.team-hist-det{color:var(--text-soft);margin-top:2px;}
.team-hist-cm{margin-top:4px;white-space:pre-wrap;}
.bk-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff;}
.bk-title{font-weight:bold;font-size:14px;margin-bottom:4px;}
.bk-text{font-size:12px;color:var(--text-soft);margin-bottom:10px;}
.bk-btns{display:flex;gap:8px;flex-wrap:wrap;}
.bk-prev{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;}
.mat-cmp{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;background:#fff;border:1px solid var(--border);}
.mat-cmp.ok{background:#E3F3E7;border-color:#9AD0A7;color:#1E5E2C;}
.mat-cmp.sur{background:#FBE4E6;border-color:#E39AA1;color:#8C1F2B;}
.mat-cmp.sous{background:#FFF0D6;border-color:#E6C27A;color:#7A4A00;}
.conso-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#FBE4E6;border:1px solid #E39AA1;color:#8C1F2B;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:13px;}
.chat-msg.alertmsg{background:#FBE4E6;border-color:#E39AA1;border-left:4px solid #A42834;}
.mat-res{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;margin:2px 0 10px;}
.mat-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;}
.mat-line span{color:var(--text-soft);}
.mat-line.big{border-top:1px solid var(--border);margin-top:4px;padding-top:7px;font-size:14px;}
.mat-line.big span{color:var(--text);font-weight:bold;}
.mat-line b{white-space:nowrap;}
.mat-line.big b{color:#001D51;font-size:17px;}
.mat-formula{font-size:11px;color:var(--text-soft);margin-top:4px;}
.dept-qr{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0 0 10px;background:#fff;}
.dept-qr-img{flex:0 0 auto;line-height:0;}
.dept-qr-txt{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:12px;}
.dept-qr-txt span{color:var(--text-soft);}
.track-box{margin-top:30px;padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.track-box h2{font-size:16px;margin:0 0 4px;color:#001D51;}
.track-box p{font-size:12px;color:var(--text-soft);margin:0 0 10px;}
.track-card{margin-top:10px;}
.track-msg{margin:-6px 0 10px;padding:9px 12px;border-radius:8px;background:#FFF3CD;font-size:13px;text-align:center;}
.track-msg.ok{background:#E3F3E7;color:#1E7A34;font-weight:bold;}
.track-info{display:grid;gap:6px;}
.track-info div{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--border);}
.track-info span{color:var(--text-soft);}
.journey{display:flex;align-items:flex-start;margin:4px 0 18px;padding:14px 6px 8px;background:#fff;border:1px solid var(--border);border-radius:10px;}
.jstep{flex:1;text-align:center;position:relative;min-width:0;}
.jstep+.jstep::before{content:"";position:absolute;top:31px;left:-50%;width:100%;height:3px;background:#C9D3E0;z-index:0;}
.jstep.linedone::before{background:var(--green);}
.jc{width:62px;height:62px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:#E9EDF3;color:var(--charcoal);border:3px solid #E9EDF3;position:relative;z-index:1;}
.jc svg{width:28px;height:28px;}
.jstep.wait .jc{color:#9AA3B2;}
.jstep.done .jc{border-color:var(--green);}
.jstep.cours .jc{border-color:var(--orange);background:var(--orange-bg);}
.jstep.prob .jc{border-color:var(--red);background:var(--red-bg);}
.jb{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
.jstep.done .jb{background:var(--green);}
.jstep.prob .jb{background:var(--red);}
.jl{font-size:13px;font-weight:bold;margin-top:8px;color:var(--charcoal);}
.js{font-size:11px;margin-top:2px;color:var(--text-soft);}
.jstep.done .js{color:var(--green);font-weight:bold;}
.jstep.cours .js{color:var(--orange);font-weight:bold;}
.jstep.prob .js{color:var(--red);font-weight:bold;}
@media (max-width:520px){.jc{width:46px;height:46px;}.jc svg{width:22px;height:22px;}.jstep+.jstep::before{top:23px;}.jl{font-size:11px;}.js{font-size:10px;}.jb{width:16px;height:16px;font-size:10px;}}
.fiche-bottom{display:flex;gap:12px;flex-wrap:wrap;}
.fiche-box{flex:1;min-width:180px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;}
.fb-lbl{font-size:11px;font-weight:bold;color:var(--text-soft);text-transform:uppercase;letter-spacing:.3px;}
.fb-val{font-size:22px;font-weight:bold;color:var(--green);margin-top:4px;}
@media (max-width:520px){.topbar{flex-wrap:wrap;gap:8px;padding:10px 12px;}.topbar>*{order:1;}.topbar .spacer{order:2;flex:1;}.topbar .title{order:3;flex-basis:100%;}.topbar button.link{padding:6px 9px;font-size:11px;}}
.an-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.an-stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.an-stat.alert{border-color:var(--red);}
.an-stat-l{font-size:12px;color:var(--text-soft);}
.an-stat-v{font-size:24px;font-weight:bold;color:var(--charcoal);margin-top:2px;white-space:nowrap;}
.an-stat.alert .an-stat-v{color:var(--red);}
.an-stat-s{font-size:11px;color:var(--text-soft);margin-top:2px;}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;}
.an-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0;}
.an-title{font-size:15px;font-weight:bold;color:var(--charcoal);}
.an-sub{font-size:12px;color:var(--text-soft);margin:2px 0 12px;}

.an-slots{position:absolute;left:44px;right:0;top:0;bottom:0;display:flex;}
.an-slot{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px;}
.an-slot:hover,.an-slot:focus{background:#F7F5F2;outline:none;}
.an-colwrap{position:relative;}

.an-slot:hover .an-vbar,.an-slot:focus .an-vbar{background:#2B4C8A;}
.an-colval{position:absolute;left:0;right:0;text-align:center;font-size:11px;font-weight:bold;color:var(--text);}
.an-collab{height:26px;font-size:10px;color:var(--text-soft);text-align:center;padding-top:6px;white-space:nowrap;overflow:hidden;}
.an-pipe{display:grid;grid-template-columns:116px 1fr;gap:4px 10px;align-items:center;margin-bottom:12px;}
.an-pipe-l{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:bold;}
.an-pipe-ic svg{width:18px;height:18px;display:block;color:var(--charcoal);}
.an-seg{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:#fff;}
.an-seg-p{min-width:4px;cursor:default;}
.an-seg-p:hover,.an-seg-p:focus{filter:brightness(1.12);outline:none;}
.an-pipe-f{grid-column:2;font-size:11px;color:var(--text-soft);}
.an-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:12px;color:var(--text-soft);}
.an-leg-i{display:inline-flex;align-items:center;gap:6px;}
.an-sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
.an-tall{display:flex;gap:2px;height:28px;}
.an-tall-p{border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:bold;min-width:4px;cursor:default;}
.an-tall-p:hover,.an-tall-p:focus{filter:brightness(1.1);outline:none;}
.an-tip{position:fixed;z-index:200;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:8px 10px;pointer-events:none;display:none;max-width:240px;}
.an-tip-v{font-size:15px;font-weight:bold;color:var(--text);}
.an-tip-t{font-size:12px;color:var(--text-soft);margin-top:1px;}
.an-tip-s{font-size:11px;color:var(--text-soft);margin-top:3px;}
@media (max-width:520px){.an-grid{grid-template-columns:1fr;}.an-lab{flex-basis:104px;}.an-pipe{grid-template-columns:100px 1fr;}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:80;}
.readonly-banner{background:var(--amber-bg);color:var(--amber);font-size:12px;padding:8px 14px;text-align:center;}
.chat-modal{max-width:460px;}
.chat-list{max-height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--bg);}
.chat-msg{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;max-width:88%;}
.chat-msg.mine{margin-left:auto;background:var(--amber-bg);border-color:var(--amber);}
.chat-msg.priv{border-left:3px solid #001D51;}
.chat-meta{font-size:11px;color:var(--text-soft);margin-bottom:3px;}
.chat-text{font-size:13px;white-space:pre-wrap;word-break:break-word;}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;}
.chat-input-row textarea{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:Arial,sans-serif;resize:vertical;}

/* ===================== COUTURE POP ===================== */
:root{--pop-navy:#001D51;--pop-cream:#FFF6E6;--pop-sun:#FFC933;--pop-coral:#FF5A4D;--pop-mint:#37D6A5;--pop-sky:#BFD2FF;--pop-gold:#E9D5B0;
  --bg:#FFF6E6;--border:#CFD6EA;--text:#0E1B3D;--text-soft:#4B5B87;--red:#E0392D;--green:#12805A;--green-bg:#D5F5EA;--red-bg:#FFE0DC;--amber-bg:#FFF1C9;--amber:#6B4D00;--orange-bg:#E1EAFF;--orange:#1F3E96;}
body{background:var(--pop-cream);color:var(--text);}
body::before{content:"";position:fixed;width:460px;height:460px;border-radius:46% 54% 60% 40%;background:var(--pop-gold);right:-120px;top:-130px;opacity:.65;pointer-events:none;z-index:0}
.app{position:relative;z-index:1}
.topbar{background:var(--pop-cream);color:var(--pop-navy);padding:14px 28px;border-bottom:3px solid var(--pop-navy)}
.topbar .title{font-family:'Arial Black',Arial,sans-serif;font-size:16px;letter-spacing:-.01em;color:var(--pop-navy)}
.topbar button.link{background:#fff;border:3px solid var(--pop-navy);color:var(--pop-navy);padding:6px 12px;border-radius:12px;font-weight:800;font-size:12px;box-shadow:3px 3px 0 var(--pop-navy)}
.topbar button.link:hover{background:var(--pop-sun)}
.topbar button.link:active{box-shadow:none;transform:translate(2px,2px)}
.badge{background:var(--pop-coral);color:#fff;border:2px solid var(--pop-navy)}
.wrap{padding-top:26px}
/* chiffres clés */
.kpi{background:#fff;color:var(--pop-navy);border:3px solid var(--pop-navy);border-radius:18px;box-shadow:5px 5px 0 var(--pop-navy);text-align:left;padding:14px 16px}
.kpi-row .kpi:nth-child(6n+1){background:var(--pop-sun)}
.kpi-row .kpi:nth-child(6n+2){background:var(--pop-mint)}
.kpi-row .kpi:nth-child(6n+3){background:var(--pop-sky)}
.kpi-row .kpi:nth-child(6n+4){background:#FFE3A0}
.kpi-row .kpi:nth-child(6n+6){background:var(--pop-sky)}
.kpi .num{font-family:'Arial Black',Arial,sans-serif;font-size:30px;letter-spacing:-.04em}
.kpi .label{font-size:12px;font-weight:800;opacity:1;margin-top:4px}
.kpi.alert,.kpi-row .kpi.alert{background:var(--pop-coral);color:#fff}
/* cases de navigation */
.icon-grid{gap:14px;margin:10px 4px 8px 0}
.icon-tile{background:#fff;border:3px solid var(--pop-navy);border-radius:16px;box-shadow:4px 4px 0 var(--pop-navy);padding:16px 8px}
.icon-tile:hover{border-color:var(--pop-navy);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--pop-navy)}
.icon-tile.active{background:var(--pop-sun);border-color:var(--pop-navy)}
.icon-tile-lbl{font-weight:800;color:var(--pop-navy)}
.icon-tile-badge{background:var(--pop-coral);border:2px solid var(--pop-navy);top:-8px;right:-6px}
.icon-tile.active .icon-tile-badge{background:var(--pop-navy)}
/* sections */
.section-title{background:var(--pop-sun);color:var(--pop-navy);font-family:'Arial Black',Arial,sans-serif;font-size:13px;letter-spacing:-.01em;padding:10px 16px;border:3px solid var(--pop-navy);border-bottom:none;border-radius:16px 16px 0 0;margin-top:30px}
.section-title[style*="background"]{color:#fff}
.section-body{background:#fff;border:3px solid var(--pop-navy);border-top:none;border-radius:0 0 16px 16px;box-shadow:6px 6px 0 var(--pop-navy);padding:16px}
/* tableaux */
table.main th{background:transparent;color:var(--pop-navy);border-bottom:3px solid var(--pop-navy);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
table.main td{border-bottom:2px dashed var(--border)}
table.main tr:hover td{background:var(--pop-cream)}
.pill{border:2px solid var(--pop-navy);font-weight:800;padding:2px 9px}
.pill.attente{background:var(--pop-cream);color:var(--pop-navy)}
.pill.cours{background:var(--pop-sky);color:var(--pop-navy)}
.pill.prete{background:var(--pop-mint);color:var(--pop-navy)}
.pill.probleme,.pill.tissu{background:var(--pop-coral);color:#fff}
.pill.annulee{background:#E6E6E6;color:#555;border-color:#888}
.pill.nouveau{background:var(--pop-sun);color:var(--pop-navy)}
/* boutons */
.btn{border:3px solid var(--pop-navy);border-radius:12px;background:#fff;color:var(--pop-navy);font-weight:800;box-shadow:3px 3px 0 var(--pop-navy);padding:6px 13px}
.btn:hover{background:var(--pop-cream);border-color:var(--pop-navy);transform:translate(-1px,-1px)}
.btn:active{box-shadow:none;transform:translate(2px,2px)}
.btn.primary{background:var(--pop-sun);border-color:var(--pop-navy);color:var(--pop-navy)}
.btn.primary:hover{background:#FFD65A}
.btn.small{padding:3px 10px;border-width:2px;box-shadow:2px 2px 0 var(--pop-navy)}
.collapse-toggle{color:var(--pop-navy);font-weight:800}
/* cartes service */
.dept-card{background:#fff;border:3px solid var(--pop-navy);border-radius:18px;box-shadow:5px 5px 0 var(--pop-navy);padding:16px;margin-bottom:16px}

.dept-card .head .ref{font-family:'Arial Black',Arial,sans-serif;font-size:17px;letter-spacing:-.02em}
.dept-card .urgent-tag{background:var(--pop-coral);border:2px solid var(--pop-navy);padding:1px 8px}
.prio-tag{background:var(--pop-navy);color:var(--pop-sun);border-radius:99px;padding:3px 9px}
.dept-det,.io-bar,.bk-prev,.mat-res{background:var(--pop-cream);border:2px solid var(--pop-navy);border-radius:12px}
.dept-det .sz{border:2px solid var(--pop-navy)}
/* champs */
.field-row select,.field-row input,.modal input,.modal select,.modal textarea,.login-field input,.search-row input,.dept-card textarea{border:2px solid var(--pop-navy);border-radius:10px;background:var(--pop-cream);font-weight:600}
.field-row select:focus,.field-row input:focus,.modal input:focus,.modal select:focus,.modal textarea:focus,.login-field input:focus,.search-row input:focus,.dept-card textarea:focus{outline:3px solid var(--pop-sun);outline-offset:1px}
.search-row input{background:#FFF1C9}
/* fenêtres */
.modal-overlay{background:rgba(0,29,81,.6)}
.modal{border:3px solid var(--pop-navy);border-radius:22px;box-shadow:10px 10px 0 var(--pop-navy);padding:22px}
.modal h2{font-family:'Arial Black',Arial,sans-serif;font-size:18px;letter-spacing:-.02em}
.modal .grp-head{border-radius:8px}
.grp{border:2px solid var(--pop-navy);border-radius:12px}
.an-card,.an-stat,.team-card,.bk-card,.track-box,.journey,.fiche-box{border:3px solid var(--pop-navy);border-radius:16px;box-shadow:4px 4px 0 var(--pop-navy)}
.an-stat.alert{background:var(--pop-coral);border-color:var(--pop-navy)}.an-stat.alert .an-stat-l,.an-stat.alert .an-stat-v,.an-stat.alert .an-stat-s{color:#fff}
.my-eval-msg{background:#FFF1C9;border:2px solid var(--pop-navy);border-radius:12px}
.conso-banner{background:#FFE0DC;border:3px solid var(--pop-navy);border-radius:14px;color:#7A1409}
.ev-edit{background:#FFF1C9;border:2px solid var(--pop-navy)}
.team-how{border:2px solid var(--pop-navy);background:var(--pop-cream)}
.jc{border-color:var(--pop-navy)}
.empty-msg{font-weight:600}
input[type=checkbox]{width:18px!important;height:18px;padding:0!important;border:2px solid var(--pop-navy)!important;border-radius:5px!important;accent-color:var(--pop-navy);flex:none}

.pop-stk{position:absolute;font:900 14px Arial,sans-serif;padding:9px 14px;border-radius:99px;border:3px solid var(--pop-navy);box-shadow:4px 4px 0 var(--pop-navy);color:var(--pop-navy);pointer-events:none}

// Downscales + re-encodes an uploaded photo client-side before it's embedded
// as a data: URI in DATA (this page has no separate file/asset store — every
// image lives inline in the published HTML, so keeping it small matters).
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

function formatTailles(c){
  const t = c.tailles;
  if(!t || typeof t!=='object') return '—';
  const order = (DATA.lists && DATA.lists.tailles) || [];
  const known = order.filter(sz=>t[sz]!==undefined && t[sz]!=='' && t[sz]!=null);
  const extra = Object.keys(t).filter(sz=>order.indexOf(sz)===-1 && t[sz]!==undefined && t[sz]!=='' && t[sz]!=null);
  const parts = known.concat(extra).map(sz=>t[sz]+sz);
  return parts.length ? parts.join('/') : '—';
}

  const parts = d.split('-');
  if(parts.length!==3) return d;
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}

function statutReception(c){

function moyennePoidsPiece(ref, excludeId){
  const vals = DATA.commandes.filter(c=>c.reference===ref && c.id!==excludeId && c.tissuInfo.poidsPiece!=='' && c.tissuInfo.poidsPiece!=null).map(c=>Number(c.tissuInfo.poidsPiece));
  if(vals.length===0) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function ecartPoidsPiece(c){
  const sameRef = DATA.commandes.filter(x=>x.reference===c.reference);
  if(sameRef.length<2) return null;
  if(c.tissuInfo.poidsPiece===''||c.tissuInfo.poidsPiece==null) return null;
  const avg = moyennePoidsPiece(c.reference, null);
  if(avg===null||avg===0) return null;
  return (Number(c.tissuInfo.poidsPiece)-avg)/avg;
}

function commercialOf(c){

function publicSteps(c){
  return journeySteps(c).map(st=>{
    // côté client : pas de vocabulaire interne (problème, écart de stock)
    if(st.state==='prob') return Object.assign({}, st, {state:'cours', text:'En traitement'});
    return st;
  });
}
function renderTrackResult(box){
  box.innerHTML = '';
  let c = null;
  const ref = (view.trackRef||'').trim();
  if(view.trackId){ c = (DATA.commandes||[]).find(x=>x.id===view.trackId) || null; }
  else if(ref){
    const ms = (DATA.commandes||[]).filter(x=>String(x.reference||'').trim().toLowerCase()===ref.toLowerCase());
    c = ms.length ? ms[ms.length-1] : null;
  }
  if(!c){
    if(view.trackSearched || view.trackId) box.appendChild(el('<div class="search-msg" style="color:var(--red);">Aucune commande trouvée avec cette référence. Vérifiez la référence ou contactez votre commercial.</div>'));
    return;
  }
  const steps = publicSteps(c);
  const allDone = steps.every(x=>x.state==='done');
  const cur = steps.find(x=>x.state!=='done');
  const card = el('<div class="track-card"></div>');
  card.appendChild(el('<div style="font-size:22px;font-weight:bold;text-align:center;">'+esc(c.reference)+'</div>'));
  card.appendChild(el('<div style="font-size:13px;color:var(--text-soft);text-align:center;margin:2px 0 10px;">'+esc(c.article)+(c.quantite?' · '+esc(c.quantite)+' pièces':'')+'</div>'));
  card.appendChild(renderJourney(c, steps));
  card.appendChild(el('<div class="track-msg'+(allDone?' ok':'')+'">'+(allDone?'✓ Votre commande est terminée.':'Étape en cours : <b>'+esc(cur.label)+'</b> ('+esc(cur.text.toLowerCase())+')')+'</div>'));
  const info = el('<div class="track-info"></div>');
  info.appendChild(el('<div><span>Date de commande</span><b>'+(c.dateCommande?fmtDate(c.dateCommande):'—')+'</b></div>'));
  info.appendChild(el('<div><span>Livraison prévue</span><b>'+(c.dateLivraisonPrevue?fmtDate(c.dateLivraisonPrevue):'—')+'</b></div>'));
  const com = commercialOf(c);

  card.appendChild(info);
  box.appendChild(card);

function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const pad = n=>String(n).padStart(2,'0');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

// ---------- DISCUSSION (équipe + conversations privées, mise à jour en direct) ----------
// Un message sans "to" est pour toute l'équipe. Avec "to" (id d'une personne), c'est un message
// privé entre l'admin et cette personne : seuls eux deux le voient dans l'application.
function chatMsgVisible(m){
  if(m.alert) return view.role==='admin';        // alertes système : réservées à l'admin
  const me = view.personId;
  return !m.to || m.personId===me || m.to===me;
}
function chatThreadOf(m){
  if(m.alert) return 'alertes';
  if(!m.to) return 'team';
  return m.personId===view.personId ? m.to : m.personId;
}
function chatThreads(){
  // liste des conversations proposées : équipe + (admin : toutes les personnes | autres : les admins)
  const me = view.personId;
  const people = (DATA.people||[]).filter(p=>p.active!==false && p.id!==me && (view.role==='admin' || p.role==='admin'));
  const base = [{key:'team', label:'Toute l\'équipe'}];
  if(view.role==='admin') base.push({key:'alertes', label:'⚠ Alertes (consommation tissu)'});
  return base.concat(people.map(p=>({key:p.id, label:'Privé · '+p.name+' ('+(ROLE_LABEL[p.role]||p.role)+')'})));
}
function chatSeenLoad(){
  const k = 'dj_chat_seen_'+view.personId;
  let seen = null;
  try{ seen = JSON.parse(localStorage.getItem(k)||'null'); }catch(e){}
  if(!seen){
    // première utilisation : l'existant est considéré comme déjà lu
    seen = {};
    (DATA.messages||[]).filter(chatMsgVisible).forEach(m=>{ const t=chatThreadOf(m); if(!seen[t] || (m.ts||'')>seen[t]) seen[t]=m.ts||''; });
    chatSeenSave(seen);
  }
  return seen;
}
function chatSeenSave(seen){ try{ localStorage.setItem('dj_chat_seen_'+view.personId, JSON.stringify(seen)); }catch(e){} }
function chatUnread(){
  // { threadKey: nombre de messages non lus des autres }
  const seen = chatSeenLoad(), out = {};
  (DATA.messages||[]).filter(chatMsgVisible).forEach(m=>{
    if(m.personId===view.personId) return;
    const t = chatThreadOf(m);
    if((m.ts||'') > (seen[t]||'')) out[t] = (out[t]||0)+1;
  });
  return out;
}
function chatBtnHtml(){
  const un = chatUnread();
  const n = Object.keys(un).reduce((a,k)=>a+un[k],0);
  return 'Discussion'+(n?' <span class="badge">'+n+'</span>':'');
}
function chatThreadMsgs(key){
  return (DATA.messages||[]).filter(chatMsgVisible).filter(m=>chatThreadOf(m)===key).sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
}
function chatMarkSeen(key){
  const msgs = chatThreadMsgs(key);
  if(!msgs.length) return;
  const seen = chatSeenLoad();
  const last = msgs[msgs.length-1].ts||'';
  if((seen[key]||'') < last){ seen[key] = last; chatSeenSave(seen); }
}
function chatFillSelect(sel){
  const un = chatUnread();
  const opts = chatThreads().map(t=>({key:t.key, text:t.label+(un[t.key]?'  ('+un[t.key]+' nouveau'+(un[t.key]>1?'x':'')+')':'')}));
  if(!opts.some(o=>o.key===view.chatWith)) view.chatWith = 'team';
  const sig = opts.map(o=>o.key+'|'+o.text).join('§');
  if(sel.dataset.sig===sig){ sel.value = view.chatWith; return; }
  sel.dataset.sig = sig;
  sel.innerHTML = '';
  opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.key; op.textContent=o.text; sel.appendChild(op); });
  sel.value = view.chatWith;
}
function chatFillList(list){
  const key = view.chatWith;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60 || !list.dataset.init;
  list.dataset.init = '1';
  list.innerHTML = '';
  const msgs = chatThreadMsgs(key);
  if(msgs.length===0){
    list.appendChild(el('<div class="empty-msg">'+(key==='team'?'Aucun message pour le moment. Écris le premier ci-dessous.':(key==='alertes'?'Aucune alerte pour le moment.':'Aucun message privé pour le moment.'))+'</div>'));
  } else {
    msgs.forEach(msg=>{
      const mine = msg.personId && msg.personId===view.personId;
      const bubble = el('<div class="chat-msg'+(mine?' mine':'')+(msg.to?' priv':'')+(msg.alert?' alertmsg':'')+'"></div>');
      const meta = document.createElement('div'); meta.className='chat-meta';
      const b = document.createElement('b'); b.textContent = msg.author; meta.appendChild(b);
      meta.appendChild(document.createTextNode(' · '+fmtDateTime(msg.ts)));
      bubble.appendChild(meta);
      const textDiv = document.createElement('div');
      textDiv.className = 'chat-text';
      textDiv.textContent = msg.text;
      bubble.appendChild(textDiv);
      list.appendChild(bubble);
    });
  }
  if(nearBottom) setTimeout(()=>{ list.scrollTop = list.scrollHeight; }, 0);
  chatMarkSeen(key);
}
// Met à jour le bouton du haut et, si la discussion est ouverte, la liste — sans la recréer
function refreshChatUI(){
  updateConsoBanner();
  const btn = document.getElementById('chatBtn');
  if(btn) btn.innerHTML = chatBtnHtml();
  if(view.discussionOpen){
    const sel = document.getElementById('chatSel'), list = document.getElementById('chatList');
    if(list) chatFillList(list);          // les messages affichés sont marqués comme lus
    if(sel) chatFillSelect(sel);
    if(btn) btn.innerHTML = chatBtnHtml();
  }
}
async function fetchRemoteMessages(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main&select=data->messages`, { headers: { 'apikey': SUPABASE_KEY }, cache:'no-store' });
    if(!res.ok) return null;
    const rows = await res.json();
    const msgs = rows && rows[0] ? rows[0].messages : null;
    return Array.isArray(msgs) ? msgs : [];
  }catch(e){ return null; }
}
function mergeMessages(remote){
  DATA.messages = DATA.messages || [];
  const have = new Set(DATA.messages.map(m=>m.id));
  let added = 0;
  remote.forEach(m=>{ if(m && m.id && !have.has(m.id)){ DATA.messages.push(m); have.add(m.id); added++; } });
  if(added){
    DATA.messages.sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
    if(DATA.messages.length>200) DATA.messages = DATA.messages.slice(-200);
  }
  return added;
}
let chatPollBusy = false;
async function pollMessages(){
  if(!view.personId || chatPollBusy || document.hidden) return;
  chatPollBusy = true;
  try{
    const r = await fetchRemoteMessages();
    if(r && mergeMessages(r)) refreshChatUI();
  }catch(e){}
  chatPollBusy = false;
}

async function postMessage(text){
  if(!text || !text.trim()) return;
  const person = currentPerson();
  const author = person ? person.name : (ROLE_LABEL[view.role]||'Inconnu');
  DATA.messages = DATA.messages || [];
  const msg = {
    id: 'msg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    author: author, role: view.role, personId: view.personId, text: text.trim(), ts: new Date().toISOString()
  };
  if(view.chatWith && view.chatWith!=='team') msg.to = view.chatWith;
  DATA.messages.push(msg);
  if(DATA.messages.length>200) DATA.messages = DATA.messages.slice(-200);
  view.chatRefocus = true;
  render();
  // avant d'enregistrer, on récupère les messages que les autres ont envoyés entre-temps
  const remote = await fetchRemoteMessages();
  if(remote) mergeMessages(remote);
  const ok = await saveToSupabase();
  refreshChatUI();
  if(!ok) showToast("⚠ Échec de l'enregistrement, vérifiez la connexion");
}

function renderDiscussion(){
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal chat-modal"></div>');
  m.appendChild(el('<h2>Discussion</h2>'));
  if(!view.chatWith) view.chatWith = 'team';

  const selWrap = el('<div style="margin-bottom:8px;"></div>');
  selWrap.appendChild(el('<label style="display:block;font-size:11px;color:var(--text-soft);margin-bottom:3px;">'+(view.role==='admin'?'Parler avec :':'Conversation :')+'</label>'));

    ta.placeholder = view.chatWith==='team' ? 'Écris un message à toute l\'équipe...' : 'Message privé — '+(th?th.label.replace('Privé · ',''):'')+'...';
  };
  setPlaceholder();
  sel.onchange = ()=>{ view.chatWith = sel.value; list.dataset.init=''; setPlaceholder(); chatFillList(list); refreshChatUI(); };
  inputRow.appendChild(ta);
  const sendBtn = el('<button class="btn primary">Envoyer</button>');
  sendBtn.onclick = ()=>{
    const t = ta.value;
    if(!t || !t.trim()) return;
    ta.value = '';
    postMessage(t);
  };
  inputRow.appendChild(sendBtn);
  m.appendChild(inputRow);

  const closeBtn = el('<button class="btn" style="margin-top:10px;">Fermer</button>');
  closeBtn.onclick = ()=>{ view.discussionOpen=false; render(); };
  m.appendChild(closeBtn);

  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.discussionOpen=false; render(); } };
  chatFillList(list);
  chatFillSelect(sel);
  if(view.chatRefocus){ view.chatRefocus = false; setTimeout(()=>{ try{ ta.focus(); }catch(e){} }, 0); }
  return overlay;
}

// ---------- DEPARTMENT SCREEN ----------
function prioRank(c){ const n = Number(c.priorite); return n>0 ? n : 99999; }
function prioTag(c){ return Number(c.priorite)>0 ? '<span class="prio-tag">PRIORITÉ '+Number(c.priorite)+'</span>' : ''; }
const PREV_DEPT = {confection:'decoupe', emballage:'confection'};
// Une commande est « prête à traiter » dans un service quand l'étape précédente est terminée
function readyForDept(c, dept){
  const pv = PREV_DEPT[dept];
  if(!pv) return true;
  return c[pv].statut==='Prête' || c[pv].statut==='Annulée';
}
function isNewForDept(c, dept){
  // "Notification" signal: an item the department hasn't started touching yet —
  // either just launched by Commercial, or just handed off by the previous
  // department (for stock, arrival in the queue at all IS the notification).
  if(dept==='stock') return true;
  return c[dept].statut==='En attente' && readyForDept(c,dept);
}

function renderDeptScreen(){
  const w = el('<div></div>');
  const dept = view.role;
  const active = DATA.commandes.filter(c=>{
    if(dept==='stock') return c.emballage.statut==='Prête' && (c.stock.quantiteRecue===''||c.stock.quantiteRecue===null);
    const st = c[dept].statut;
    return st!=='Prête' && st!=='Annulée';
  });
  const newCount = active.filter(c=>isNewForDept(c,dept)).length;
  const ecarts = dept==='emballage' ? ecartsAGerer() : [];
  w.appendChild(topbar('Espace '+DEPT_LABEL[view.role], newCount+ecarts.length));
  const wrap = el('<div class="wrap"></div>');
  myEvalSection(wrap);

  const scanned = view.focusId ? (DATA.commandes||[]).find(x=>x.id===view.focusId) : null;
  if(scanned){
    wrap.appendChild(el('<div class="section-title" style="background:var(--charcoal);color:#fff;">Commande scannée</div>'));
    const scBody = el('<div class="section-body"></div>');
    scBody.appendChild(renderFiche(scanned));
    const closeScan = el('<button class="btn" style="margin-top:10px;">Fermer la fiche</button>');
    closeScan.onclick = ()=>{ view.focusId=null; render(); };
    scBody.appendChild(closeScan);
    wrap.appendChild(scBody);
  }

  if(dept==='emballage' && ecarts.length){
    wrap.appendChild(el('<div class="section-title" style="background:var(--red);">Écarts de stock à gérer ('+ecarts.length+')</div>'));
    const ecBody = el('<div class="section-body"></div>');
    ecarts.forEach(c=>ecBody.appendChild(renderEcartCard(c)));
    wrap.appendChild(ecBody);
  }

  const cmpQueue = (a,b)=>{
    const pa = prioRank(a), pb = prioRank(b);
    if(pa!==pb) return pa-pb;
    if(a.urgent!==b.urgent) return a.urgent? -1:1;
    const an = isNewForDept(a,dept), bn = isNewForDept(b,dept);
    if(an!==bn) return an? -1:1;
    return (a.dateCommande||'').localeCompare(b.dateCommande||'');
  };
  const ready = active.filter(c=>readyForDept(c,dept)).sort(cmpQueue);
  wrap.appendChild(el('<div class="section-title">Tâches en cours ('+ready.length+')'+(newCount?' — dont '+newCount+' nouvelle(s)':'')+'</div>'));
  const body = el('<div class="section-body"></div>');
  if(ready.length===0){
    body.appendChild(el('<div class="empty-msg">Aucune commande à traiter pour '+DEPT_LABEL[dept]+' pour le moment.</div>'));
  } else {
    if(ready.some(c=>Number(c.priorite)>0)) body.appendChild(el('<div class="empty-msg" style="padding:0 0 10px;text-align:left;">Les commandes sont classées par <b>priorité</b> : fais-les dans cet ordre.</div>'));

// ---------- TISSU / MATIÈRE : champs + consommation globale du produit ----------
// Formule : Consommation par pièce = poids/pièce + côte/pièce + accessoires/pièce
//           Consommation globale   = consommation par pièce × nombre réel de pièces
// (si le nombre réel n'est pas encore saisi, on prend la quantité commandée)
function matNum(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function matHas(v){ return v!=='' && v!==null && v!==undefined; }
function consoGlobale(ti, quantite){
  ti = ti || {};
  const reel = matHas(ti.nombreReel);
  const nb = reel ? matNum(ti.nombreReel) : matNum(quantite);
  const parPiece = matNum(ti.poidsPiece) + matNum(ti.poidsCote) + matNum(ti.poidsAccessoires);
  return {parPiece:parPiece, nb:nb, total:parPiece*nb, reel:reel};
}
function fmtKg(n){ return (Math.round(n*1000)/1000).toLocaleString('fr-FR', {maximumFractionDigits:3}); }
function consoSeuil(){
  const v = parseFloat((DATA.settings||{}).consoSeuil);
  return isNaN(v) || v<0 ? 5 : v;
}
// Compare la conso moyenne du catalogue (kg / pièce) à la conso globale réelle saisie par la Découpe
function consoCore(moy, ti, quantite){
  const g = consoGlobale(ti, quantite);
  if(!(g.parPiece>0)) return null;
  const attendu = Number(moy) * g.nb;
  if(!(attendu>0)) return null;
  const ecart = g.total - attendu, pct = ecart/attendu*100, seuil = consoSeuil();
  return {moy:Number(moy), parPiece:g.parPiece, nb:g.nb, attendu:attendu, total:g.total, ecart:ecart, pct:pct, seuil:seuil,
          status: Math.abs(pct)<=seuil ? 'ok' : (pct>0 ? 'sur' : 'sous')};
}
function consoCompare(c){
  const prod = c.catalogueId ? catalogueById(c.catalogueId) : null;
  if(!prod || !matHas(prod.consoMoyenne)) return null;
  if((prod.consoUnite||'kg')!=='kg') return null;     // comparaison seulement en kg
  const r = consoCore(prod.consoMoyenne, c.tissuInfo, c.quantite);
  if(r) r.prod = prod;
  return r;
}
function fmtSigned(n, digits){ const v = Math.round(n*Math.pow(10,digits))/Math.pow(10,digits); return (v>0?'+':'')+v.toLocaleString('fr-FR',{maximumFractionDigits:digits}); }
function consoLabel(st){ return st==='ok' ? 'Normal' : (st==='sur' ? 'Surconsommation' : 'Sous-consommation'); }
function consoPill(st){
  const col = st==='ok' ? ['#E3F3E7','#1E7A34'] : (st==='sur' ? ['#FBE4E6','#A42834'] : ['#FFF0D6','#B26A00']);
  return '<span class="pill" style="background:'+col[0]+';color:'+col[1]+';">'+(st==='ok'?'':'⚠ ')+consoLabel(st)+'</span>';
}
function consoAlertText(c, r, who){
  return '⚠ '+c.reference+' · '+(c.article||'')+' — '+consoLabel(r.status)+' de tissu : attendu '+fmtKg(r.attendu)+' kg ('+fmtKg(r.moy)+' kg × '+fmtKg(r.nb)+' pièces), réel '+fmtKg(r.total)+' kg → écart '+fmtSigned(r.ecart,2)+' kg ('+fmtSigned(r.pct,1)+' %), seuil ±'+fmtKg(r.seuil)+' %.'+(who?' Saisi par '+who+'.':'');
}
// Envoie un message d'alerte à l'admin (fil « Alertes ») quand l'écart dépasse le seuil
function maybeSendConsoAlert(c){
  const r = consoCompare(c);
  if(!r || r.status==='ok'){ c.consoAlerteKey = ''; return false; }
  const key = r.status+':'+(Math.round(r.pct*10)/10);
  if(c.consoAlerteKey===key) return false;         // déjà signalé pour ces valeurs
  c.consoAlerteKey = key;
  const person = currentPerson();
  DATA.messages = DATA.messages || [];
  DATA.messages.push({
    id:'msg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    author:'Alerte consommation', role:'system', personId:'system', alert:true, orderId:c.id,
    text: consoAlertText(c, r, person?person.name:''), ts:new Date().toISOString()
  });
  if(DATA.messages.length>200) DATA.messages = DATA.messages.slice(-200);
  return true;
}
const MAT_FIELDS = [
  ['poidsMatelas','Poids matelas (kg)'],
  ['poidsTrace','Poids tracé (kg)'],
  ['poidsPiece','Poids / pièce (kg)'],
  ['poidsCote','Côte / pièce (kg)'],
  ['poidsAccessoires','Accessoires / pièce (kg)'],
  ['nombreReel','Nombre réel de pièces']
];
// Retourne {node, read}. read() donne les valeurs saisies ; onInput(valeurs) est appelé à chaque frappe.
function matiereBlock(ti, quantite, onInput, moyenne){
  ti = ti || {};
  const box = el('<div></div>');
  const inputs = {};
  let row = null;
  MAT_FIELDS.forEach(([key,label], i)=>{
    if(i%2===0){ row = el('<div class="field-row"></div>'); box.appendChild(row); }
    const f = el('<div><label>'+label+'</label></div>');
    const inp = document.createElement('input'); inp.type='number'; inp.step='any'; inp.min='0'; inp.inputMode='decimal';
    inp.value = matHas(ti[key]) ? ti[key] : '';
    if(key==='nombreReel' && matHas(quantite)) inp.placeholder = 'commandé : '+quantite;
    f.appendChild(inp); row.appendChild(f); inputs[key] = inp;
  });
  const res = el('<div class="mat-res"></div>');
  box.appendChild(res);
  function read(){
    const o = {};
    Object.keys(inputs).forEach(k=>{ o[k] = inputs[k].value==='' ? '' : Number(inputs[k].value); });
    return o;
  }
  function update(){
    const v = read();
    const g = consoGlobale(v, quantite);
    res.innerHTML = '';
    const l1 = el('<div class="mat-line"><span>Consommation par pièce</span><b></b></div>');
    l1.lastChild.textContent = fmtKg(g.parPiece)+' kg';
    const l2 = el('<div class="mat-line big"><span>Consommation globale du produit</span><b></b></div>');
    l2.lastChild.textContent = fmtKg(g.total)+' kg';
    res.appendChild(l1); res.appendChild(l2);
    const f = el('<div class="mat-formula"></div>');
    f.textContent = '(poids/pièce + côte + accessoires) × '+fmtKg(g.nb)+' pièces'+(g.reel?' (nombre réel)':' (quantité commandée)');
    res.appendChild(f);
    if(moyenne!==undefined && moyenne!==null && moyenne!==''){
      const r = consoCore(moyenne, v, quantite);
      const cmp = el('<div class="mat-cmp"></div>');
      if(!r){ cmp.className='mat-cmp'; cmp.textContent = 'Conso moyenne du catalogue : '+fmtKg(moyenne)+' kg / pièce — remplis les poids pour voir l\'écart.'; }
      else {
        cmp.className = 'mat-cmp '+r.status;
        cmp.innerHTML = '<b>Suivi consommation</b><br>Attendu (moyenne catalogue) : '+fmtKg(r.attendu)+' kg<br>Réel (conso globale) : '+fmtKg(r.total)+' kg<br><b>Écart : '+fmtSigned(r.ecart,2)+' kg ('+fmtSigned(r.pct,1)+' %)</b> — '+consoLabel(r.status)
          + (r.status!=='ok' ? '<br>⚠ Au-dessus du seuil de ±'+fmtKg(r.seuil)+' % : l\'admin sera alerté à l\'enregistrement.' : '');
      }
      res.appendChild(cmp);
    }
    if(onInput) onInput(v);
  }
  Object.keys(inputs).forEach(k=>{ inputs[k].oninput = update; });
  // calcul initial sans déclencher onInput
  const keep = onInput; onInput = null; update(); onInput = keep;
  return {node:box, read:read};
}

// Informations utiles à chaque département (affichées sur chaque carte de tâche)
function renderDeptDetails(c, dept){
  const box = el('<div class="dept-det"></div>');
  const ti = c.tissuInfo || {};
  const has = v => v!=='' && v!==null && v!==undefined;
  function item(label, value, full){
    if(!has(value)) return;
    const d = el('<div'+(full?' class="full"':'')+'><div class="k">'+esc(label)+'</div></div>');
    const v = document.createElement('div'); v.className='v'; v.textContent = String(value);
    d.appendChild(v); box.appendChild(d);
  }
  function tailles(){
    const keys = Object.keys(c.tailles||{}).filter(k=>has(c.tailles[k]) && Number(c.tailles[k])>0);
    if(!keys.length) return;
    const d = el('<div class="full"><div class="k">Répartition par taille</div></div>');

  const prod = c.catalogueId ? catalogueById(c.catalogueId) : null;

    item('Quantité à couper', has(c.quantite)?c.quantite+' pièces':'');
    if(prod && has(prod.consoMoyenne)){

    item('Confection terminée le', c.confection && c.confection.fin ? fmtDate(c.confection.fin) : '');
    item('Livraison prévue', c.dateLivraisonPrevue ? fmtDate(c.dateLivraisonPrevue) : '');
    tailles();
  } else if(dept==='stock'){

    item('Livraison prévue', c.dateLivraisonPrevue ? fmtDate(c.dateLivraisonPrevue) : '');
    tailles();
  }
  if(c.notes && String(c.notes).trim()){
    const d = el('<div class="full"><div class="k">Notes</div></div>');

  return box;

  STATUS_OPTIONS.forEach(o=>{

    if(o===d.statut) opt.selected=true;
    sel.appendChild(opt);
  });
  f1.appendChild(sel); row1.appendChild(f1);
  card.appendChild(row1);

  const row2 = el('<div class="field-row"></div>');
  let dateInputs = [];
  if(dept==='decoupe'){

    const f3 = el('<div><label>Découpe faite le</label></div>');
    const i3 = document.createElement('input'); i3.type='date'; i3.value=d.faiteLe||''; f3.appendChild(i3); row2.appendChild(f3);

    const i2 = document.createElement('input'); i2.type='text'; i2.value=d.atelier||''; f2.appendChild(i2); row2.appendChild(f2);
    const f3 = el('<div><label>Début</label></div>');
    const i3 = document.createElement('input'); i3.type='date'; i3.value=d.debut||''; f3.appendChild(i3); row2.appendChild(f3);
    dateInputs = [['atelier',i2],['debut',i3]];
  } else if(dept==='emballage'){
    const f2 = el('<div><label>Début</label></div>');
    const i2 = document.createElement('input'); i2.type='date'; i2.value=d.debut||''; f2.appendChild(i2); row2.appendChild(f2);
    const f3 = el('<div><label>Fin</label></div>');
    const i3 = document.createElement('input'); i3.type='date'; i3.value=d.fin||''; f3.appendChild(i3); row2.appendChild(f3);
    dateInputs = [['debut',i2],['fin',i3]];
  }
  card.appendChild(row2);

  // Découpe : remplit Tissu / Matière (poids, côte, accessoires, nombre réel → consommation globale)

    matBlock = matiereBlock(c.tissuInfo, c.quantite, null, _moy);
    card.appendChild(matBlock.node);

  let extraRow=null, i4=null;
  if(dept==='confection'){

    const alerted = matBlock ? maybeSendConsoAlert(c) : false;
    saveState('Mis à jour : '+c.reference+(alerted?' — alerte envoyée à l\'admin':''));
  };
  saveRow.appendChild(btn);
  card.appendChild(saveRow);
  return card;
}

function consoAlertCount(){

function renderConsoPanel(){
  const root = el('<div></div>');
  const seuil = consoSeuil();
  root.appendChild(el('<div class="empty-msg" style="padding:0 0 12px;text-align:left;">Compare la <b>consommation moyenne</b> du catalogue (par pièce) à la <b>consommation globale réelle</b> saisie par la Découpe (poids/pièce + côte + accessoires, × nombre réel). Alerte au-delà de <b>±'+fmtKg(seuil)+' %</b> (réglable dans Paramètres).</div>'));
  root.appendChild(ioBar([{label:'Exporter le suivi (CSV)', fn:exportConsoCSV}], []));
  function table(heads){
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const t = document.createElement('table'); t.className='main';
    const th = document.createElement('thead'); const hr = document.createElement('tr');
    heads.forEach(h=>{ const c=document.createElement('th'); c.textContent=h; hr.appendChild(c); });
    th.appendChild(hr); t.appendChild(th);
    const tb = document.createElement('tbody'); t.appendChild(tb); wrap.appendChild(t);
    return {wrap:wrap, tb:tb};
  }
  function row(tb, cells){
    const tr = document.createElement('tr');
    cells.forEach(h=>{ const td=document.createElement('td'); td.innerHTML = h; tr.appendChild(td); });
    tb.appendChild(tr);
  }
  const comps = [];
  (DATA.commandes||[]).forEach(c=>{ const r = consoCompare(c); if(r) comps.push({c:c, r:r}); });

  // --- par produit
  root.appendChild(el('<div style="font-weight:bold;font-size:13px;margin:4px 0 8px;">Par produit</div>'));
  const tp = table(['Produit','Conso moyenne (catalogue)','Conso réelle moyenne','Écart','Commandes','Statut']);
  let anyProd = false;
  (DATA.catalogue||[]).forEach(p=>{
    if(!matHas(p.consoMoyenne)) return;
    anyProd = true;
    const mine = comps.filter(x=>x.c.catalogueId===p.id);
    if((p.consoUnite||'kg')!=='kg'){
      row(tp.tb, ['<b>'+esc(p.article)+'</b>', esc(p.consoMoyenne)+' '+esc(p.consoUnite)+' / pièce','—','—', String((DATA.commandes||[]).filter(c=>c.catalogueId===p.id).length), '<span style="color:var(--text-soft);font-size:12px;">unité « m » : comparaison impossible</span>']);
      return;
    }
    if(!mine.length){
      row(tp.tb, ['<b>'+esc(p.article)+'</b>', fmtKg(p.consoMoyenne)+' kg / pièce','—','—','0','<span style="color:var(--text-soft);font-size:12px;">pas encore de données</span>']);
      return;
    }
    const sumTot = mine.reduce((a,x)=>a+x.r.total,0), sumNb = mine.reduce((a,x)=>a+x.r.nb,0), sumAtt = mine.reduce((a,x)=>a+x.r.attendu,0);
    const reel = sumNb>0 ? sumTot/sumNb : 0;
    const pct = sumAtt>0 ? (sumTot-sumAtt)/sumAtt*100 : 0;
    const st = Math.abs(pct)<=seuil ? 'ok' : (pct>0?'sur':'sous');
    row(tp.tb, ['<b>'+esc(p.article)+'</b>', fmtKg(p.consoMoyenne)+' kg / pièce', fmtKg(reel)+' kg / pièce', '<b style="color:'+(st==='ok'?'#1E7A34':'#A42834')+';">'+fmtSigned(pct,1)+' %</b>', String(mine.length), consoPill(st)]);
  });
  if(!anyProd) root.appendChild(el('<div class="empty-msg" style="text-align:left;">Aucun produit du catalogue n\'a de consommation moyenne. Renseigne-la dans « Catalogue produits ».</div>'));
  else root.appendChild(tp.wrap);

  // --- par commande
  root.appendChild(el('<div style="font-weight:bold;font-size:13px;margin:16px 0 8px;">Par commande (plus gros écarts en premier)</div>'));
  if(!comps.length){
    root.appendChild(el('<div class="empty-msg" style="text-align:left;">Aucune commande comparable pour l\'instant : il faut un produit du catalogue avec une conso moyenne (en kg) et les poids saisis par la Découpe.</div>'));
  } else {
    const tc = table(['Référence','Produit','Attendu','Réel','Écart','Écart %','Statut']);
    comps.sort((a,b)=>Math.abs(b.r.pct)-Math.abs(a.r.pct)).forEach(x=>{
      const col = x.r.status==='ok' ? '#1E7A34' : '#A42834';
      row(tc.tb, ['<b>'+esc(x.c.reference)+'</b>', esc(x.c.article), fmtKg(x.r.attendu)+' kg', fmtKg(x.r.total)+' kg', '<span style="color:'+col+';">'+fmtSigned(x.r.ecart,2)+' kg</span>', '<b style="color:'+col+';">'+fmtSigned(x.r.pct,1)+' %</b>', consoPill(x.r.status)]);
    });
    root.appendChild(tc.wrap);
  }
  return root;
}

// ================= ÉVALUATION AUTOMATIQUE DE L'ÉQUIPE (étoiles calculées) =================
// Les étoiles sont calculées par l'application à partir du travail réel de chacun.
// L'admin ne note rien à la main. Barème : ≥95 % = 5★ · 85–94 % = 4★ · 70–84 % = 3★ · 50–69 % = 2★ · <50 % = 1★.
function roleCount(role){ return (DATA.people||[]).filter(x=>x.role===role && x.active!==false).length; }
// Une étape est attribuée à la personne qui a cliqué « Enregistrer » ; avant ça, au seul employé du rôle
function personHandles(c, dept, p){
  const par = dept==='stock' ? (c.stock||{}).par : (c[dept]||{}).par;
  if(par) return par===p.id;
  return roleCount(p.role)===1;
}
function avgOf(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
function pctTone(p){ return p>=85 ? '#1E7A34' : (p>=70 ? '#B26A00' : '#A42834'); }
function starsFromPct(p){ return p>=95 ? 5 : (p>=85 ? 4 : (p>=70 ? 3 : (p>=50 ? 2 : 1))); }
function teamOrders(){
  const all = DATA.commandes||[];
  const per = view.teamPeriod || 'tout';
  if(per==='tout') return all;
  const cut = new Date(Date.now() - Number(per)*86400000).toISOString().slice(0,10);
  return all.filter(c=>(c.dateCommande||'') >= cut);
}
// Un critère = une liste de commandes testées (ok / pas ok) avec la raison
function critL(label, hint, arr, okFn, whyFn){
  const items = arr.map(c=>({ref:c.reference, ok:!!okFn(c), why:whyFn(c)}));
  if(!items.length) return {label:label, hint:hint, none:true, items:[]};
  const good = items.filter(x=>x.ok).length, pct = good/items.length*100;
  return {label:label, hint:hint, good:good, total:items.length, pct:pct, stars:starsFromPct(pct), items:items};
}
function evOvOf(pid,key){ const o = (DATA.evalOv||{})[pid]; return o && o[key] ? o[key] : null; }
function evOvSet(pid,key,stars,note){
  DATA.evalOv = DATA.evalOv||{}; DATA.evalOv[pid] = DATA.evalOv[pid]||{};
  if(!stars && !note) delete DATA.evalOv[pid][key];
  else DATA.evalOv[pid][key] = {stars:stars||null, note:note||''};
}
function dFr(d){ return fmtDate(d); }
function lateTxt(n){ return n>0 ? ' (+'+n+' j de retard)' : (n<0 ? ' ('+(-n)+' j d\'avance)' : ' (à l\'heure)'); }
// Retourne {crits, stars, autoStars, n, ov} pour un employé
function autoEval(p){
  const cmds = teamOrders();
  const STARTED = ['Prête','En cours','Problème','Tissu non disponible'];
  const crits = []; let n = 0;
  const probWhy = k=>c=> c[k].statut==='Problème' ? 'statut « Problème »' : 'sans problème';
  if(p.role==='decoupe'){
    const started = cmds.filter(c=>STARTED.indexOf(c.decoupe.statut)>=0 && personHandles(c,'decoupe',p));
    const done = started.filter(c=>c.decoupe.statut==='Prête');
    const wd = done.filter(c=>c.decoupe.prevueLe && c.decoupe.faiteLe);
    const cmp = done.filter(c=>consoCompare(c));
    n = started.length;
    crits.push(critL('Délais','Découpe faite à la date prévue', wd, c=>anDays(c.decoupe.prevueLe,c.decoupe.faiteLe)<=0, c=>'prévue '+dFr(c.decoupe.prevueLe)+' · faite '+dFr(c.decoupe.faiteLe)+lateTxt(anDays(c.decoupe.prevueLe,c.decoupe.faiteLe))));
    crits.push(critL('Qualité','Consommation de tissu conforme', cmp, c=>consoCompare(c).status==='ok', c=>{ const r=consoCompare(c); return consoLabel(r.status)+' ('+fmtSigned(r.pct,1)+' %)'; }));
    crits.push(critL('Fiabilité','Commandes sans problème', started, c=>c.decoupe.statut!=='Problème', probWhy('decoupe')));
  } else if(p.role==='confection' || p.role==='emballage'){
    const k = p.role;
    const started = cmds.filter(c=>STARTED.indexOf(c[k].statut)>=0 && personHandles(c,k,p));
    const done = started.filter(c=>c[k].statut==='Prête');
    const wl = done.filter(c=>c[k].fin && c.dateLivraisonPrevue);
    const rec = done.filter(c=>ecartStock(c)!==null);
    n = started.length;
    crits.push(critL('Délais','Terminée avant la livraison prévue', wl, c=>c[k].fin<=c.dateLivraisonPrevue, c=>'fin '+dFr(c[k].fin)+' · livraison prévue '+dFr(c.dateLivraisonPrevue)+lateTxt(anDays(c.dateLivraisonPrevue,c[k].fin))));
    crits.push(critL('Qualité','Quantité reçue conforme (sans écart)', rec, c=>ecartStock(c)===0, c=>'commandé '+c.quantite+' · reçu '+c.stock.quantiteRecue+' ('+statutReception(c)+')'));
    crits.push(critL('Fiabilité','Commandes sans problème', started, c=>c[k].statut!=='Problème', probWhy(k)));
  } else if(p.role==='stock'){
    const rec = cmds.filter(c=>ecartStock(c)!==null && personHandles(c,'stock',p));
    const wd = rec.filter(c=>c.emballage.fin && c.stock.dateReception);
    const packed = cmds.filter(c=>c.emballage.statut==='Prête' && (ecartStock(c)!==null ? personHandles(c,'stock',p) : roleCount('stock')===1));
    n = rec.length;
    crits.push(critL('Délais','Réception enregistrée sous 2 jours', wd, c=>anDays(c.emballage.fin,c.stock.dateReception)<=2, c=>'emballée '+dFr(c.emballage.fin)+' · reçue '+dFr(c.stock.dateReception)+' ('+anDays(c.emballage.fin,c.stock.dateReception)+' j)'));
    crits.push(critL('Fiabilité','Commandes emballées déjà réceptionnées', packed, c=>ecartStock(c)!==null, c=>ecartStock(c)!==null ? 'réceptionnée' : 'pas encore réceptionnée'));
  } else if(p.role==='commercial'){
    const mine = cmds.filter(c=>c.commercialId===p.id);
    const wd = mine.filter(c=>c.stock.dateReception && c.dateLivraisonPrevue);
    const rec = mine.filter(c=>ecartStock(c)!==null);
    const ecs = mine.filter(c=>{ const e = ecartStock(c); return e!==null && e!==0; });
    n = mine.length;
    crits.push(critL('Délais','Reçue en stock avant la livraison prévue', wd, c=>c.stock.dateReception<=c.dateLivraisonPrevue, c=>'reçue '+dFr(c.stock.dateReception)+' · livraison prévue '+dFr(c.dateLivraisonPrevue)+lateTxt(anDays(c.dateLivraisonPrevue,c.stock.dateReception))));
    crits.push(critL('Qualité','Commandes reçues et entièrement payées', rec, c=>payInfo(c).statut==='Payé', c=>'paiement : '+payInfo(c).statut));
    crits.push(critL('Fiabilité','Écarts de stock gérés', ecs, c=>!!c.ecartGere, c=>c.ecartGere ? 'écart géré' : 'écart pas encore géré ('+statutReception(c)+')'));
  }
  // corrections de l'admin, critère par critère
  crits.forEach(c=>{
    const o = evOvOf(p.id, c.label);
    c.autoStars = c.none ? null : c.stars;
    c.ov = o;
    if(o && o.stars){ c.stars = o.stars; c.none = false; c.manual = true; }
  });
  const valid = crits.filter(x=>!x.none);
  const autoStars = valid.length ? avgOf(valid.map(x=>x.stars)) : null;
  const g = evOvOf(p.id,'global');
  let stars = autoStars, manual = false;
  if(g && g.stars){ stars = g.stars; manual = true; }
  return {crits:crits, stars:stars, autoStars:autoStars, n:n, ov:g, manual:manual};
}

function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function backupPayload(){ return {app:'suivi-production-dj', version:18, exportedAt:new Date().toISOString(), data:DATA}; }
function exportJSON(){ downloadFile('sauvegarde_djebs_'+todayISO()+'.json', JSON.stringify(backupPayload()), 'application/json'); }
function csvCell(v){ if(typeof v==='number' && !Number.isInteger(v)) v = String(v).replace('.',','); return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function csvFile(name, header, rows){
  const lines = [header].concat(rows).map(r=>r.map(csvCell).join(';'));
  downloadFile(name, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
}
const CSV_CMD_HEAD = ['Référence','Client','Article','Tissu','Couleur','Quantité','Date commande','Livraison prévue','Urgent','Responsable','Total (DA)','Découpe','Confection','Emballage','Quantité reçue','Payé (DA)','Reste (DA)','Conso globale (kg)'];
function parseCSV(text){
  text = String(text||'').replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.split(';').length>=first.split(',').length && first.indexOf(';')>=0) ? ';' : (first.indexOf('\t')>=0 ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur += ch;
    } else if(ch==='"') q = true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r' && text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else cur += ch;
  }
  row.push(cur); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function normKey(h){ return String(h||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function csvDate(v){
  v = String(v||'').trim(); if(!v) return '';
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(v); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
function csvToCommandes(rows){
  if(rows.length<2) return {list:[], skipped:0, error:'Le fichier ne contient pas de lignes de commandes.'};
  const keys = rows[0].map(normKey);
  const idx = names => { for(const n of names){ const i = keys.indexOf(n); if(i>=0) return i; } return -1; };
  const col = {
    reference: idx(['reference','ref']), client: idx(['client']), article: idx(['article','produit']), tissu: idx(['tissu']), couleur: idx(['couleur']),
    quantite: idx(['quantite','qte','quantite pieces']), dateCommande: idx(['date commande','date de commande']), liv: idx(['livraison prevue','date de livraison prevue','livraison']),
    urgent: idx(['urgent']), resp: idx(['responsable','commercial']), total: idx(['total da','total','montant total da','montant total'])
  };
  if(col.client<0 && col.article<0 && col.reference<0) return {list:[], skipped:0, error:'Colonnes non reconnues. Utilise le fichier « Exporter les commandes (CSV) » comme modèle.'};
  const have = new Set((DATA.commandes||[]).map(c=>String(c.reference||'').trim().toLowerCase()));
  const list = []; let skipped = 0;
  rows.slice(1).forEach((r,i)=>{
    const g = k => col[k]>=0 ? String(r[col[k]]||'').trim() : '';
    if(!g('client') && !g('article') && !g('quantite')){ skipped++; return; }
    const ref = g('reference');
    if(ref && (have.has(ref.toLowerCase()))){ skipped++; return; }
    if(ref) have.add(ref.toLowerCase());
    const c = blankCommande();
    c.id = 'cmd_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5);
    c.reference = ref || '';   // numérotée plus tard si vide
    c.client = g('client'); c.article = g('article'); c.tissu = g('tissu'); c.couleur = g('couleur');
    const q = parseFloat(g('quantite').replace(/\s/g,'').replace(',','.')); c.quantite = isNaN(q) ? '' : q;
    c.dateCommande = csvDate(g('dateCommande')) || todayISO(); c.dateLivraisonPrevue = csvDate(g('liv'));
    c.urgent = /^(oui|yes|1|true|x)$/i.test(g('urgent'));
    const rn = g('resp').toLowerCase();
    const com = rn ? (DATA.people||[]).find(p=>p.role==='commercial' && (p.name||'').toLowerCase()===rn) : null;
    c.commercialId = com ? com.id : '';
    const t = parseFloat(g('total').replace(/\s/g,'').replace(',','.')); c.paiement = {total: isNaN(t)?'':t, versements:[]};
    list.push(c);
  });
  return {list:list, skipped:skipped, error:''};
}
function readFileText(file){
  return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(String(fr.result||'')); fr.onerror = ()=>rej(new Error('lecture')); fr.readAsText(file, 'utf-8'); });
}
function mergeData(inc){
  const rep = {added:{}, ignored:{}};
  function mergeArr(key, uniqFn){
    DATA[key] = DATA[key] || []; const have = new Set(DATA[key].map(uniqFn)); let a=0, ig=0;
    (Array.isArray(inc[key])?inc[key]:[]).forEach(x=>{ const u = uniqFn(x); if(x && !have.has(u)){ DATA[key].push(x); have.add(u); a++; } else ig++; });
    rep.added[key]=a; rep.ignored[key]=ig;
  }
  mergeArr('catalogue', x=>x.id);
  mergeArr('people', x=>x.id);
  mergeArr('messages', x=>x.id);
  mergeArr('evaluations', x=>x.id);
  // commandes : par id ET par référence
  DATA.commandes = DATA.commandes || [];
  const ids = new Set(DATA.commandes.map(c=>c.id)), refs = new Set(DATA.commandes.map(c=>String(c.reference||'').trim().toLowerCase()));
  let a=0, ig=0;
  (Array.isArray(inc.commandes)?inc.commandes:[]).forEach(c=>{
    const r = String(c.reference||'').trim().toLowerCase();
    if(c && !ids.has(c.id) && !(r && refs.has(r))){ DATA.commandes.push(c); ids.add(c.id); if(r) refs.add(r); a++; } else ig++;
  });
  rep.added.commandes=a; rep.ignored.commandes=ig;
  // listes : on ajoute ce qui manque
  if(inc.lists){
    DATA.lists = DATA.lists || {tailles:[], tissus:{}};
    (inc.lists.tailles||[]).forEach(t=>{ if(DATA.lists.tailles.indexOf(t)<0) DATA.lists.tailles.push(t); });
    Object.keys(inc.lists.tissus||{}).forEach(t=>{
      DATA.lists.tissus[t] = DATA.lists.tissus[t] || [];
      (inc.lists.tissus[t]||[]).forEach(c=>{ if(DATA.lists.tissus[t].indexOf(c)<0) DATA.lists.tissus[t].push(c); });
    });
  }
  return rep;
}

// Barre « Import / Export » affichée en haut de chaque case admin.
// exports : [{label, fn}]   imports : [{label, accept, onFile(file)}]
function ioBar(exports, imports){
  const bar = el('<div class="io-bar"><span class="io-lbl">Import / Export :</span></div>');
  (exports||[]).forEach(x=>{
    const b = el('<button class="btn small"></button>'); b.textContent = '⬇ ' + x.label; b.onclick = x.fn; bar.appendChild(b);
  });
  (imports||[]).forEach(x=>{
    const l = el('<label class="btn small" style="display:inline-block;cursor:pointer;"></label>'); l.textContent = '⬆ ' + x.label;
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = x.accept || '.csv,text/csv'; inp.style.display = 'none';
    inp.onchange = ()=>{ const f = inp.files[0]; inp.value = ''; if(f) x.onFile(f); };
    l.appendChild(inp); bar.appendChild(l);
  });
  return bar;
}
// lit un CSV et renvoie {keys, rows, col(names...) , get(row,names...)}
async function readCSVFile(file){
  const rows = parseCSV(await readFileText(file));
  if(rows.length < 2) throw new Error('vide');
  const keys = rows[0].map(normKey);
  const idx = names => { for(const n of names){ const i = keys.indexOf(n); if(i>=0) return i; } return -1; };
  return {keys:keys, rows:rows.slice(1), idx:idx, get:(r,names)=>{ const i = idx(names); return i>=0 ? String(r[i]||'').trim() : ''; }};
}
function openImport(name, headline, preview, applyLabel, apply){
  view.importModal = {type:'generic', name:name, headline:headline, preview:preview, applyLabel:applyLabel, apply:apply};
  render();
}
function importFail(msg){ alert(msg || 'Impossible de lire ce fichier. Utilise un fichier CSV exporté depuis cette même case comme modèle.'); }
function num(v){ const n = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isNaN(n) ? null : n; }

function importVersementsFile(f){
  readCSVFile(f).then(d=>{
    if(d.idx(['reference','ref'])<0 || d.idx(['montant da','montant'])<0) throw new Error('col');
    const todo = []; let skipped = 0;
    d.rows.forEach(r=>{
      const ref = d.get(r,['reference','ref']).toLowerCase();
      const m = num(d.get(r,['montant da','montant']));
      const cs = (DATA.commandes||[]).filter(c=>String(c.reference||'').trim().toLowerCase()===ref);

      if(!c || !m || m<=0){ skipped++; return; }

      const dup = (c.paiement && c.paiement.versements || []).some(v=>v.date===date && Number(v.montant)===m && (v.note||'')===note) || todo.some(t=>t.c===c && t.v.date===date && t.v.montant===m && t.v.note===note);
      if(dup){ skipped++; return; }
      todo.push({c:c, v:{id:'v_'+Date.now()+'_'+todo.length+'_'+Math.random().toString(36).slice(2,5), date:date, montant:m, note:note}});
    });
    if(!todo.length){ alert('Aucun nouveau versement à importer ('+skipped+' ligne(s) ignorée(s) : référence inconnue, montant vide ou versement déjà présent).'); return; }
    openImport(f.name, todo.length+' versement(s) à ajouter'+(skipped?' · '+skipped+' ignoré(s)':'')+'.', todo.slice(0,6).map(t=>t.c.reference+' · '+fmtDate(t.v.date)+' · '+fmtDA(t.v.montant)+(t.v.note?' · '+t.v.note:'')), 'Importer ces versements', ()=>{
      todo.forEach(t=>{ t.c.paiement = t.c.paiement || {total:'', versements:[]}; t.c.paiement.versements = t.c.paiement.versements || []; t.c.paiement.versements.push(t.v); });
      return todo.length+' versement(s) importé(s)';
    });
  }).catch(()=>importFail());
}

function importListesFile(f){

    const add = {tailles:[], tissus:[], couleurs:[]};

      const type = normKey(d.get(r,['type'])), val = d.get(r,['valeur']), tis = d.get(r,['tissu']);

      if(type==='taille' && L.tailles.indexOf(val)<0 && add.tailles.indexOf(val)<0) add.tailles.push(val);

      else if(type==='couleur' && tis){
        const val2 = val.toUpperCase();
        if(!(L.tissus[tis]||[]).includes(val2) && !add.couleurs.some(x=>x[0]===tis && x[1]===val2)) add.couleurs.push([tis,val2]);
      }
    });

      add.tailles.forEach(t=>L.tailles.push(t));
      add.tissus.forEach(t=>{ L.tissus[t] = L.tissus[t] || []; });
      add.couleurs.forEach(x=>{ L.tissus[x[0]] = L.tissus[x[0]] || []; L.tissus[x[0]].push(x[1]); });
      return n+' élément(s) importé(s)';
    });
  }).catch(()=>importFail());
}

function importAccesFile(f){
  readCSVFile(f).then(d=>{
    if(d.idx(['nom','name'])<0 || d.idx(['role'])<0) throw new Error('col');
    const haveE = new Set((DATA.people||[]).map(p=>String(p.email||'').trim().toLowerCase()).filter(Boolean));
    const haveN = new Set((DATA.people||[]).map(p=>String(p.name||'').trim().toLowerCase()));
    const list = []; const skip = [];
    d.rows.forEach((r,i)=>{
      const name = d.get(r,['nom','name']), email = d.get(r,['email']), code = d.get(r,['code']).replace(/\s/g,'');
      const roleKey = normKey(d.get(r,['role']));
      const role = ROLE_FROM_TEXT[roleKey];
      if(!name){ return; }
      if(!role){ skip.push(name+' (rôle inconnu)'); return; }
      if(!/^\d{4}$/.test(code)){ skip.push(name+' (code à 4 chiffres manquant)'); return; }
      if((email && haveE.has(email.toLowerCase())) || haveN.has(name.toLowerCase())){ skip.push(name+' (existe déjà)'); return; }
      if(email) haveE.add(email.toLowerCase()); haveN.add(name.toLowerCase());
      list.push({id:'p_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,5), name:name, email:email, role:role, code:code, active:!/^(non|no|0|false)$/i.test(d.get(r,['actif']))});
    });
    if(!list.length){ alert('Aucune personne à importer.'+(skip.length?'\n'+skip.slice(0,6).join('\n'):'')); return; }
    openImport(f.name, list.length+' personne(s) à ajouter'+(skip.length?' · '+skip.length+' ignorée(s)':'')+'.', list.map(p=>p.name+' · '+(ROLE_LABEL[p.role]||p.role)).concat(skip.slice(0,4).map(s=>'⚠ ignoré : '+s)), 'Importer ces accès', ()=>{
      list.forEach(p=>DATA.people.push(p));
      return list.length+' accès importé(s)';
    });
  }).catch(()=>importFail());
}
