function trClientStats(c){
  const k = normName(c.nom); let n=0, ca=0, paye=0, kg=0;
  TR().ventes.forEach(v=>{ if(normName(v.client)===k){ n++; ca += trNum(v.qte)*trNum(v.prixKg); paye += trNum(v.paye); kg += trNum(v.qte); } });
  return {n:n, ca:ca, paye:paye, reste:ca-paye, kg:kg};
}
function trEnsureClient(nom){
  nom = String(nom||'').trim(); if(!nom) return;
  const t = TR();
  if(t.clients.some(c=>normName(c.nom)===normName(nom))) return;
  t.clients.push({id:'ct_'+Date.now()+Math.floor(Math.random()*1000), ref:trNextRef('CT', t.clients, 3), nom:nom, tel:'', adresse:'', wilaya:'', commune:'', note:'', creeLe:new Date().toISOString()});
}
function trDelai(p){
  if(!p.finPrevue) return null;
  if(p.statut==='Terminé' && p.finDate){ const r = psDays(p.finPrevue, p.finDate); return {done:true, late:r>0, jours:r, txt: r>0 ? '⚠ fini avec '+r+' j de retard' : (r<0 ? '✓ fini '+(-r)+' j en avance' : '✓ fini à temps')}; }
  const r = psDays(todayISO(), p.finPrevue);
  return {done:false, late:r<0, jours:r, txt: r<0 ? '⚠ '+(-r)+' j de retard' : (r===0 ? 'à finir aujourd\'hui' : 'reste '+r+' j')};
}
function trEvalCfg(){ const t = TR(); t.evalCfg = t.evalCfg || {}; return {dechet: t.evalCfg.dechet!=null && t.evalCfg.dechet!=='' ? trNum(t.evalCfg.dechet) : 5, perte: t.evalCfg.perte!=null && t.evalCfg.perte!=='' ? trNum(t.evalCfg.perte) : 10}; }
function trDechet(p){ const fil = (p.fils||[]).reduce((a,u)=>a+trNum(u.qte),0); const q = trNum(p.qteProduite); return (fil && q) ? 100*(fil-q)/fil : null; }
function trPerte(p){ const q = trNum(p.qteProduite), f = trNum(p.qteFinie); return (p.dateStock && q && f) ? 100*(q-f)/q : null; }
function trEvalStats(lots){
  const cfg = trEvalCfg();
  const fin = lots.filter(p=>p.statut==='Terminé');
  const wd = fin.filter(p=>p.finPrevue && p.finDate); const ontime = wd.filter(p=>!trDelai(p).late);
  const wdc = fin.filter(p=>trDechet(p)!==null); const okd = wdc.filter(p=>trDechet(p)<=cfg.dechet);
  const wpe = lots.filter(p=>trPerte(p)!==null); const okp = wpe.filter(p=>trPerte(p)<=cfg.perte);
  const pD = wd.length ? 100*ontime.length/wd.length : null, pQ = wdc.length ? 100*okd.length/wdc.length : null, pP = wpe.length ? 100*okp.length/wpe.length : null;
  const parts = [pD,pQ].filter(x=>x!==null);
  const score = parts.length ? parts.reduce((a,b)=>a+b,0)/parts.length : null;
  const dMoy = wdc.length ? wdc.reduce((a,p)=>a+trDechet(p),0)/wdc.length : null;
  const pMoy = wpe.length ? wpe.reduce((a,p)=>a+trPerte(p),0)/wpe.length : null;
  return {fin:fin.length, wd:wd.length, ontime:ontime.length, pD:pD, wdc:wdc.length, okd:okd.length, pQ:pQ, dMoy:dMoy, wpe:wpe.length, okp:okp.length, pP:pP, pMoy:pMoy, stars: score===null ? null : Math.round(score/20*10)/10, cfg:cfg};
}

// ---- Calculateur de bénéfice ----
function trCalcBox(){
  const c = view.trCalc = view.trCalc || {cle:'', qte:'', prix:'', cout:'', marge:'20'};
  const box = el('<div class="bk-card" style="margin-bottom:14px;"><div class="bk-title">Calculateur de bénéfice</div></div>');
  const st = trFiniStock();
  const g = el('<div class="tr-calc"></div>');
  function cell(label, node){ const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>')); w.appendChild(node); g.appendChild(w); }
  const s = document.createElement('select');
  const o0 = document.createElement('option'); o0.value=''; o0.textContent='— Choisir un tissu —'; s.appendChild(o0);
  st.forEach(x=>{ const k = trFiniKey(x.tissu,x.couleur); const o=document.createElement('option'); o.value=k; o.textContent=x.tissu+(x.couleur?' '+x.couleur:'')+' ('+trKg(x.stock)+')'; if(k===c.cle) o.selected=true; s.appendChild(o); });
  function num(key, ph){ const i=document.createElement('input'); i.type='number'; i.step='any'; i.placeholder=ph||''; i.value=c[key]; i.oninput=()=>{ c[key]=i.value; if(key==='cout') c.coutManuel=true; out(); }; return i; }
  const iCout = num('cout','auto');
  s.onchange = ()=>{ c.cle = s.value; const x = st.find(y=>trFiniKey(y.tissu,y.couleur)===c.cle); c.coutManuel=false; const k = x ? trCoutMoyenFini(x.tissu,x.couleur) : 0; c.cout = k ? String(Math.round(k*100)/100) : ''; iCout.value = c.cout; out(); };
  cell('Tissu en stock', s); cell('Quantité (kg)', num('qte')); cell('Prix de vente / kg (DA)', num('prix')); cell('Coût de revient / kg (DA)', iCout); cell('Marge voulue (%)', num('marge'));
  box.appendChild(g);
  const res = el('<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;"></div>');
  box.appendChild(res);
  function out(){
    const q = trNum(c.qte), p = trNum(c.prix), k = trNum(c.cout), mg = trNum(c.marge);
    const ca = q*p, cout = q*k, ben = ca-cout, marge = ca ? 100*ben/ca : 0;
    const conseil = (mg<100 && k) ? k/(1-mg/100) : 0;
    const chip = (l,v,col)=>'<div style="border:2px solid #001D51;border-radius:12px;padding:6px 12px;background:'+(col||'#fff')+';"><div style="font-size:11px;">'+l+'</div><div style="font-weight:800;">'+v+'</div></div>';
    res.innerHTML = chip('Chiffre d\'affaires', fmtDA(ca)) + chip('Coût total', fmtDA(cout)) + chip('Bénéfice', fmtDA(ben), ben>=0?'#37D6A5':'#FF5A4D') + chip('Marge', marge.toFixed(1)+' %') + chip('Prix conseillé pour '+mg+' %', conseil?fmtDA(Math.ceil(conseil))+' / kg':'—', '#FFC933');
  }
  out();
  if(!st.length) box.appendChild(el('<div style="font-size:12px;opacity:.75;margin-top:6px;">Pas encore de tissu fini en stock : tu peux quand même saisir un coût à la main.</div>'));
  return box;
}

    if(type==='mvt' && !(trNum(data.qte)>0)){ alert('Indique une quantité.'); return; }
    if(type==='mvt' && data.type==='sortie' && trNum(data.qte) > trFilStock(data.filId).stock + (mode==='edit' ? trNum((t.mvtFil.find(x=>x.id===data.id)||{}).qte) : 0)){ if(!confirm('Attention : la sortie dépasse le stock disponible. Continuer ?')) return; }
    if(type==='prod'){
      if(!String(data.tissu||'').trim()){ alert('Indique le tissu produit.'); return; }
      data.tissu = String(data.tissu).trim().toUpperCase(); data.couleur = String(data.couleur||'').trim().toUpperCase();
      data.fils = (data.fils||[]).filter(u=>u.filId && trNum(u.qte)>0);
      if(data.statut==='Terminé' && !trNum(data.qteProduite)){ alert('Indique la quantité produite pour terminer le lot.'); return; }
      const old = t.prods.find(x=>x.id===data.id);
      const over = data.fils.filter(u=>trNum(u.qte) > trFilStock(u.filId).stock + (old ? (old.fils||[]).filter(o=>o.filId===u.filId).reduce((a,o)=>a+trNum(o.qte),0) : 0));
      if(over.length && !confirm('Attention : pas assez de fil en stock pour '+over.map(u=>trFilLabel(trFil(u.filId))).join(', ')+'. Continuer ?')) return;
      if(data.statut==='Terminé' && !data.finDate){ data.finDate = todayISO(); data.termineePar = view.personId; }

    if(type==='stock'){
      if(!(trNum(data.qteFinie)>0)){ alert('Indique la quantité finie.'); return; }
      const p = t.prods.find(x=>x.id===data.id);
      if(p){ p.qteFinie = data.qteFinie; p.couleurFinie = String(data.couleurFinie||'').trim().toUpperCase(); p.dateStock = data.dateStock || todayISO(); p.coutKg = Math.round(trLotCout(p).kg*100)/100; }

    }
    if(type==='ajust'){ if(!String(data.tissu||'').trim() || !trNum(data.qte)){ alert('Indique le tissu et la quantité.'); return; } data.tissu=String(data.tissu).trim().toUpperCase(); data.couleur=String(data.couleur||'').trim().toUpperCase(); }

      data.client = String(data.client).trim(); trEnsureClient(data.client);

    delete data._coutManuel;

    if(i>=0) arr[i] = data; else arr.push(data);

    saveState({client:'Client '+data.nom+' enregistré', fil:'Fil enregistré', mvt:'Mouvement de fil enregistré', prod:'Lot '+data.ref+' enregistré', ajust:'Stock tissu fini ajusté', vente:'Vente '+data.ref+' enregistrée'}[type]);
  };
  actions.appendChild(cancel); if(del) actions.appendChild(del); actions.appendChild(save);
  m.appendChild(actions);
  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.tricoModal=null; render(); } };
  return overlay;
}

function psStepDefs(j, over){
  const t = psTechs(j); const S = k=>(over && over[k]) || PS_TECH[k].steps;
  if(t.length===1){ const st = S(t[0]); return st.map((s,i)=>({label:s, key:(i>0 && i<st.length-3) ? t[0]+'|'+s : s})); }
  const base = S(t[0]); const out = [{label:base[0], key:base[0]}];
  t.forEach(k=>{ const st = S(k); st.slice(1, st.length-3).forEach(s=>out.push({label:PS_TECH[k].label+' · '+s, key:k+'|'+s})); });
  base.slice(-3).forEach(s=>out.push({label:s, key:s}));
  return out;
}
function psSteps(j){ return psStepDefs(j).map(x=>x.label); }
// V77 : nouvelle étape « DTF prête » après Poudrage & cuisson → on recale les commandes DTF déjà en cours
const PS_STEPS_V = 2;
const PS_DTF_STEPS_V1 = ['Maquette / BAT','Impression film','Poudrage & cuisson','Pressage','Contrôle','Terminé','Envoyée'];
function psMigrateSteps(){
  let n = 0;
  (((DATA.perso||{}).jobs)||[]).forEach(j=>{
    if(Number(j.stepsV||1) >= PS_STEPS_V) return;
    if(psHas(j,'dtf')){
      const oldDefs = psStepDefs(j, {dtf:PS_DTF_STEPS_V1}); const nk = psStepDefs(j).map(x=>x.key);
      const remap = obj=>{ const out = {}; Object.keys(obj||{}).forEach(i=>{ const d0 = oldDefs[Number(i)]; const ni = d0 ? nk.indexOf(d0.key) : -1; if(ni>=0) out[ni] = obj[i]; }); return out; };
      const cur = oldDefs[Number(j.etape)||0]; const ne = cur ? nk.indexOf(cur.key) : -1;
      if(ne>=0) j.etape = ne;
      j.etapesDates = remap(j.etapesDates);
      if(j.etapesPar) j.etapesPar = remap(j.etapesPar);
    }
    j.stepsV = PS_STEPS_V; n++;
  });
  return n;
}

function psEtape(j){ const st = psSteps(j); const i = Math.max(0, Math.min(st.length-1, Number(j.etape)||0)); return {i:i, label:st[i], last:st.length-1}; }

function psEvalStats(jobs){

  return {fin:fin.length, wd:wd.length, ontime:ontime.length, pD:pD, retardMoy: lates.length ? lates.reduce((a,j)=>a+psDelai(j).jours,0)/lates.length : 0, rated:rated.length, sat:sat.length, pS:pS, score:score, stars: score===null ? null : Math.round(score/20*10)/10};

// prix conseillé selon les tarifs
function psPrix(technique, zones, tf){
  tf = tf || PS().tarifs; let unit = 0, fixe = 0;
  (zones||[]).forEach(z=>{
    const L = trNum(z.largeur), H = trNum(z.hauteur);
    const tq = (z.tech && PS_TECH[z.tech] && z.tech!==technique && z._multi!==false) ? z.tech : technique;
    if(tq==='dtf'){ unit += Math.max(trNum(tf.dtfMin), L*H*trNum(tf.dtfCm2)) + trNum(tf.dtfPose); }
    if(tq==='broderie'){ unit += Math.max(trNum(tf.brodMin), trNum(z.points)/1000*trNum(tf.brod1000)); fixe += trNum(tf.brodProg); }
    if(tq==='serigraphie'){ const nc = Math.max(1, Math.round(trNum(z.couleurs))||1); unit += Math.max(trNum(tf.seriMin), nc*trNum(tf.seriCouleur)); fixe += nc*trNum(tf.seriEcran); }
  });
  return {unit:Math.round(unit*100)/100, fixe:Math.round(fixe*100)/100};
}

    const total = psTotal(j), rest = total - trNum(j.paye);

      esc(j.article||'—')+(j.couleurSupport?'<br><span style="font-size:11px">'+esc(j.couleurSupport)+'</span>':''), esc(j.quantite||'—'), psZonesText(j),
      (()=>{ const dl = psDelai(j); if(!dl) return '—'; return fmtDate(j.finPrevue)+'<br><span style="font-size:11px;font-weight:700;color:'+(dl.late?'#E0392D':(dl.done?'#1E7A34':'#001D51'))+'">'+dl.txt+'</span>'; })(),
      j.dateLivraison ? '<span style="'+(!psDone(j) && j.dateLivraison<todayISO()?'color:#E0392D;font-weight:800':'')+'">'+fmtDate(j.dateLivraison)+'</span>' : '—',

      trActions([next, trBtn('Afficher', ()=>{ view.psView = j.id; render(); }), trBtn('Modifier', ()=>{ view.psModal = {type:'job', mode:'edit', data:JSON.parse(JSON.stringify(j))}; render(); })])];
  })));
}

// ---- Tableau de bord de suivi ----
const PS_BOARD_COLS = ['Maquette / BAT','Préparation','Production','Finition','Contrôle','Terminé (à envoyer)','Envoyée (pas reçue)'];
function psPanelBoard(panel){
  const p = PS(); const body = trSection(panel, 'Tableau de bord — suivi des commandes');
  view.perso.boardTech = view.perso.boardTech || '';
  const row = el('<div class="add-row" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;"></div>');
  [['','Toutes']].concat(Object.keys(PS_TECH).map(k=>[k,PS_TECH[k].label])).forEach(([v,l])=>row.appendChild(trBtn(l, ()=>{ view.perso.boardTech = v; render(); }, view.perso.boardTech===v)));
  body.appendChild(row);
  const jobs = p.jobs.filter(j=>!view.perso.boardTech || psHas(j,view.perso.boardTech));
  const actifs = jobs.filter(j=>!psLivre(j) || !j.recuLe);
  const today = todayISO(), in7 = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const due = j=>j.finPrevue || j.dateLivraison || '';
  const enRetard = actifs.filter(psRetard);
  const auj = actifs.filter(j=>!psDone(j) && due(j)===today);
  const semaine = actifs.filter(j=>!psDone(j) && due(j)>today && due(j)<=in7);
  const pcs = actifs.filter(j=>!psDone(j)).reduce((a,j)=>a+trNum(j.quantite),0);
  const g = el('<div class="kpi-row"></div>');
  g.appendChild(el('<div class="kpi'+(enRetard.length?' alert':'')+'"><div class="num">'+enRetard.length+'</div><div class="label">En retard</div></div>'));
  g.appendChild(el('<div class="kpi" style="background:#FFC933;"><div class="num">'+auj.length+'</div><div class="label">À finir aujourd\'hui</div></div>'));
  g.appendChild(el('<div class="kpi" style="background:#BFD2FF;"><div class="num">'+semaine.length+'</div><div class="label">À finir dans les 7 jours</div></div>'));
  g.appendChild(el('<div class="kpi"><div class="num">'+pcs+'</div><div class="label">Pièces en production</div></div>'));
  body.appendChild(g);
  // charge par technique
  const charge = el('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 14px;"></div>');
  Object.keys(PS_TECH).forEach(k=>{ const js = p.jobs.filter(j=>psHas(j,k) && !psDone(j)); const q = js.reduce((a,j)=>a+trNum(j.quantite),0); const late = js.filter(psRetard).length;
    charge.appendChild(el('<div style="border:2px solid #001D51;border-radius:12px;padding:8px 12px;background:'+PS_TECH[k].color+';"><b>'+PS_TECH[k].label+'</b><div style="font-size:13px;">'+js.length+' commande(s) · '+q+' pièces'+(late?' · <b style="color:#A42834">'+late+' en retard</b>':'')+'</div></div>')); });
  body.appendChild(charge);
  // colonnes (kanban)
  const board = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding-bottom:8px;"></div>');
  PS_BOARD_COLS.forEach((title, i)=>{
    const col = el('<div data-col="1" style="background:#FFF6E6;border:2px solid #001D51;border-radius:14px;padding:8px;min-height:120px;"></div>');
    const items = actifs.filter(j=>psBoardCol(j)===i).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0) || String(due(a)||'9999').localeCompare(String(due(b)||'9999')));
    col.appendChild(el('<div style="font-weight:800;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;"><span>'+title+'</span><span class="icon-tile-badge" style="position:static;">'+items.length+'</span></div>'));
    if(!items.length) col.appendChild(el('<div style="font-size:12px;opacity:.5;">—</div>'));
    items.forEach(j=>{
      const dl = psDelai(j); const late = psRetard(j);
      const card = el('<button style="display:block;width:100%;text-align:left;border:2px solid #001D51;border-radius:10px;padding:6px 8px;margin-bottom:6px;background:'+(late?'#FFE1DE':'#fff')+';cursor:pointer;font-family:inherit;color:#001D51;box-shadow:2px 2px 0 #001D51;"></button>');
      card.innerHTML = '<div style="display:flex;justify-content:space-between;gap:4px;"><b>'+esc(j.ref)+psEchTag(j,true)+'</b><span class="pill" style="background:'+psTechColor(j)+';color:#001D51;font-size:10px;padding:1px 6px;">'+psTechLabel(j)+'</span></div>'
        +'<div style="font-size:12px;">'+esc(j.client||'')+' · '+esc(j.quantite||'')+' pcs</div>'
        +(psCommercialName(j)?'<div>'+psComTag(j,true)+'</div>':'')
        +'<div style="font-size:11px;opacity:.85;">'+esc(psStepLabel(j, psEtape(j).i))+'</div>'
        +(dl?'<div style="font-size:11px;font-weight:700;color:'+(dl.late?'#E0392D':(dl.done?'#1E7A34':'#001D51'))+'">'+dl.txt+'</div>':(j.dateLivraison?'<div style="font-size:11px;">livraison '+fmtDate(j.dateLivraison)+'</div>':''))
        +(j.urgent?'<div style="font-size:10px;font-weight:800;color:#E0392D;">URGENT</div>':'');
      card.onclick = ()=>{ view.psView = j.id; render(); };
      col.appendChild(card);
    });
    board.appendChild(col);
  });
  body.appendChild(board);
  body.appendChild(el('<div style="font-size:12px;opacity:.75;">Clique sur une carte pour ouvrir la commande. Les cartes en rose sont en retard. Les commandes envoyées et reçues ne s\'affichent plus.</div>'));
}

    if(zt==='broderie') r.appendChild(inp('points','nb points', 90));

function renderPsView(){
  const j = psJob(view.psView);

  const close = ()=>{ view.psView=null; render(); };
  if(!j){ m.appendChild(el('<h2>Commande introuvable</h2>')); }
  else{

    psSteps(j).forEach((s,i)=>{ const done = i<=e.i; fr.appendChild(el('<div style="border:2px solid #001D51;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:'+(i===e.i?'#FFC933':(done?'#37D6A5':'#fff'))+';">'+(i+1)+'. '+esc(psStepLabel(j,i))+((j.etapesDates||{})[i] && i<=e.i?' · '+fmtDT(j.etapesDates[i]):'')+'</div>')); });
    m.appendChild(fr);

    grid.appendChild(el('<div style="text-align:center;border:3px solid #001D51;border-radius:14px;padding:10px;background:#fff;">'+qrSvg(psUrl(j),150)+'<div style="font-weight:800;margin-top:4px;">'+esc(j.ref)+'</div></div>'));
    const total = psTotal(j);
    const info = el('<div style="flex:1;min-width:220px;font-size:14px;line-height:1.7;"></div>');
    info.innerHTML = '<b>Client :</b> '+esc(j.client||'—')+(j.cmdRef?' · commande confection <b>'+esc(j.cmdRef)+'</b>':'')+(j.crRef?' · <b style="background:#D9C8FF;border:2px solid #001D51;border-radius:999px;padding:0 8px;">Prototype Créa '+esc(j.crRef)+'</b>':'')
      +'<br><b>Commercial :</b> '+(psCommercialName(j)?'<b style="background:#FFC933;border:2px solid #001D51;border-radius:999px;padding:0 8px;">'+esc(psCommercialName(j))+'</b>':'aucun (client direct)')
      +'<br><b>Article :</b> '+esc(j.article||'—')+(j.couleurSupport?' · '+esc(j.couleurSupport):'')+' · <b>'+esc(j.quantite||'0')+'</b> pièces'
      +'<br><b>Emplacements :</b><br>'+psZonesText(j)
      +'<br><b>Commandée le :</b> '+fmtDate(j.date)+(j.dateLivraison?' · <b>Livraison :</b> <span style="'+(psRetard(j)?'color:#E0392D;font-weight:800':'')+'">'+fmtDate(j.dateLivraison)+'</span>':'')
      +(j.finPrevue?(()=>{ const dl = psDelai(j); return '<br><b>Fin prévue le :</b> '+fmtDate(j.finPrevue)+' · <b style="color:'+(dl.late?'#E0392D':(dl.done?'#1E7A34':'#001D51'))+'">'+dl.txt+'</b>'; })():'')
      +(j.termineLe?'<br><b>Terminée le :</b> '+fmtDT(j.termineLe):'')
      +(j.envoiLe?'<br><b>Envoyée '+PS_DEST[j.destination]+' le :</b> '+fmtDT(j.envoiLe)+(j.recuLe?' · <b>reçue le</b> '+fmtDT(j.recuLe):' · <span style="color:#E0392D;font-weight:700;">pas encore reçue</span>'):'')
      +(psMoney()?'<br><b>Prix :</b> '+fmtDA(j.prixUnitaire)+' / pièce'+(trNum(j.fraisFixes)?' + '+fmtDA(j.fraisFixes)+' de frais':'')+' = <b>'+fmtDA(total)+'</b> · payé '+fmtDA(j.paye)+' · <b style="color:'+(total-trNum(j.paye)>0?'#E0392D':'#1E7A34')+'">reste '+fmtDA(total-trNum(j.paye))+'</b>':'')
      +(j.satisfaction?'<br><b>Client :</b> <b style="color:'+(j.satisfaction==='oui'?'#1E7A34':'#E0392D')+'">'+(j.satisfaction==='oui'?'satisfait':'pas satisfait')+'</b>'+(j.satisfactionNote?' — '+esc(j.satisfactionNote):'')+' <span style="font-size:12px">('+fmtDT(j.satisfactionLe)+')</span>':'')
      +(j.notes?'<br><b>Notes :</b> '+esc(j.notes):'');
    grid.appendChild(info);
    m.appendChild(grid);
    if(psLivre(j) && psCanRate(j)){ const rb = el('<div style="margin-top:12px;border:2px dashed #001D51;border-radius:12px;padding:8px 10px;"><div style="font-weight:700;margin-bottom:6px;">'+(j.satisfaction?'Modifier la satisfaction client':'Le client est-il satisfait ?')+'</div></div>'); rb.appendChild(psRateWidget(j)); m.appendChild(rb); }
    { const imgs = psImgs(j); if(imgs.length){ const gw = el('<div style="margin-top:12px;"><div style="font-weight:700;margin-bottom:4px;">Photos / maquettes ('+imgs.length+') <span style="font-size:12px;font-weight:600;opacity:.7;">— clique pour agrandir</span></div></div>'); gw.appendChild(psGallery(imgs, imgs.length>1?150:260)); m.appendChild(gw); } }
  }
  const actions = el('<div class="actions"></div>');
  const cl = el('<button class="btn">Fermer</button>'); cl.onclick = close; actions.appendChild(cl);
  if(j){
    const pr = el('<button class="btn">Imprimer l\'étiquette</button>'); pr.onclick = ()=>psPrintLabel(j); actions.appendChild(pr);
    if(view.role==='admin' || view.role==='personnalisation' || allowedPs(currentPerson()).some(k=>k==='cmd'||PS_TECH[k])){
      const e = psEtape(j);
      if(e.i<e.last-1){ const nx = el('<button class="btn primary">Étape suivante : '+esc(psSteps(j)[e.i+1])+'</button>'); nx.onclick = ()=>psSetEtape(j, e.i+1); actions.appendChild(nx); }
      else if(e.i===e.last-1){ const s1 = el('<button class="btn primary">Vers le commercial</button>'); s1.onclick = ()=>psSendTo(j,'commercial'); const s2 = el('<button class="btn primary" style="background:#37D6A5;">Vers l\'emballage</button>'); s2.onclick = ()=>psSendTo(j,'emballage'); actions.appendChild(s1); actions.appendChild(s2); }
    }
  }
  m.appendChild(actions);
  overlay.appendChild(m);
  overlay.onclick = (ev)=>{ if(ev.target===overlay) close(); };
  return overlay;
}

// ---- Fenêtres de saisie ----
function renderPsModal(){
  const {type, mode, data} = view.psModal; const p = PS();
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal"></div>');
  const titles = {job:(mode==='create'?'Nouvelle commande ':'Commande ')+data.ref, conso: mode==='create'?'Nouvel article':'Article '+data.ref, mvt: data.type==='entree'?'Entrée de stock':'Sortie / utilisation', tarifs:'Tarifs de personnalisation', client: mode==='create'?'Nouveau client':'Client '+(data.ref||'')};
  m.appendChild(el('<h2>'+esc(titles[type])+'</h2>'));
  function frow(fields){ const r = el('<div class="frow"></div>'); fields.forEach(f=>r.appendChild(f)); m.appendChild(r); }
  function field(label, key, opt){
    opt = opt||{}; const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>'));
    const inp = document.createElement('input'); inp.type = opt.type||'text'; if(opt.ph) inp.placeholder=opt.ph; if(opt.list) inp.setAttribute('list', opt.list);
    if(opt.type==='number'){ inp.step='any'; inp.min='0'; }
    inp.setAttribute('data-k', key);
    inp.value = data[key]==null?'':data[key]; inp.oninput = ()=>{ data[key] = inp.value; if(opt.onchange) opt.onchange(); };
    w.appendChild(inp); return w;
  }
  function select(label, key, options, onchange){
    const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>'));
    const s = document.createElement('select');
    options.forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if(String(v)===String(data[key])) o.selected=true; s.appendChild(o); });
    s.onchange = ()=>{ data[key]=s.value; if(onchange) onchange(); }; w.appendChild(s); return w;
  }
  function datalist(id, values){ const dl = document.createElement('datalist'); dl.id=id; values.forEach(v=>{ const o=document.createElement('option'); o.value=v; dl.appendChild(o); }); m.appendChild(dl); }

  if(type==='job'){
    { data.type = data.type || 'commande';
      const tw = el('<div class="ps-type"><label>Type</label></div>'); const rw = el('<div style="display:flex;gap:6px;flex-wrap:wrap;"></div>');
      [['commande','Commande'],['echantillon','Échantillon']].forEach(([v,l])=>{ const b = el('<button type="button" class="ps-type-b'+(data.type===v?' on':'')+(v==='echantillon'?' e':'')+'">'+l+'</button>'); b.onclick = ()=>{ data.type = v; if(v==='echantillon' && !trNum(data.quantite)) data.quantite = 1; render(); }; rw.appendChild(b); });
      tw.appendChild(rw); m.appendChild(tw); }
    datalist('dl-ps-clients', Array.from(new Set(p.clients.map(c=>c.nom).concat((DATA.clients||[]).map(c=>c.nom)))));
    datalist('dl-ps-articles', Array.from(new Set(((DATA.lists||{}).articles||[]).concat((DATA.catalogue||[]).map(c=>c.article)).filter(Boolean))));
    const cmdOpts = [['','— Aucune (client extérieur) —']].concat((DATA.commandes||[]).slice().reverse().map(c=>[c.id, c.reference+' · '+(c.client||'')+' · '+(c.article||'')+' · '+(c.quantite||0)+' pcs']));
    frow([select('Commande confection liée', 'cmdId', cmdOpts, ()=>{
      const c = (DATA.commandes||[]).find(x=>x.id===data.cmdId);
      if(c){ data.cmdRef = c.reference; if(c.commercialId){ data.commercialId = c.commercialId; const cs = m.querySelector('select[data-k=commercialId]'); if(cs) cs.value = c.commercialId; } data.client = c.client||data.client; data.article = c.article||data.article; data.quantite = c.quantite||data.quantite; if(!data.couleurSupport) data.couleurSupport = c.couleur||''; if(!data.dateLivraison && (c.dateLivraisonPrevue||c.dateLivraison)) data.dateLivraison = c.dateLivraisonPrevue||c.dateLivraison; }
      else data.cmdRef = '';
      ['client','article','quantite','couleurSupport','dateLivraison'].forEach(k=>{ const i = m.querySelector('input[data-k='+k+']'); if(i) i.value = data[k]||''; });
    })]);
    { const tw = el('<div></div>'); tw.appendChild(el('<label>Technique(s) * <span style="font-weight:600;opacity:.75;">— coche plusieurs si la commande combine DTF, broderie…</span></label>'));
      const row = el('<div style="display:flex;gap:6px;flex-wrap:wrap;"></div>');
      Object.keys(PS_TECH).forEach(k=>{
        const lb = el('<label class="ps-tchk" style="background:'+(psHas(data,k)?PS_TECH[k].color:'#fff')+';"></label>');
        const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = psHas(data,k);
        cb.onchange = ()=>{
          const list = Object.keys(PS_TECH).filter(x=>x===k ? cb.checked : psHas(data,x));
          if(!list.length){ cb.checked = true; alert('Choisis au moins une technique.'); return; }
          const oldDefs = psStepDefs(data), oldKey = (oldDefs[Number(data.etape)||0]||{}).key, oldDates = data.etapesDates||{};
          (data.zones||[]).forEach(z=>{ z.tech = psZoneTech(data, z); });
          data.techniques = list; data.technique = list[0];
          (data.zones||[]).forEach(z=>{ if(!z.tech || list.indexOf(z.tech)<0) z.tech = list[0]; });
          const nd = psStepDefs(data); const nk = nd.map(x=>x.key); const dates = {};
          oldDefs.forEach((d0,i)=>{ const ni = nk.indexOf(d0.key); if(ni>=0 && oldDates[i]) dates[ni] = oldDates[i]; });
          data.etapesDates = dates; const ne = nk.indexOf(oldKey); data.etape = ne>=0 ? Math.min(ne, nd.length-2) : 0;
          render();
        };
        lb.appendChild(cb); lb.appendChild(document.createTextNode(' '+PS_TECH[k].label)); row.appendChild(lb);
      });
      tw.appendChild(row); frow([tw, field('Client *','client',{list:'dl-ps-clients'})]); }
    frow([field('Article / support','article',{list:'dl-ps-articles', ph:'ex : T-shirt, Hoodie, Casquette'}), field('Couleur du support','couleurSupport',{ph:'ex : Noir'})]);
    frow([field('Quantité (pièces) *','quantite',{type:'number', onchange:()=>upd()}), field('Fin prévue le (délai personnalisation)','finPrevue',{type:'date'})]);
    { const coms = (DATA.people||[]).filter(p=>p.role==='commercial' && (p.active!==false || p.id===data.commercialId));
      if(!data.commercialId && psCommercialId(data)) data.commercialId = psCommercialId(data);
      const cw = select('Commercial qui a fait la commande','commercialId', [['','— Aucun (client direct) —']].concat(coms.map(p=>[p.id, p.name])));
      const cs = cw.querySelector('select'); if(cs) cs.setAttribute('data-k','commercialId');
      frow([field('Date de livraison au client','dateLivraison',{type:'date'}), cw]); }
    const zbox = el('<div style="margin:6px 0 10px;"></div>'); m.appendChild(zbox);
    // maquette
    const mq = el('<div style="margin:6px 0 10px;"></div>'); m.appendChild(mq);
    function drawMq(){
      data.maquettes = psImgs(data).slice(); data.maquette = data.maquettes[0] || '';
      mq.innerHTML = ''; mq.appendChild(el('<label>Photos / maquettes (logo, BAT, emplacement…) — '+PS_MAX_IMGS+' maximum, tu peux en choisir plusieurs à la fois</label>'));

      data.maquettes.forEach((u,i)=>{ const b = el('<div style="position:relative;"><img src="'+u+'" style="height:96px;width:96px;object-fit:cover;border:2px solid #001D51;border-radius:10px;background:#fff;"></div>'); const x = el('<button class="btn small" style="position:absolute;top:2px;right:2px;padding:0 6px;">✕</button>'); x.onclick = ()=>{ data.maquettes.splice(i,1); data.maquette = data.maquettes[0]||''; drawMq(); }; b.appendChild(x); if(i===0) b.appendChild(el('<div style="position:absolute;left:4px;bottom:4px;background:#FFC933;border:1px solid #001D51;border-radius:6px;font-size:10px;font-weight:800;padding:0 4px;">principale</div>')); g.appendChild(b); });

        fi.onchange = async ()=>{ const fs = Array.from(fi.files||[]); const room = PS_MAX_IMGS - data.maquettes.length; if(fs.length>room) alert('Maximum '+PS_MAX_IMGS+' photos : seules les '+room+' premières sont ajoutées.'); for(const f of fs.slice(0, room)){ try{ data.maquettes.push(await resizeImageFileJpeg(f, 900, 0.72)); }catch(e){ alert('Image illisible : '+f.name); } } data.maquette = data.maquettes[0]||''; drawMq(); };
        mq.appendChild(fi);
      } else mq.appendChild(el('<div style="font-size:12px;opacity:.75;">Maximum atteint ('+PS_MAX_IMGS+' photos). Retire une photo pour en ajouter une autre.</div>'));
    }
    drawMq();
    const prixBox = el('<div style="font-weight:800;margin:4px 0 10px;"></div>');
    const upd = ()=>{ const tt = psTotal(data); prixBox.innerHTML = 'Total : '+fmtDA(tt)+'  ·  Reste : <span style="color:'+(tt-trNum(data.paye)>0?'#E0392D':'#1E7A34')+'">'+fmtDA(tt-trNum(data.paye))+'</span>'; };

    const moneyWrap = el('<div></div>');

    const calc = el('<button class="btn small" style="margin:-4px 0 10px;">Calculer le prix avec les tarifs</button>');
    calc.onclick = ()=>{ const pr = psPrix(data.technique, data.zones); data.prixUnitaire = pr.unit; data.fraisFixes = pr.fixe; ['prixUnitaire','fraisFixes'].forEach(k=>{ const i=m.querySelector('input[data-k='+k+']'); if(i) i.value=data[k]; }); upd(); };
    if(psMoney()) m.appendChild(calc);
    if(psMoney()) frow([field('Montant payé (DA)','paye',{type:'number', onchange:upd}), select('Étape','etape', psSteps(data).slice(0,-1).map((s,i)=>[i,(i+1)+'. '+s]))]);
    else frow([select('Étape','etape', psSteps(data).slice(0,-1).map((s,i)=>[i,(i+1)+'. '+s]))]);
    const urg = el('<label style="display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0 8px;"></label>');
    const uc = document.createElement('input'); uc.type='checkbox'; uc.checked=!!data.urgent; uc.onchange=()=>data.urgent=uc.checked; urg.appendChild(uc); urg.appendChild(document.createTextNode('Urgent'));
    m.appendChild(urg);

  }
  if(type==='conso'){

    frow([select('Unité','unite', PS_UNITES.map(u=>[u,u])), field('Couleur','couleur')]);

    if(psMoney()){ const pf = field('Prix par unité (DA)','prixUnit',{type:'number', onchange:updT}); pf.querySelector('label').setAttribute('data-pu','1'); frow([pf, field('Note','note',{ph:'ex : commande PS0003'})]); }
    else frow([field('Note','note',{ph:'ex : commande PS0003'})]);

    m.appendChild(el('<div style="font-weight:800;margin:8px 0 4px;">Broderie</div>'));
    frow([field('Prix pour 1000 points (DA)','brod1000',{type:'number'}), field('Minimum par logo (DA)','brodMin',{type:'number'})]);

    m.appendChild(el('<div style="font-weight:800;margin:8px 0 4px;">Sérigraphie</div>'));

  }

  };

  return overlay;

// ---- Ajouter au catalogue (Confection) ----
function crToCatalogue(x, opts){
  opts = opts || {};
  DATA.catalogue = DATA.catalogue || [];
  const t0 = (x.tissus||[]).find(t=>t.tissu) || {};
  const entry = {id:'prod_'+Date.now(), article:String(x.nom||'').trim().toUpperCase(), tissu:String(t0.tissu||'').trim().toUpperCase(), tailles:(x.tailles||[]).slice(), photo:(x.images||[])[0]||'', photos:(x.images||[]).slice(0, CAT_MAX_PHOTOS), refPatron:'', consoMoyenne:t0.conso||'', consoUnite:t0.unite||'kg', creeLe:new Date().toISOString(), creaRef:x.ref, patron:x.refPatron||''};
  { const ex = x.catalogueId ? (DATA.catalogue||[]).find(p=>p.id===x.catalogueId) : null;
    const libre = r=>r && !(DATA.catalogue||[]).some(p=>p.id!==x.catalogueId && catNormRef(p.refPatron)===catNormRef(r));
    entry.refPatron = (ex && ex.refPatron) ? ex.refPatron : (libre(x.refProduit) ? x.refProduit : (x.refProduit='', nextCatRef()));
    x.refProduit = entry.refPatron; }
  if(x.catalogueId){ const i = DATA.catalogue.findIndex(p=>p.id===x.catalogueId); if(i>=0){ entry.id = x.catalogueId; DATA.catalogue[i] = Object.assign({}, DATA.catalogue[i], entry); } else DATA.catalogue.push(entry); }
  else DATA.catalogue.push(entry);
  // listes : article, tissu, couleurs
  DATA.lists = DATA.lists || {}; DATA.lists.articles = DATA.lists.articles || [];
  if(entry.article && DATA.lists.articles.indexOf(entry.article)<0) DATA.lists.articles.push(entry.article);
  DATA.lists.tissus = DATA.lists.tissus || {};
  (x.tissus||[]).forEach(t=>{ const tt = String(t.tissu||'').trim().toUpperCase(); if(!tt) return; DATA.lists.tissus[tt] = DATA.lists.tissus[tt] || []; const cc = String(t.couleur||'').trim().toUpperCase(); if(cc && DATA.lists.tissus[tt].indexOf(cc)<0) DATA.lists.tissus[tt].push(cc); });
  x.catalogueId = entry.id;
  if(!opts.keepEtape){ x.etape = CR_STEPS.length-1; x.etapesDates = x.etapesDates || {}; x.etapesDates[x.etape] = psNow(); }
  if(!opts.silent) saveState(x.ref+' ajouté au catalogue produits');
}
// produit validé en Créa → il part tout seul dans le catalogue produits (sans changer son étape)
function crAutoCatalogue(x){
  if(!x || Number(x.etape)<5 || !String(x.nom||'').trim()) return false;
  if(x.catalogueId && (DATA.catalogue||[]).some(p=>p.id===x.catalogueId)) return false;
  crToCatalogue(x, {keepEtape:true, silent:true});
  return true;
}

        +'<br>'+(st==='attente'?'<span class="cr-st wait">⏳ En attente du commercial depuis '+fmtDT(x.proto.depuis)+'</span>':st==='valide'?'<span class="cr-st ok">✓ Validé par '+esc(crPersonName(x.proto.decidePar))+' le '+fmtDT(x.proto.decideLe)+'</span>':st==='retouches'?'<span class="cr-st ko">✎ Retouches demandées par '+esc(crPersonName(x.proto.decidePar))+'</span><div class="cr-ph-txt" style="font-size:15px;">'+esc(x.proto.texte||'')+'</div>':'')
        +crProtoHistHtml(x, st==='retouches' || st==='valide');
      m.appendChild(pb);
    }
    if(e.i===3 && x.proto && x.proto.statut==='attente' && (view.role==='admin' || view.role==='commercial')) m.appendChild(crProtoDecisionBox(x));
  }
  const actions = el('<div class="actions" style="flex-wrap:wrap;"></div>');
  const cl = el('<button class="btn">Fermer</button>'); cl.onclick = close; actions.appendChild(cl);
  if(x){
    const pr = el('<button class="btn">Imprimer la fiche</button>'); pr.onclick = ()=>crPrint(x); actions.appendChild(pr);
    const lb = el('<button class="btn">Étiquette QR</button>'); lb.onclick = ()=>crPrintLabel(x); actions.appendChild(lb);
    const cp = el('<button class="btn">Copier le lien de suivi</button>'); cp.onclick = ()=>{ const u = crUrl(x); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(()=>showToast('✓ Lien copié : '+u)).catch(()=>prompt('Lien de suivi à copier :', u)); }; actions.appendChild(cp);
    const e = crEtape(x);
    if(crCanEdit()){
    const md = el('<button class="btn">Modifier</button>'); md.onclick = ()=>{ view.crView=null; view.crModal = {mode:'edit', data:JSON.parse(JSON.stringify(x))}; render(); }; actions.appendChild(md);
    if(e.i===3){
      if(!x.proto || x.proto.statut!=='attente'){ const sd = el('<button class="btn primary">Envoyer le prototype au commercial</button>'); sd.onclick = ()=>{ const n = crSendProto(x); saveState(n ? 'Commercial prévenu' : 'Aucun compte commercial actif'); }; actions.appendChild(sd); }
      else { const rs = el('<button class="btn">Relancer le commercial</button>'); rs.onclick = ()=>{ crNotify(crCommerciaux(x).map(p=>p.id), '🔔 Rappel : le prototype '+(x.nom||'')+' ('+(x.refProduit||x.ref)+') attend ta validation (espace Commercial → Prototypes à valider).', x); saveState('Rappel envoyé au commercial'); }; actions.appendChild(rs); }
    } else if(e.i===4){
      const rf = el('<button class="btn primary">Retouches faites → renvoyer au commercial</button>'); rf.onclick = ()=>crSetEtape(x, 3); actions.appendChild(rf);
    } else if(e.i<6){ const nx = el('<button class="btn primary">Étape suivante : '+esc(CR_STEPS[e.i+1])+'</button>'); nx.onclick = ()=>crSetEtape(x, e.i+1); actions.appendChild(nx); }
    if(e.i>=6){ const ct = el('<button class="btn primary" style="background:#37D6A5;">'+(e.i===6?'Lancer en production':(x.catalogueId?'Mettre à jour le catalogue':'Ajouter au catalogue produits'))+'</button>'); ct.onclick = ()=>{ if(!String(x.nom||'').trim()){ alert('Le produit doit avoir un nom.'); return; } crToCatalogue(x); }; actions.appendChild(ct); }
    }
  }
  m.appendChild(actions);
  overlay.appendChild(m);
  overlay.onclick = (ev)=>{ if(ev.target===overlay) close(); };
  return overlay;
}

// ---- Formulaire nouveau produit ----
function renderCrModal(){
  const {mode, data} = view.crModal; const c = CR();
  const overlay = el('<div class="modal-overlay"></div>');
  const m = el('<div class="modal" style="max-width:820px;"></div>');
  m.appendChild(el('<h2>'+(mode==='create'?'Nouveau produit — fiche de création':'Modifier '+esc(data.ref))+'</h2>'));
  if(!data.refProduit) data.refProduit = nextCatRef();
  m.appendChild(el('<div style="display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 10px;"><span style="border:2px solid #001D51;border-radius:999px;padding:3px 12px;background:#FFC933;font-weight:800;">Référence produit : '+esc(data.refProduit)+'</span><span style="border:2px solid #001D51;border-radius:999px;padding:3px 12px;background:#fff;font-size:12px;">Fiche Créa : '+esc(data.ref)+'</span></div>'));
  const sec = t=>m.appendChild(el('<div style="font-weight:800;margin:12px 0 6px;border-bottom:2px solid #001D51;padding-bottom:2px;">'+t+'</div>'));
  function frow(fields){ const r = el('<div class="frow"></div>'); fields.forEach(f=>r.appendChild(f)); m.appendChild(r); }
  function field(label, key, opt){
    opt = opt||{}; const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>'));
    const inp = document.createElement(opt.area?'textarea':'input'); if(!opt.area) inp.type = opt.type||'text'; else inp.rows = 3;
    if(opt.ph) inp.placeholder=opt.ph; if(opt.list) inp.setAttribute('list', opt.list); if(opt.type==='number'){ inp.step='any'; inp.min='0'; }
    inp.value = data[key]==null?'':data[key]; inp.oninput = ()=>{ data[key] = inp.value; if(opt.onchange) opt.onchange(); };
    w.appendChild(inp); return w;
  }
  function select(label, key, options, onchange){
    const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>'));
    const s = document.createElement('select');
    options.forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if(String(v)===String(data[key])) o.selected=true; s.appendChild(o); });
    s.onchange = ()=>{ data[key]=s.value; if(onchange) onchange(); }; w.appendChild(s); return w;
  }
  const dl = (id, vals)=>{ const d = document.createElement('datalist'); d.id=id; vals.forEach(v=>{ const o=document.createElement('option'); o.value=v; d.appendChild(o); }); m.appendChild(d); };
  dl('dl-cr-col', Array.from(new Set(c.produits.map(x=>x.collection).filter(Boolean))));
  dl('dl-cr-tissus', Object.keys((DATA.lists||{}).tissus||{}));

  sec('1. Identité du produit');
  frow([field('Nom du produit *','nom',{ph:'ex : Hoodie Oversize Signature'}), field('Collection','collection',{list:'dl-cr-col', ph:'ex : Été 2027'})]);
  frow([select('Catégorie','categorie', CR_CATS.map(v=>[v,v])), select('Cible','cible', CR_CIBLES.map(v=>[v,v]))]);
  frow([field('Client (si création sur demande)','client',{ph:'facultatif'}), select('Commercial qui valide le prototype','commercialId', [['','Tous les commerciaux']].concat((DATA.people||[]).filter(p=>p.role==='commercial' && (p.active!==false || p.id===data.commercialId)).map(p=>[p.id, p.name])))]);
  frow([field('Saison','saison',{ph:'ex : Printemps-Été'}), select('Responsable (accès Créa)','responsable', [['','—']].concat((DATA.people||[]).filter(p=>crHasAccess(p) || p.id===data.responsable).map(p=>[p.id, p.name+' ('+(ROLE_LABEL[p.role]||p.role)+')'])))]);
  frow([field('Date objectif (lancement)','dateObjectif',{type:'date'}), select('Étape','etape', CR_STEPS.slice(0,7).map((s,i)=>[i,(i+1)+'. '+s]))]);
  frow([field('Description / idée','description',{area:true, ph:'Style, coupe, détails, inspiration…'})]);

  sec('2. Images (croquis, inspiration, prototype) — 4 maximum');
  const ib = el('<div></div>'); m.appendChild(ib);
  function drawImgs(){
    ib.innerHTML='';
    const g = el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;"></div>');
    (data.images||[]).forEach((u,i)=>{ const b = el('<div style="position:relative;"><img src="'+u+'" style="height:100px;width:100px;object-fit:cover;border:2px solid #001D51;border-radius:10px;background:#fff;"></div>'); const x = el('<button class="btn small" style="position:absolute;top:2px;right:2px;padding:0 6px;">✕</button>'); x.onclick = ()=>{ data.images.splice(i,1); drawImgs(); }; b.appendChild(x); g.appendChild(b); });
    ib.appendChild(g);
    if((data.images||[]).length<4){
      const fi = document.createElement('input'); fi.type='file'; fi.accept='image/*'; fi.multiple = true;
      fi.onchange = async ()=>{ const fs = Array.from(fi.files||[]).slice(0, 4-(data.images||[]).length); for(const f of fs){ try{ data.images.push(await resizeImageFileJpeg(f, 900, 0.72)); }catch(e){ alert('Image illisible : '+f.name); } } drawImgs(); };
      ib.appendChild(fi);
    }
  }
  data.images = data.images || []; drawImgs();

  sec('3. Matières (tissus)');
  const tb = el('<div></div>'); m.appendChild(tb);
  const kbox = el('<div style="font-weight:800;margin:8px 0;"></div>');
  const upd = ()=>{ if(!crMoney()){ kbox.innerHTML=''; return; } const k = crCout(data); kbox.innerHTML = 'Coût de revient : '+fmtDA(k.total)+' / pièce'+(k.pv?' · Marge : <span style="color:'+(k.marge>=0?'#1E7A34':'#E0392D')+'">'+fmtDA(k.marge)+' ('+k.margePct.toFixed(1)+' %)</span>':''); };
  const st = 'padding:6px;border:2px solid #001D51;border-radius:10px;background:#FFF6E6;font-weight:600;';
  function lineEditor(box, arr, cols, blank, addLabel){
    function draw(){
      box.innerHTML='';
      arr.forEach((it,i)=>{
        const r = el('<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center;"></div>');
        cols.forEach(([key, ph, w, type, list])=>{
          if(type==='select'){ const s=document.createElement('select'); s.style.cssText=st+'flex:0 0 '+w+'px;'; list.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; if(v===it[key]) o.selected=true; s.appendChild(o); }); s.onchange=()=>{ it[key]=s.value; upd(); }; r.appendChild(s); return; }
          const x = document.createElement('input'); x.placeholder=ph; x.value=it[key]||''; if(type==='number'){ x.type='number'; x.step='any'; x.min='0'; } if(list) x.setAttribute('list', list);
          x.style.cssText = st+'flex:1 1 '+w+'px;width:'+w+'px;'; x.oninput=()=>{ it[key]=x.value; upd(); }; r.appendChild(x);
        });
        const rm = el('<button class="btn small">✕</button>'); rm.onclick=()=>{ arr.splice(i,1); draw(); upd(); }; r.appendChild(rm);
        box.appendChild(r);
      });
      const add = el('<button class="btn small" style="margin-bottom:10px;">'+addLabel+'</button>'); add.onclick=()=>{ arr.push(Object.assign({}, blank)); draw(); };
      box.appendChild(add);
    }
    draw();
  }
  data.tissus = data.tissus || [];
  const tCols = [['tissu','Tissu',130,'','dl-cr-tissus'],['couleur','Couleur',90],['conso','Conso / pièce',80,'number'],['unite','',60,'select',['kg','m','g']]];
  if(crMoney()) tCols.push(['prix','Prix / unité (DA)',100,'number']);
  lineEditor(tb, data.tissus, tCols, {tissu:'',couleur:'',conso:'',unite:'kg',prix:''}, '+ Ajouter un tissu');
  frow([field('Couleurs disponibles','couleurs',{ph:'ex : Noir, Blanc, Beige'})]);

  sec('4. Tailles');
  const tz = el('<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;"></div>');
  const allT = Array.from(new Set(((DATA.lists||{}).tailles||['XS','S','M','L','XL','XXL']).concat(data.tailles||[])));
  data.tailles = data.tailles || [];
  allT.forEach(t=>{ const lab = el('<label style="display:flex;align-items:center;gap:4px;font-size:13px;border:2px solid #001D51;border-radius:999px;padding:3px 10px;background:#fff;"></label>'); const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = data.tailles.indexOf(t)>=0; cb.onchange = ()=>{ data.tailles = allT.filter(z=> z===t ? cb.checked : data.tailles.indexOf(z)>=0); }; lab.appendChild(cb); lab.appendChild(document.createTextNode(t)); tz.appendChild(lab); });
  m.appendChild(tz);

  sec('5. Fournitures (fermeture, boutons, étiquettes…)');
  const fb = el('<div></div>'); m.appendChild(fb);
  data.fournitures = data.fournitures || [];
  const fCols = [['nom','Fourniture',160],['qte','Qté / pièce',80,'number']];
  if(crMoney()) fCols.push(['prix','Prix unitaire (DA)',110,'number']);
  lineEditor(fb, data.fournitures, fCols, {nom:'',qte:'',prix:''}, '+ Ajouter une fourniture');

  sec('6. Personnalisation et patronage');
  frow([select('Personnalisation','persoTech', [['','Aucune']].concat(Object.keys(PS_TECH).map(k=>[k, PS_TECH[k].label]))), field('Détail (emplacement, taille, couleurs)','persoDetail')]);
  frow([field('Référence patron','refPatron',{ph:'ex : P-201'})]);

  if(crMoney()){
    sec('7. Coûts et prix');
    frow([field('Façon / confection par pièce (DA)','facon',{type:'number', onchange:upd}), field('Personnalisation par pièce (DA)','coutPerso',{type:'number', onchange:upd})]);
    frow([field('Prix de vente prévu (DA)','prixVente',{type:'number', onchange:upd})]);
    m.appendChild(kbox); upd();
  }
  sec('Notes');
  frow([field('Notes','notes',{area:true})]);

  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>'); cancel.onclick = ()=>{ view.crModal=null; render(); };
  let del = null;
  if(mode==='edit'){
    del = el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>');
    del.onclick = ()=>{ if(data.catalogueId){ alert('Ce produit est déjà dans le catalogue : supprime-le d\'abord du catalogue si besoin.'); return; } if(!confirm('Supprimer la fiche '+data.ref+' ?')) return; c.produits = c.produits.filter(x=>x.id!==data.id); view.crModal=null; saveState('Fiche supprimée'); };
  }
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    if(!String(data.nom||'').trim()){ alert('Le nom du produit est obligatoire.'); return; }
    data.nom = String(data.nom).trim();
    { const usedCat = (DATA.catalogue||[]).some(p=>p.id!==data.catalogueId && catNormRef(p.refPatron)===catNormRef(data.refProduit)); const usedCr = c.produits.some(x=>x.id!==data.id && catNormRef(x.refProduit)===catNormRef(data.refProduit)); if(!data.refProduit || usedCat || usedCr){ const keep = data.refProduit; data.refProduit = ''; data.refProduit = nextCatRef(); if(keep) showToast('Référence '+keep+' déjà prise : nouvelle référence '+data.refProduit); } }
    data.tissus = (data.tissus||[]).filter(t=>String(t.tissu||'').trim());
    data.fournitures = (data.fournitures||[]).filter(f=>String(f.nom||'').trim());
    data.etape = Number(data.etape)||0;
    const old = c.produits.find(x=>x.id===data.id);
    if(old && Number(old.etape)!==data.etape){ data.etapesDates = data.etapesDates || {}; data.etapesDates[data.etape] = psNow(); }
    if(data.etape===3 && (!old || Number(old.etape)!==3)){ crSendProto(data); crSendPersoProto(data); }
    if(data.etape>=5) crAutoCatalogue(data);
    const i = c.produits.findIndex(x=>x.id===data.id);
    if(i>=0) c.produits[i] = data; else c.produits.push(data);
    view.crModal = null; view.crView = data.id;
    saveState('Fiche '+data.ref+' enregistrée');
  };
  actions.appendChild(cancel); if(del) actions.appendChild(del); actions.appendChild(save);
  m.appendChild(actions);
  overlay.appendChild(m);
  overlay.onclick = (e)=>{ if(e.target===overlay){ view.crModal=null; render(); } };
  return overlay;
}

};
function TD(){ DATA.taches = DATA.taches || {}; if(!Array.isArray(DATA.taches.items)) DATA.taches.items = []; DATA.taches.cfg = DATA.taches.cfg || {}; return DATA.taches; }
function tdRetardPct(){ const v = TD().cfg.retardPct; return (v===undefined || v==='' || v===null) ? 50 : Math.max(0, Math.min(100, trNum(v))); }
function tdIsAdmin(){ return view.role==='admin'; }
function tdOwner(t){ return t.assigneA==='equipe' ? (t.terminePar||'') : t.assigneA; }
function tdIsMine(t){ return t.assigneA===view.personId || (t.assigneA==='equipe' && (t.statut==='ouverte' || t.terminePar===view.personId)); }
function tdVisible(){ const all = TD().items; return tdIsAdmin() ? all : all.filter(tdIsMine); }
function tdName(id){ if(id==='equipe') return 'Toute l\u2019équipe'; const p = (DATA.people||[]).find(x=>x.id===id); return p ? p.name : '—'; }
function tdInitials(id){ if(id==='equipe') return '★'; const n = tdName(id); return n==='—' ? '?' : n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function tdDeadline(t){ if(!t.echeance) return null; return new Date(t.echeance+'T'+(t.heure||'23:59')+':00'); }
function tdLate(t){ const d = tdDeadline(t); if(!d) return false; const ref = (t.statut==='ouverte') ? new Date() : new Date(t.termineLe||Date.now()); return ref > d; }
function tdDueTxt(t){
  if(!t.echeance) return '';
  const r = psDays(todayISO(), t.echeance);
  const lbl = r===0 ? 'Aujourd\'hui' : (r===1 ? 'Demain' : (r===-1 ? 'Hier' : fmtDate(t.echeance)));
  return lbl+(t.heure?' '+t.heure:'');
}
function tdEarned(t){ return t.statut==='validee' ? trNum(t.pointsGagnes) : 0; }
function tdNew(assignee){ return {id:'td_'+Date.now()+Math.floor(Math.random()*1000), titre:'', note:'', assigneA:assignee||'', creePar:view.personId, creeLe:psNow(), echeance:'', heure:'', points:10, important:false, maJournee:'', etapes:[], statut:'ouverte', termineLe:'', valideLe:'', pointsGagnes:0}; }
function tdComplete(t){
  t.termineLe = psNow(); t.terminePar = view.personId;
  if(tdIsAdmin() || t.assigneA===t.creePar){ tdValidate(t, true); return; }
  t.statut = 'soumise'; t.refus = '';
  saveState('Tâche terminée : '+t.titre+' (en attente de validation)');
}
function tdValidate(t, silent){
  const late = tdLate(t);
  t.statut = 'validee'; t.valideLe = psNow(); t.validePar = view.personId; t.enRetard = late;
  t.pointsGagnes = late ? Math.round(trNum(t.points)*tdRetardPct()/100) : trNum(t.points);
  saveState('Tâche validée : '+t.titre+' · +'+t.pointsGagnes+' pts'+(late?' (en retard)':''));
}
function tdReopen(t, motif){ t.statut = 'ouverte'; t.termineLe = ''; if(t.assigneA==='equipe') t.terminePar = ''; t.valideLe = ''; t.pointsGagnes = 0; t.enRetard = false; if(motif!==undefined) t.refus = motif; saveState('Tâche rouverte : '+t.titre); }
function tdCounts(){
  const v = tdVisible(), today = todayISO();
  return {
    jour: v.filter(t=>t.statut==='ouverte' && (t.maJournee===today || t.echeance===today || (t.echeance && t.echeance<today))).length,
    important: v.filter(t=>t.statut==='ouverte' && t.important).length,
    planifiees: v.filter(t=>t.statut==='ouverte' && t.echeance).length,
    toutes: v.filter(t=>t.statut==='ouverte').length,
    mes: v.filter(t=>t.statut==='ouverte').length,
    avalider: TD().items.filter(t=>t.statut==='soumise').length,
    terminees: v.filter(t=>t.statut!=='ouverte').length
  };
}
function tdBadge(){ if(tdIsAdmin()) return TD().items.filter(t=>t.statut==='soumise').length; return TD().items.filter(t=>t.statut==='ouverte' && tdIsMine(t)).length; }
function tdFilter(list){
  const v = tdVisible(), today = todayISO();
  if(list==='jour') return v.filter(t=>t.statut==='ouverte' && (t.maJournee===today || t.echeance===today || (t.echeance && t.echeance<today)));
  if(list==='important') return v.filter(t=>t.statut==='ouverte' && t.important);
  if(list==='planifiees') return v.filter(t=>t.statut==='ouverte' && t.echeance);
  if(list==='toutes' || list==='mes') return v.filter(t=>t.statut==='ouverte' || t.statut==='soumise');
  if(list==='avalider') return TD().items.filter(t=>t.statut==='soumise');
  if(list==='terminees') return v.filter(t=>t.statut!=='ouverte');
  if(list.indexOf('p:')===0){ const id = list.slice(2); return TD().items.filter(t=>(t.assigneA===id || tdOwner(t)===id) && t.statut!=='validee'); }
  return v;
}
function tdSort(a,b){
  const so = s=>s==='ouverte'?0:(s==='soumise'?1:2);
  return so(a.statut)-so(b.statut) || (b.important?1:0)-(a.important?1:0) || String(a.echeance||'9999')+String(a.heure||'99').localeCompare(String(b.echeance||'9999')+String(b.heure||'99')) || String(b.creeLe).localeCompare(String(a.creeLe));
}
function tdListTitle(list){
  const T = {jour:'Ma journée', important:'Importantes', planifiees:'Planifiées', toutes:'Toutes les tâches', mes:'Mes tâches', avalider:'À valider', terminees:'Terminées', points: tdIsAdmin()?'Classement des points':'Mes points'};
  if(list.indexOf('p:')===0) return 'Tâches de '+tdName(list.slice(2));
  return T[list]||'Tâches';
}
function tdPointsOf(id, month){
  return TD().items.filter(t=>tdOwner(t)===id && t.statut==='validee' && (!month || String(t.valideLe||'').slice(0,7)===month)).reduce((a,t)=>a+tdEarned(t),0);
}

    if(t.refus && t.statut==='ouverte') meta.push('<b style="color:#E0392D">refusée : '+esc(t.refus)+'</b>');

    [['','— Pour qui ? —'],['equipe','★ Toute l\u2019équipe (la 1re personne qui la fait gagne les points)']].concat((DATA.people||[]).filter(p=>p.active!==false).map(p=>[p.id,p.name])).forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if(v===def) o.selected=true; who.appendChild(o); });
    const due = document.createElement('input'); due.type='date'; due.className='td-add-sel'; if(st.list==='jour') due.value = todayISO();

    main.appendChild(add);

  if(admin){ const del = el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>'); del.onclick = ()=>{ if(!confirm('Supprimer la tâche « '+t.titre+' » ?')) return; TD().items = TD().items.filter(z=>z.id!==t.id); view.td.sel = null; saveState('Tâche supprimée'); }; act.appendChild(del); }
  d.appendChild(act);
  return d;

function tdPointsView(main){
  const admin = tdIsAdmin();
  const month = todayISO().slice(0,7);
  view.td.per = view.td.per || 'mois';
  const row = el('<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;"></div>');
  [['mois','Ce mois-ci'],['tout','Depuis le début']].forEach(([v,l])=>row.appendChild(trBtn(l, ()=>{ view.td.per = v; render(); }, view.td.per===v)));
  main.appendChild(row);
  const m = view.td.per==='mois' ? month : '';
  const stats = id=>{
    const mine = TD().items.filter(t=>tdOwner(t)===id);
    const val = mine.filter(t=>t.statut==='validee' && (!m || String(t.valideLe||'').slice(0,7)===m));
    const ontime = val.filter(t=>!t.enRetard).length;
    return {pts: val.reduce((a,t)=>a+tdEarned(t),0), val: val.length, ontime: ontime, pct: val.length ? Math.round(100*ontime/val.length) : null,
      ouvertes: mine.filter(t=>t.statut==='ouverte').length, retard: mine.filter(t=>t.statut==='ouverte' && tdLate(t)).length, total: tdPointsOf(id,'')};
  };
  if(admin){
    const ppl = (DATA.people||[]).filter(p=>p.active!==false).map(p=>Object.assign({p:p}, stats(p.id))).filter(x=>x.val||x.ouvertes||x.total).sort((a,b)=>b.pts-a.pts || b.val-a.val);
    if(!ppl.length){ main.appendChild(el('<div class="td-empty">Pas encore de points. Donne des tâches à ton équipe !</div>')); }
    else {
      const medal = i=>i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
      main.appendChild(trTable(['Rang','Personne','Points','Tâches validées','À temps','En cours','En retard'], ppl.map((x,i)=>['<b style="font-size:16px;">'+medal(i)+'</b>', '<b>'+esc(x.p.name)+'</b><br><span style="font-size:11px">'+esc(ROLE_LABEL[x.p.role]||x.p.role)+'</span>', '<b style="font-size:16px;">'+x.pts+'</b>', x.val, x.pct===null?'—':x.pct+' %', x.ouvertes, x.retard?'<b style="color:#E0392D">'+x.retard+'</b>':'0'])));
    }
    const cfg = el('<div class="td-card" style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><span>Tâche rendue après l\'échéance :</span></div>');
    const ri = document.createElement('input'); ri.type='number'; ri.min='0'; ri.max='100'; ri.value = tdRetardPct(); ri.style.width='80px';
    const sv = el('<button class="btn small primary">Enregistrer</button>'); sv.onclick = ()=>{ TD().cfg.retardPct = trNum(ri.value); saveState('Règle des points enregistrée'); };
    cfg.appendChild(ri); cfg.appendChild(el('<span>% des points</span>')); cfg.appendChild(sv);
    main.appendChild(cfg);
  } else {
    const x = stats(view.personId);
    const k = el('<div class="kpi-row"></div>');
    k.appendChild(el('<div class="kpi" style="background:#FFC933;"><div class="num">'+x.pts+'</div><div class="label">Points '+(m?'ce mois-ci':'au total')+'</div></div>'));
    k.appendChild(el('<div class="kpi"><div class="num">'+x.val+'</div><div class="label">Tâches validées</div></div>'));
    k.appendChild(el('<div class="kpi"><div class="num">'+(x.pct===null?'—':x.pct+' %')+'</div><div class="label">Rendues à temps</div></div>'));
    k.appendChild(el('<div class="kpi'+(x.retard?' alert':'')+'"><div class="num">'+x.ouvertes+'</div><div class="label">À faire'+(x.retard?' · '+x.retard+' en retard':'')+'</div></div>'));

const MAT_CATS = ['Accessoire','Fourniture','Étiquette','Emballage'];
const MAT_UNITES = ['pièce','m','cône','rouleau','kg','paquet','boîte'];
function MAT(){ DATA.matieres = DATA.matieres || {}; const M = DATA.matieres; if(!Array.isArray(M.fournitures)) M.fournitures = []; if(!Array.isArray(M.mvt)) M.mvt = []; return M; }
function matF(id){ return MAT().fournitures.find(f=>f.id===id); }
function matStock(id){ let s=0; MAT().mvt.forEach(m=>{ if(m.fid===id) s += (m.type==='entree'?1:-1)*trNum(m.qte); }); return s; }
// commandes encore à produire (confection pas terminée)
function matCmdActives(){ return (DATA.commandes||[]).filter(c=>c.confection && c.confection.statut!=='Prête' && c.confection.statut!=='Annulée' && !c.fournSortie); }
function matBesoinsCmd(c){
  const p = c.catalogueId ? catalogueById(c.catalogueId) : null; const q = trNum(c.quantite);
  if(!p || !Array.isArray(p.fournitures) || !q) return [];
  return p.fournitures.filter(x=>x.fid && trNum(x.qte)>0).map(x=>({fid:x.fid, qte:trNum(x.qte)*q}));
}
function matReserve(id){ let r=0; matCmdActives().forEach(c=>matBesoinsCmd(c).forEach(b=>{ if(b.fid===id) r+=b.qte; })); return r; }
function matEtat(f){
  const st = matStock(f.id), res = matReserve(f.id), dispo = st-res, seuil = trNum(f.seuil);
  if(st<=0 && res>0) return {st, res, dispo, key:'manque', label:'Manque', color:'#FF5A4D'};
  if(dispo<0) return {st, res, dispo, key:'insuffisant', label:'Insuffisant', color:'#FF5A4D'};
  if(st<=0) return {st, res, dispo, key:'vide', label:'Épuisé', color:'#FFC933'};
  if(seuil && dispo<seuil) return {st, res, dispo, key:'bas', label:'Stock bas', color:'#FFC933'};
  return {st, res, dispo, key:'ok', label:'OK', color:'#37D6A5'};
}
function matAlertes(){ return MAT().fournitures.map(f=>Object.assign({f:f}, matEtat(f))).filter(x=>x.key!=='ok'); }
function matCheckCmd(c){
  // manques pour une commande donnée (en tenant compte des autres commandes déjà prévues)
  const others = matCmdActives().filter(x=>x.id!==c.id);
  return matBesoinsCmd(c).map(b=>{ const f = matF(b.fid); if(!f) return null; const st = matStock(f.id); let autres = 0; others.forEach(o=>matBesoinsCmd(o).forEach(z=>{ if(z.fid===f.id) autres += z.qte; })); const dispo = st - autres; return {f:f, besoin:b.qte, dispo:dispo, manque: Math.max(0, b.qte-dispo)}; }).filter(Boolean);
}
// sortie automatique quand la confection d'une commande est terminée
function matSync(){
  const M = MAT();
  if(!M.initDone){ (DATA.commandes||[]).forEach(c=>{ if(c.confection && c.confection.statut==='Prête') c.fournSortie = true; }); M.initDone = true; return; }
  (DATA.commandes||[]).forEach(c=>{
    if(c.confection && c.confection.statut==='Prête' && !c.fournSortie){
      matBesoinsCmd(c).forEach(b=>M.mvt.push({id:'mm_'+Date.now()+Math.floor(Math.random()*10000), fid:b.fid, type:'sortie', qte:b.qte, date:todayISO(), note:'Commande '+(c.reference||''), auto:true}));
      c.fournSortie = true;
    }
  });
}

  function frow(fields){ const r = el('<div class="frow"></div>'); fields.forEach(f=>r.appendChild(f)); m.appendChild(r); }
  function field(label, key, opt){ opt=opt||{}; const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>')); const i = document.createElement('input'); i.type = opt.type||'text'; if(opt.ph) i.placeholder = opt.ph; if(opt.type==='number'){ i.step='any'; i.min='0'; } i.value = data[key]==null?'':data[key]; i.oninput = ()=>data[key]=i.value; w.appendChild(i); return w; }
  function select(label, key, opts){ const w = el('<div></div>'); w.appendChild(el('<label>'+label+'</label>')); const s = document.createElement('select'); opts.forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; if(String(v)===String(data[key])) o.selected=true; s.appendChild(o); }); s.onchange = ()=>data[key]=s.value; w.appendChild(s); return w; }
  if(type==='f'){
    frow([field('Nom *','nom',{ph:'ex : Fermeture éclair 20 cm'}), select('Catégorie','categorie', MAT_CATS.map(c=>[c,c]))]);
    frow([select('Unité','unite', MAT_UNITES.map(u=>[u,u])), field('Couleur','couleur',{ph:'ex : NOIR'})]);
    frow([field('Seuil d\'alerte','seuil',{type:'number', ph:'ex : 200'}), field('Prix unitaire (DA)','prix',{type:'number'})]);
  } else {
    frow([select('Article','fid', M.fournitures.map(f=>[f.id, f.nom+(f.couleur?' '+f.couleur:'')+' (stock '+fmtQ(matStock(f.id))+' '+f.unite+')'])), select('Type','type',[['entree','Entrée (achat / réception)'],['sortie','Sortie (utilisation / perte)']])]);
    frow([field('Quantité *','qte',{type:'number'}), field('Date','date',{type:'date'})]);
    frow([field('Note','note',{ph:'ex : fournisseur, bon n°…'})]);
  }
  const actions = el('<div class="actions"></div>');
  const cancel = el('<button class="btn">Annuler</button>'); cancel.onclick = ()=>{ view.matModal=null; render(); };
  actions.appendChild(cancel);
  if(type==='f' && mode==='edit'){
    const del = el('<button class="btn" style="color:#A42834;border-color:#A42834;">Supprimer</button>');
    del.onclick = ()=>{ if((DATA.catalogue||[]).some(p=>(p.fournitures||[]).some(z=>z.fid===data.id))){ alert('Impossible : un produit du catalogue utilise cet article.'); return; } if(!confirm('Supprimer « '+data.nom+' » et son historique ?')) return; M.fournitures = M.fournitures.filter(f=>f.id!==data.id); M.mvt = M.mvt.filter(x=>x.fid!==data.id); view.matModal=null; saveState('Article supprimé'); };
    actions.appendChild(del);
  }
  const save = el('<button class="btn primary">Enregistrer</button>');
  save.onclick = ()=>{
    if(type==='f'){
      if(!String(data.nom||'').trim()){ alert('Le nom est obligatoire.'); return; }
      data.nom = String(data.nom).trim(); data.couleur = String(data.couleur||'').trim().toUpperCase();
      const i = M.fournitures.findIndex(f=>f.id===data.id); if(i>=0) M.fournitures[i]=data; else M.fournitures.push(data);
      view.matModal=null; saveState('Article enregistré : '+data.nom); return;
    }
    if(!(trNum(data.qte)>0)){ alert('Indique une quantité.'); return; }
    data.par = view.personId; M.mvt.push(data); view.matModal=null;
    saveState((data.type==='entree'?'Entrée':'Sortie')+' enregistrée');
  };
  actions.appendChild(save); m.appendChild(actions);
  overlay.appendChild(m); overlay.onclick = e=>{ if(e.target===overlay){ view.matModal=null; render(); } };
  return overlay;
}

// ---------- Synchronisation sécurisée (plusieurs personnes en même temps) ----------
// Chaque enregistrement porte un numéro de version (_rev). Si quelqu'un d'autre a enregistré
// entre-temps (onglet resté ouvert, autre téléphone...), on FUSIONNE au lieu d'écraser.
let BASE = null;          // copie de ce que la base contenait au dernier chargement / enregistrement
let REMOTE_REV = null;    // numéro de version connu de la base
function cloneJSON(x){ return JSON.parse(JSON.stringify(x)); }
function sameJSON(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function isIdArray(a){ return Array.isArray(a) && a.every(x=>x && typeof x==='object' && !Array.isArray(x) && x.id!=null); }
function isPlainObj(o){ return o && typeof o==='object' && !Array.isArray(o); }
// fusion à 3 voies : l = ma version, b = version de départ, r = version actuelle de la base
function mergeValue(l,b,r){
  if(sameJSON(l,b)) return r;
  if(sameJSON(r,b)) return l;
  if(sameJSON(l,r)) return l;
  if(Array.isArray(l) && Array.isArray(r)){
    const bb = Array.isArray(b) ? b : [];
    if(isIdArray(l) && isIdArray(r) && isIdArray(bb)){
      const bm = new Map(bb.map(x=>[x.id,x])), lm = new Map(l.map(x=>[x.id,x])), rm = new Map(r.map(x=>[x.id,x]));
      const out = [];
      r.forEach(rx=>{
        const bx = bm.get(rx.id), lx = lm.get(rx.id);
        if(bx && !lx){ if(sameJSON(rx,bx)) return; out.push(rx); return; }   // supprimé chez moi : on retire (sauf si modifié ailleurs)
        if(!bx && !lx){ out.push(rx); return; }                               // ajouté par un autre
        if(!bx && lx){ out.push(mergeValue(lx,{},rx)); return; }
        out.push(mergeValue(lx,bx,rx));
      });
      l.forEach(lx=>{ if(!rm.has(lx.id)){ const bx = bm.get(lx.id); if(!bx || !sameJSON(lx,bx)) out.push(lx); } });  // ajouté chez moi (ou modifié alors que supprimé ailleurs)
      return out;
    }
    if(l.concat(r).every(x=>typeof x!=='object' || x===null)){
      const bb2 = Array.isArray(b) ? b : [];
      const added = l.filter(x=>bb2.indexOf(x)<0), removed = bb2.filter(x=>l.indexOf(x)<0);
      const out = r.filter(x=>removed.indexOf(x)<0);
      added.forEach(x=>{ if(out.indexOf(x)<0) out.push(x); });
      return out;
    }
    return l;
  }
  if(isPlainObj(l) && isPlainObj(r)){
    const bb = isPlainObj(b) ? b : {};
    const out = {};
    new Set(Object.keys(l).concat(Object.keys(r))).forEach(k=>{
      if(!(k in l)){ if(k in bb && sameJSON(r[k],bb[k])) return; out[k]=r[k]; return; }
      if(!(k in r)){ if(k in bb && sameJSON(l[k],bb[k])) return; out[k]=l[k]; return; }
      out[k] = mergeValue(l[k], bb[k], r[k]);
    });
    return out;
  }
  return l;
}
function mergeDoc(local, base, remote){
  const out = mergeValue(local, base||{}, remote);
  // les messages de discussion : on garde l'union
  const seen = new Set(), msgs = [];
  (remote.messages||[]).concat(local.messages||[]).forEach(m=>{ if(m && m.id && !seen.has(m.id)){ seen.add(m.id); msgs.push(m); } });
  msgs.sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
  out.messages = msgs.length>200 ? msgs.slice(-200) : msgs;
  // clients créés automatiquement en double par deux appareils : on garde le premier de chaque nom
  if(Array.isArray(out.clients)){
    const names = new Set();
    out.clients = out.clients.filter(c=>{ const k = (typeof normName==='function') ? normName(c.nom) : String(c.nom||'').trim().toLowerCase(); if(!k) return true; if(names.has(k)) return false; names.add(k); return true; });
  }
  return out;
}
async function fetchRemoteRev(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main&select=data->_rev`, { headers:{ 'apikey': SUPABASE_KEY }, cache:'no-store' });
    if(!res.ok) return undefined;
    const rows = await res.json();
    if(!rows || !rows.length) return undefined;
    const v = rows[0]._rev;
    return v==null ? 0 : Number(v);
  }catch(e){ return undefined; }
}
async function fetchRemoteDoc(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main`, { headers:{ 'apikey': SUPABASE_KEY }, cache:'no-store' });
    if(!res.ok) return null;
    const txt = await res.text();
    const rows = JSON.parse(txt);
    return (rows && rows.length && rows[0].data) ? rows[0].data : null;
  }catch(e){ return null; }
}

// Lecture : la clé publishable s'envoie uniquement dans l'en-tête apikey.
// Pas d'en-tête Authorization : la clé sb_publishable_ n'est pas un JWT.
let LOAD_FAILED = false;
async function loadDataFromSupabase(){
  const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const timer = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, 15000);
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main`, {
      headers: { 'apikey': SUPABASE_KEY }, cache:'no-store', signal: ctl ? ctl.signal : undefined
    });
    clearTimeout(timer);
    if(!res.ok){
      console.log('Chargement Supabase échoué:', res.status, await res.text());
      if(BASE===null) LOAD_FAILED = true;
      return;
    }
    const txt = await res.text();
    const rows = JSON.parse(txt);
    if(rows && rows.length && rows[0].data){
      // on garde les valeurs par défaut pour toute clé absente de la base
      DATA = Object.assign({}, DATA, rows[0].data);
      BASE = JSON.parse(txt)[0].data;
      REMOTE_REV = Number(rows[0].data._rev||0);
      LOAD_FAILED = false;
    } else if(BASE===null) LOAD_FAILED = true;
  } catch(e){
    clearTimeout(timer);
    console.log('Supabase non disponible:', e.message);
    if(BASE===null) LOAD_FAILED = true;
  }
}

async function patchIfRev(doc, rev){
  const cond = rev ? `data->>_rev=eq.${rev}` : `data->>_rev=is.null`;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_data?id=eq.main&${cond}&select=id`, {
    method: 'PATCH',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify({ data: doc })
  });
  if(!res.ok){ console.log('Enregistrement Supabase échoué:', res.status, await res.text()); return {ok:false, conflict:false}; }
  const rows = await res.json().catch(()=>[]);
  return (rows && rows.length) ? {ok:true} : {ok:false, conflict:true};
}

let saveChain = Promise.resolve(true);
let lastMergeNotice = 0;
function saveToSupabase(){
  saveChain = saveChain.then(doSave, doSave);
  return saveChain;
}
async function doSave(){
  if(LOAD_FAILED || BASE===null){ showToast('⚠ Données non chargées : rien n\'a été enregistré. Recharge la page.'); return false; }
  try{
    let merged = false;
    for(let attempt=0; attempt<4; attempt++){
      const doc = Object.assign({}, DATA, {_rev: (REMOTE_REV||0)+1});
      const r = await patchIfRev(doc, REMOTE_REV||0);
      if(r.ok){
        REMOTE_REV = doc._rev; DATA._rev = doc._rev;
        BASE = cloneJSON(doc);
        if(merged){ render(); if(Date.now()-lastMergeNotice>4000){ lastMergeNotice=Date.now(); showToast('↻ Données mises à jour avec les changements des autres'); } }
        return true;
      }
      if(!r.conflict) return false;
      // quelqu'un d'autre a enregistré entre-temps : on fusionne avec sa version
      const remote = await fetchRemoteDoc();
      if(!remote) return false;
      const m = mergeDoc(DATA, BASE, remote);
      DATA = Object.assign({}, DATA, m);
      Object.keys(DATA).forEach(k=>{ if(!(k in m)) delete DATA[k]; });
      BASE = cloneJSON(remote);
      REMOTE_REV = Number(remote._rev||0);
      merged = true;
    }
    return false;
  } catch(e){
    console.log('Erreur Supabase:', e.message);
    return false;
  }
}

async function saveState(toastMsg){
  try{ matSync(); }catch(e){ console.log('matSync', e); }
  render();
  const ok = await saveToSupabase();
  if(!ok){
    showToast("⚠ Échec de l'enregistrement, vérifiez la connexion");
    return;
  }
  if(toastMsg) showToast('✓ '+toastMsg);
}

// Rafraîchissement automatique : si quelqu'un d'autre a modifié les données, on les récupère.
let refreshBusy = false;
function userIsEditing(){
  if(view.modal||view.matModal||view.matEdit||view.tricoModal||view.psModal||view.crModal||(view.todoOpen && view.td && view.td.sel)||view.personModal||view.catalogueModal||view.clientModal||view.payModal||view.settingsModal||view.importModal||view.scanModal) return true;
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
async function refreshIfStale(){
  if(refreshBusy || document.hidden || !view.personId || BASE===null) return;
  refreshBusy = true;
  try{
    const rev = await fetchRemoteRev();
    if(rev===undefined || rev===REMOTE_REV) return;
    if(userIsEditing()) return;          // on ne dérange pas une saisie en cours
    const remote = await fetchRemoteDoc();
    if(!remote) return;
    const msgsLocal = DATA.messages;
    const m = mergeDoc(DATA, BASE, remote);
    DATA = Object.assign({}, DATA, m);
    BASE = cloneJSON(remote);
    REMOTE_REV = Number(remote._rev||0);
    DATA._rev = REMOTE_REV;
    render();
    if(psMigrateSteps() + crMigrateSteps()) saveToSupabase();
  } finally { refreshBusy = false; }
}

// Session : on garde la personne connectée même si on actualise la page.
function saveSession(id){
  try { localStorage.setItem('dj_session', id); } catch(e){}
}
function clearSession(){
  try { localStorage.removeItem('dj_session'); } catch(e){}
}
function restoreSession(){
  let id = null;
  try { id = localStorage.getItem('dj_session'); } catch(e){}
  if(!id) return;
  const person = (DATA.people||[]).find(p=>p.id===id && p.active!==false);
  if(!person){ clearSession(); return; }
  view.personId = person.id;
  view.role = person.role;
  view.screen = screenForRole(person.role);
}

async function boot(){
  try{ view.scanId = new URLSearchParams(location.search).get('cmd'); view.lotScanId = new URLSearchParams(location.search).get('lot'); view.psScanId = new URLSearchParams(location.search).get('perso'); view.crScanId = new URLSearchParams(location.search).get('crea'); }catch(e){}
  await loadDataFromSupabase();
  restoreSession();
  if(view.personId && (psMigrateSteps() + crMigrateSteps())) saveToSupabase();
  if(!view.personId && view.scanId){
    // visiteur sans compte (client) : le QR ouvre le suivi de la commande
    const c = (DATA.commandes||[]).find(x=>x.id===view.scanId);
    if(c){ view.trackId = c.id; view.trackRef = c.reference; view.trackSearched = true; }
  }
  if(!view.personId && view.crScanId){
    // visiteur sans compte : le QR d'une création ouvre son suivi
    const x = (((DATA.crea||{}).produits)||[]).find(p=>p.id===view.crScanId);
    if(x){ view.trackCrId = x.id; view.trackRef = x.refProduit || x.ref; view.trackSearched = true; }
    view.crScanId = null;
  }
  if(!view.personId && view.psScanId){
    // visiteur sans compte : le QR d'une personnalisation ouvre son suivi
    const j = (((DATA.perso||{}).jobs)||[]).find(p=>p.id===view.psScanId);
    if(j){ view.trackPsId = j.id; view.trackRef = j.ref; view.trackSearched = true; }
    view.psScanId = null;
  }
  applyScan();
  render();
  // Discussion en direct : on récupère les nouveaux messages toutes les 4 secondes
  setInterval(pollMessages, 4000);
  setInterval(refreshIfStale, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ pollMessages(); refreshIfStale(); } });
}

boot();
